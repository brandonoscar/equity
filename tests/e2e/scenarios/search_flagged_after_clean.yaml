name: search_flagged_after_clean
doc: A flagged name (withheld) still comes back, after the clean one with the same score.
sources:
  oh.testsearch.parcels:
    party:
    - party_id: p0
      raw_name: TESTOWNER ALPHA SMITH
    - party_id: p1
      raw_name: TESTOWNER ALPHA SMITH WITHHELD
expect:
- search:
    query: TESTOWNER ALPHA SMITH
    top: oh.testsearch.parcels:p0
