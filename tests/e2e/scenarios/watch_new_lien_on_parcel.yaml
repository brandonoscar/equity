name: watch_new_lien_on_parcel
doc: A lien recorded against a watched parcel after the first check is reported new; a watched name gets
  it too.
sources:
  oh.testcounty.parcels:
    party:
    - party_id: o1
      raw_name: TESTOWNER ALPHA SMITH
      address_id: a1
    owner_snapshot:
    - party_id: o1
      parcel_uid: 39001-0001
      observed_on: '2026-11-01'
    parcel:
    - parcel_uid: 39001-0001
      jurisdiction: '39001'
      situs_address_id: a2
    parcel_assessment:
    - parcel_uid: 39001-0001
      tax_year: 2025
      appraised_total: 200000
      valid_from: '2025-01-01'
      homestead: null
    address:
    - address_id: a1
      line1: 1 ELM TEST ST
      city: TESTVILLE
      state: OH
      zip5: '43001'
    - address_id: a2
      line1: 2 ELM TEST ST
      city: TESTVILLE
      state: OH
      zip5: '43001'
  oh.testcounty.liens:
    party:
    - party_id: d1
      raw_name: TESTOWNER ALPHA SMITH
      address_id: a9
    instrument:
    - instrument_uid: i1
      doc_type: JUDGMENT_LIEN
      recorded_on: '2025-01-15'
      principal_amount: 25000
    instrument_party:
    - instrument_uid: i1
      party_id: d1
      role: debtor
    address:
    - address_id: a9
      line1: 9 ELM TEST ST
      city: TESTVILLE
      state: OH
      zip5: '44999'
expect:
- watch:
    entries:
    - parcel: 39001-0001
    - ref: oh.testcounty.liens:d1
    new:
    - - LIS_PENDENS recorded 2026-10-01 against 39001-0001 ($90,000)
    - - LIS_PENDENS recorded 2026-10-01 (debtor) $90,000
then:
  oh.testcounty.liens:
    instrument:
    - instrument_uid: lp1
      doc_type: LIS_PENDENS
      recorded_on: '2026-10-01'
      principal_amount: 90000
    instrument_parcel:
    - instrument_uid: lp1
      parcel_uid: 39001-0001
    instrument_party:
    - instrument_uid: lp1
      party_id: d1
      role: debtor
