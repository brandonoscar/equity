[project]
name = "equity"
version = "0.1.0"
description = "Deterministic land and court records graph: debtors, entities, parcels, liens, judgments."
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "pytz>=2024.1",  # duckdb needs it to return TIMESTAMPTZ values
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "types-pytz>=2024.1",
    "detect-secrets>=1.5",
    "mutmut>=3.2",
    "pip-audit>=2.7",       # known-vulnerability scan of the locked dependencies
    "actionlint-py>=1.7",   # lints .github/workflows
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "ci"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "DTZ", "PT"]
ignore = [
    "S101",  # assert is how pytest works
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S608",   # tests build SQL against fixture tables
    "PT018",  # compound asserts are clearer for paired facts
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --strict-markers -p no:cacheprovider"
xfail_strict = true

[tool.coverage.run]
source = ["equity"]
branch = true

[tool.mutmut]
# Nightly only. Mutates the deterministic rule and matching code; runs their dedicated tests.
source_paths = ["src/equity/rules/", "src/equity/matching/"]
also_copy = ["config/", "ci/", "tests/", "src/equity/"]
pytest_add_cli_args_test_selection = ["tests/rules/", "tests/matching/"]
