name: nightly

on:
  schedule:
    - cron: "41 8 * * *"   # 08:41 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UV_VERSION: "0.11.32"

jobs:
  adapter-health:
    # Live check of every registered adapter against its recorded fixture shape.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { version: "${{ env.UV_VERSION }}" }
      - run: make sync
      - id: health
        run: |
          set +e
          uv run --locked python -m equity.adapters.health > health.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
      - id: history
        # Row counts and fields per source, day by day (equity.health_history), kept in object
        # storage under health/. Compared with the previous day and with recent lake refreshes.
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set +e
          if [ -n "$SUPABASE_SECRET_KEY" ]; then
            uv run --locked python -m equity.lake_sync pull-dir health data/health
            uv run --locked python -m equity.lake_sync pull-state
          fi
          uv run --locked python -m equity.health_history --health health.json > alerts.json
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat alerts.json
          if [ -n "$SUPABASE_SECRET_KEY" ]; then
            uv run --locked python -m equity.lake_sync push-dir data/health health
          fi
      - if: steps.history.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Source health alert $(date -u +%F)"
          if ! gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
            { echo "Row counts fell more than 10%, fields changed, or a source went down:"; echo '```json'; head -c 60000 alerts.json; echo; echo '```'; } > body.md
            gh issue create --title "$title" --body-file body.md
          fi
      - if: steps.health.outputs.rc != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Adapter health failure $(date -u +%F)"
          if ! gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' | grep -q .; then
            # Only the failing adapters, and capped: an issue body is limited to 65,536 characters
            # (the full report of 1,000+ adapters is longer, and gh issue create then fails).
            jq '{adapters, failed: [.results[] | select(.ok | not)]}' health.json | head -c 60000 > failed.json
            { echo "A source changed format or went down. Failing adapters:"; echo '```json'; cat failed.json; echo; echo '```'; } > body.md
            gh issue create --title "$title" --body-file body.md
          fi

  mutation:
    # Mutation testing on rules/ and matching/. Surviving mutants become an issue.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with: { version: "${{ env.UV_VERSION }}" }
      - run: make sync
      - run: uv run --locked mutmut run || true
      - id: survivors
        run: |
          uv run --locked mutmut results > mutants.txt || true
          n=$(grep -c ': survived' mutants.txt || true)
          echo "count=${n:-0}" >> "$GITHUB_OUTPUT"
      - if: steps.survivors.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Surviving mutants $(date -u +%F)"
          { echo "Mutants that no test killed (rules/ and matching/):"; echo '```'; grep ': survived' mutants.txt; echo '```'; } > body.md
          gh issue create --title "$title" --body-file body.md
