source_id: ca.san_jose.parcels
state: CA
api: socrata
# "Parcels by Owner" on the Metropolitan Transportation Commission / ABAG open-data portal
# (data.bayareametro.gov, provenance 'official'): the City of San Jose parcel layer (its
# csjdept / insanjoseflag / councildistrict columns) joined to the Santa Clara County
# assessor roll, one row per APN. 259,437 rows on 2026-11-25 (256,003 with an APN), assessee
# filled on every row, with the mailing address and the last transfer date. Santa Clara
# County itself publishes no owner names; this covers the City of San Jose only.
layer_url: https://data.bayareametro.gov/resource/mcq4-ezqk.json
filter: "apn IS NOT NULL"
order_by: objectid
page_size: 10000
row_window: 100000
min_interval_s: 1.0           # robots.txt Crawl-delay: 1
county: {constant: "085"}
fields:
  parcel_id: apn              # Santa Clara County APN without dashes, e.g. '46714003'
  owner1: assessee
  owner_type: ownergroup      # 'Private', 'County of Santa Clara', ...
  mail_line1: mailingaddress
  mail_city_state_zip: {join: [mailingcitystate, mailingzip]}   # 'SAN JOSE  CA' + '95110'
  situs_line1: [streetnumber, streetnumsuffix, streetdir, streetname, streettype, unitnumber]
  situs_city: city
  situs_zip: zipcode
  land_use_code: usecode
  land_use_desc: usecodedescription
value_basis: "landvalue / improvementvalue (zero-padded roll values) are not mapped: the table carries no roll year, so no assessment rows are produced. transferdate (YYYYMMDD) stays unmapped."
terms:
  url: https://data.bayareametro.gov/d/mcq4-ezqk
  summary: "Metropolitan Transportation Commission / Association of Bay Area Governments open-data portal (Socrata), free, no login or app token; dataset posted by MTC staff with Socrata provenance 'official', data from the City of San Jose parcel layer. No license or use restriction stated on the dataset (read 2026-11-25). data.bayareametro.gov robots.txt allows /resource/ with Crawl-delay: 1."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
