source_id: tx.fort_worth.development_permits
state: TX
county_fips: "48439"   # Tarrant County (the City also reaches into Denton, Parker, Wise, Johnson)
# City of Fort Worth Development Services "Development Permits" (ArcGIS Online
# CFW_Open_Data_Development_Permits_View, 1,626,021 plumbing, electrical, mechanical,
# residential and commercial building, accessory, grading and other permits filed 2001-06 ..
# 2026-11 on 2026-11-25, hourly): permit number, type, subtype, category, work description,
# status, file and status dates, job value, the site address, lot / block / legal
# description and the owner's full name as the applicant gave it. No parcel id: the permit
# is not linked to a parcel (the address stays in the source record). A signal that an owner
# is putting money into a property, not a debt: OTHER instruments, in no match run. Garage
# sale permits (which name residents, not owners) are left out.
api: arcgis
layer_url: https://services5.arcgis.com/3ddLCBXe1bRt7mzj/arcgis/rest/services/CFW_Open_Data_Development_Permits_View/FeatureServer/0
where: "Permit_Type NOT LIKE 'Garage Sale%'"
order_by: [ObjectId]
select: [ObjectId, Unique_ID, Permit_No, Permit_Type, Permit_SubType, Permit_Category,
         B1_WORK_DESC, Addr_No, Direction, Street_Name, Street_Suffix, Full_Street_Address,
         Zip_Code, B1_LOT, B1_BLOCK, B1_TRACT, B1_LEGAL_DESC, Owner_Full_Name, File_Date,
         Current_Status, Status_Date, JobValue, Use_Type, Specific_Use, Units, SqFt]
date_field: File_Date
partition: month   # ~5,000 permits a month; the layer pages 1,000 rows at a time
first_year: 2001
uid: Unique_ID   # 5 repeats of 1,626,021
doc_type: OTHER
doc_type_raw: {field: Permit_Type}
extra_pii: [B1_WORK_DESC, Addr_No, Street_Name, Full_Street_Address, B1_LEGAL_DESC]
parties:
  - {role: other, name: Owner_Full_Name}
terms:
  url: https://www.arcgis.com/home/item.html?id=d2740f4d746b4bfaa03e25de0376238b
  summary: "City of Fort Worth Open Data (ArcGIS Online, CFW_AGOL_ADMIN), free, no login; no licenseInfo or use restriction on the item (read 2026-11-25). services5.arcgis.com/robots.txt answers 403 (RFC 9309: no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
