source_id: nc.forsyth.tax_liens_2025
state: NC
county_fips: "37067"   # Forsyth County (Winston-Salem)
# Forsyth County Tax Administration 2025 tax lien advertisement (G.S. 105-369; ordered
# 2026-02-12, published the week of 2026-05-19): every parcel whose 2025 taxes were still
# unpaid, in three PDFs by owner surname (A-F, G-O, P-Z, linked from the Tax Liens
# Advertisement page), each line the owner listed for taxes, the parcel PIN, the property
# address and the principal 2025 tax unpaid (interest, fees and prior years not included).
# A text PDF read at fixed columns with the in-house reader; a row needs a PIN and an amount,
# so the few owners whose name wraps onto the PIN's line are left out. Unpaid NC property
# tax is a lien on the parcel from January 1 of the tax year (G.S. 105-355), the date used;
# parcels paid since stay on the list. PIN '6835-96-8778.000' is nc.statewide.parcels parno
# '6835-96-8778.00' once its last digit is dropped. Debt kind: tax_delinquency.
api: pdf
url: https://www.forsyth.cc/Tax/advertisement.aspx
link_from:
  page: https://www.forsyth.cc/Tax/advertisement.aspx
  pattern: 'assets/[Dd]ocuments/([A-Z]-[A-Z])\.pdf$'
  all: true
header: "(no header row)"   # the pages print no column header: no line is skipped as one
pdf_columns:
  names: [owner, pin, address, amount]
  cuts: [295, 410, 655]
  require: {pin: '^[0-9]{4}-[0-9]{2}-[0-9]{4}\.[0-9]{3}$', amount: '^[0-9][0-9,]*\.[0-9]{2}$'}
listed_on: tax_year_start
list_date: 2025-01-01
date_field: tax_year_start
uid: pin
doc_type: TAX_LIEN_STATE
doc_type_raw: Forsyth County 2025 tax lien (advertised May 2026)
amount: amount
parties:
  - role: debtor
    name: owner
    address: {line1: address, state_const: NC}   # the property
  - {role: creditor, const: Forsyth County Tax Administration, person_names: false}
parcel:
  kind: pin
  field: pin
  county_fips: "37067"
  rewrite: {pattern: '^(\d{4}-\d{2}-\d{4}\.\d{2})\d$', replace: '\1'}
extra_pii: [address]
terms:
  url: https://www.forsyth.cc/Tax/advertisement.aspx
  summary: "Forsyth County, NC Tax Administration tax lien advertisement page (forsyth.cc), the published G.S. 105-369 lien list as three PDFs, free, no login; no license or use restriction stated. forsyth.cc/robots.txt disallows only a few election and HR paths."
  checked_on: 2026-11-28
  robots_checked_on: 2026-11-28
  cost_model: free
