# Clark County Treasurer "Notice of Delinquent Taxes on Real Property, Fiscal Year 2025-2026"
# (NRS 361.565), the spreadsheet version linked from the published notice: every parcel on
# which all or part of the fiscal-year taxes were still delinquent on 2026-05-06, with the owner
# of record and the taxes, penalty/interest and costs due: 13,984 parcels, $49.2M ($40.8M tax).
# Parcels not paid by 2026-06-01 were taken by certificate to the Treasurer as trustee, subject
# to two years' redemption (one for abandoned property); the list also carries parcels with
# prior-year delinquencies in redemption or deeded to the Treasurer. It is an annual list: a
# parcel redeemed since May is still on it, so the date is the list's as-of date, not the day
# read. Unpaid Nevada property tax is a perpetual lien on the property (NRS 361.450). APN
# '128-31-212-019' without dashes is nv.clark.parcels PARCEL; that layer covers the Las Vegas
# Valley only (about half the listed parcels). Debt kind: tax_delinquency.
