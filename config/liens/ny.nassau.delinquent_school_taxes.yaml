source_id: ny.nassau.delinquent_school_taxes
state: NY
county_fips: "36059"   # Nassau County
# Nassau County Treasurer weekly report DQ110 "Delinquent Taxes Unpaid", school district taxes
# (Unpaid Tax Listings page; the 2026-11-20 report is 441 pages): one block per parcel and tax
# year with the parcel (section, block, lot), the owner's name, the tax year, the amount unpaid
# and the property class, followed by its half-year cycle lines (not read). Text PDF, read
# with the in-house PDF reader at fixed column positions; a row needs a parcel and a tax year.
# The report's file name and DocumentCenter id change each week, so the link is taken from the
# listings page. Dated January 1 of the tax year. Unpaid NY property tax is a lien on the
# parcel (RPTL 902). No owner address is printed and Nassau is not among the counties in
# ny.statewide.parcels, so rows are matched by owner name; loaded on the owner's decision of
# 2026-11-28. Debt kind: tax_delinquency.
api: pdf
url: https://www.nassaucountyny.gov/5678/Unpaid-Tax-Listings
link_from:
  page: https://www.nassaucountyny.gov/5678/Unpaid-Tax-Listings
  pattern: '/DocumentCenter/View/\d+/DQ110NYNAS-DELINQUENT-TAXES_SCHOOL[^"]*'
header: Cycle
pdf_columns:
  names: [parcel, owner, tax_year, cycle, amount, half_or_full, class, note]
  cuts: [130, 300, 340, 400, 455, 500, 530]
  require: {parcel: '^[0-9]', tax_year: '^[0-9]{4}$', amount: '^[0-9][0-9,]*\.[0-9]{2}$'}
year_dates: [tax_year]
date_field: tax_year
uid: [parcel, tax_year]
doc_type: TAX_LIEN_STATE
doc_type_raw: Nassau County delinquent school tax (cycles S1/S2)
amount: amount
parties:
  - role: debtor
    name: owner
  - {role: creditor, const: Nassau County Treasurer, person_names: false}
terms:
  url: https://www.nassaucountyny.gov/5678/Unpaid-Tax-Listings
  summary: "Nassau County Treasurer 'Unpaid Tax Listings' page (nassaucountyny.gov), weekly reports published for the public, no login or fee; no license or use restriction stated. nassaucountyny.gov robots.txt allows all. Matched by owner name only (no address, no shared parcel layer): loaded on the owner's decision (2026-11-28)."
  checked_on: 2026-11-28
  robots_checked_on: 2026-11-28
  cost_model: free
