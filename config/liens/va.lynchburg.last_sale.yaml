source_id: va.lynchburg.last_sale
state: VA
county_fips: "51680"   # Lynchburg city
# City of Lynchburg GIS Office open-data parcels (the va.lynchburg_city.parcels layer, 32,620
# parcels with a grantor on 2026-11-25): each parcel's latest sale date and amount, the
# grantor of that sale and the owner of record. Loaded like al.houston.last_deed: one DEED
# instrument per parcel and sale date, grantor = Grantor1 (seller), grantee = Owner1 (the
# owner of record, read as the buyer). Linked to 51680-<Parcel_ID>, the
# va.lynchburg_city.parcels key. TODO(Brandon): confirm the roll's owner is the grantee of
# the Sale1dt sale (it can lag a later transfer).
api: arcgis
layer_url: https://mapviewer.lynchburgva.gov/ArcGIS/rest/services/OpenData/ODPDynamic/MapServer/41
order_by: [OBJECTID]
select: [OBJECTID, Parcel_ID, Owner1, Grantor1, Sale1dt, Sale1Amt]
date_field: Sale1dt
partition: year
first_year: 1880
uid: [Parcel_ID, Sale1dt]
doc_type: DEED
doc_type_raw: Lynchburg last sale (grantor to owner)
consideration: Sale1Amt
parties:
  - role: grantor
    name: Grantor1
  - role: grantee
    name: Owner1
parcel: {kind: pin, field: Parcel_ID, county_fips: "51680"}   # = va.lynchburg_city.parcels parcel_id
terms:
  url: https://mapviewer.lynchburgva.gov/ArcGIS/rest/services/OpenData/ODPDynamic/MapServer/41
  summary: "City of Lynchburg GIS Office public OpenData/ODPDynamic MapServer (the same layer as va.lynchburg_city.parcels), no login, token or fee; item licenseInfo: not a legal record or survey; it points to the City's GIS Data Sharing and Distribution Policy, which answered 404 (see va.lynchburg_city.parcels), so no restriction text could be read. mapviewer.lynchburgva.gov/robots.txt: 'User-agent: * Allow: /' with Content-Signal search=yes, ai-train=no, use=reference (no AI training; this is record linking)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
