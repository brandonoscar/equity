source_id: il.cook.recorder_quitclaims_2013_2015
state: IL
county_fips: "17031"
# Cook County Recorder of Deeds open-data extract (datacatalog.cookcountyil.gov 4f2q-h3b7): 66,323 quit claim deeds recorded 2013-01-02 to 2015-03-27 (the rest of the extract is il.cook.recorder_mortgages_2013_2015).
# Each row is one recorded document on one PIN: document number, type, recorded and
# executed dates and the stated consideration as consideration. No party names are
# published, so these are instruments on the parcel only (the lien stack and its dates);
# PINs are printed with dashes ('25-16-213-015-0000'), stripped to the 14-digit il.cook.parcels key.
portal: https://datacatalog.cookcountyil.gov
dataset: 4f2q-h3b7
where: "pin IS NOT NULL AND document_type LIKE '%QUIT CLAIM%'"
order_by: [document_number, pin, ":id"]
select: [pin, document_number, document_type, recorded_date, execution_date, consideration_amount, street, city, state, zip_code]
date_field: recorded_date
partition: year
first_year: 2013
uid: document_number   # one document on several PINs is one instrument on each lot
doc_type: {field: document_type, map: {MORTGAGE: MORTGAGE, CORRECTED MORTGAGE: MORTGAGE, MORTGAGE AND ASSIGNMENT: MORTGAGE, LIS PENDENS FORECLOSURE: LIS_PENDENS, AMENDED LIS PENDENS FORECLOSURE: LIS_PENDENS, CORRECTED LIS PENDENS FORECLOSURE: LIS_PENDENS, QUIT CLAIM DEED: DEED, CORRECTED QUIT CLAIM DEED: DEED}, default: OTHER}
doc_type_raw: {field: document_type}
consideration: consideration_amount
parties: []
extra_pii: [street]
parcel: {kind: pin, field: pin, county_fips: "17031", strip: "-"}   # = il.cook.parcels pin
terms:
  url: https://datacatalog.cookcountyil.gov/d/4f2q-h3b7
  summary: "Cook County Recorder of Deeds extract on the Cook County open data portal (Socrata), free, no login; license Public Domain. A one-time extract: the Recorder's later index is not on the portal. datacatalog.cookcountyil.gov/robots.txt allows /resource/ (Crawl-delay: 1)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
