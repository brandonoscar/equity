source_id: oh.cleveland.condemnations
state: OH
county_fips: "39035"
# City of Cleveland "Active Condemnations" (Current_Condemnations/0, 2,640 parcels on
# 2026-11-25; 474 have no condemnation date and are not read): buildings condemned by the
# Department of Building and Housing, with the parcel and the condemnation date. No owner is
# named: OTHER instruments on the parcel, in no match run.
api: arcgis
layer_url: https://services3.arcgis.com/dty2kHktVXHrqO8i/arcgis/rest/services/Current_Condemnations/FeatureServer/0
order_by: [OBJECTID]
select: [OBJECTID, Parcel_Number, Active_Condemnation, Address, Condemnation_Date]
date_field: Condemnation_Date
partition: year
first_year: 2013
uid: [Parcel_Number, Condemnation_Date]
doc_type: OTHER
doc_type_raw: Cleveland condemnation
parties: []
extra_pii: [Address]
parcel: {kind: pin, field: Parcel_Number, county_fips: "39035"}   # = oh.cuyahoga.parcels parcel_id ('12829029')
terms:
  url: https://www.arcgis.com/home/item.html?id=bd47abc2adc242f789313af4191610ae
  summary: "City of Cleveland Department of Building and Housing on the Cleveland Open Data Portal (ArcGIS Online, owner opendataCLE), public hosted layer, free, no login. Item licenseInfo (read 2026-11-25): Open Data Commons Open Database License (ODbL): attribute the City; a derived database that is shared publicly must be offered under the ODbL (internal use only here, not redistributed). services3.arcgis.com/robots.txt answers 4xx (RFC 9309: no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  use_restrictions: [attribution_required]
  cost_model: free
