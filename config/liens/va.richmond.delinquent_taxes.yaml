source_id: va.richmond.delinquent_taxes
state: VA
county_fips: "51760"   # Richmond city
# City of Richmond Finance: real estate taxes delinquent six months or more, one row per
# parcel and bill year, with the current owner and amount due. Delinquent real estate taxes
# are a lien on the parcel (Va. Code 58.1-3340); a senior lien, not a judgment.
# Debt kind: tax_delinquency. No addresses: the parcel code names the property.
portal: https://data.richmondgov.com
dataset: 83t5-hbac
single_partition: true
order_by: [property_code, bill_year, ":id"]
year_dates: [bill_year]
date_field: bill_year
uid: [property_code, bill_year]
doc_type: TAX_LIEN_STATE
doc_type_raw: Richmond delinquent real estate tax
amount: total_due              # '$361.90' text
parties:
  - {role: debtor, name: current_owner_name_1}
  - {role: debtor, name: current_owner_name_2}
  - {role: creditor, const: City of Richmond}
parcel: {kind: pin, field: property_code, county_fips: "51760"}   # = va.richmond_city.parcels PIN
terms:
  url: https://data.richmondgov.com/d/83t5-hbac
  summary: "City of Richmond Open Data (Socrata), public, no login."
  checked_on: 2026-11-23
  cost_model: free
