source_id: oh.clermont.tax_delinquent
state: OH
county_fips: "39025"
# Clermont County Auditor 'Delinquent Tax Values': owners, mailing address, parcel id, net
# delinquent amount and the year certified delinquent (a lien on the parcel under ORC 5721).
portal: https://internal.opendata.clermontauditor.org
dataset: q52y-wzm4
order_by: [parid, ":id"]
partition: none
date_field: certdlqyr
uid: [parid, taxyr]
doc_type: TAX_LIEN_STATE
doc_type_raw: "Certified delinquent real property tax"
amount: netdelq
parties:
  - role: debtor
    name: own1
    address: {line1: [mailaddr1, mailaddr2], csz: mailaddr3}
parcel: {kind: pin, field: parid, county_fips: "39025"}
terms:
  url: https://internal.opendata.clermontauditor.org/d/q52y-wzm4
  summary: "Clermont County, OH Auditor open data (Socrata); license Public Domain."
