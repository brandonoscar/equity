source_id: mi.kalamazoo.foreclosed_2022
state: MI
county_fips: "26077"   # Kalamazoo County
# Kalamazoo County Treasurer 'ParcelForeclosures2022' (published 2022-08-05): 892 parcels foreclosed by the
# County Treasurer in 2022 for unpaid 2019-and-earlier property taxes (MCL 211.78k; title vested
# in the county after the March 31, 2022 redemption deadline), with the owners of record before
# foreclosure and their mailing address. The owners lost these parcels: they are named
# debtors, matched by name (the parcel's current owner is the buyer or the county).
# A historical list (the layer is not updated): the date is fixed in the select as a SQL
# literal ('2022-03-31' AS listed_on), not the day it is read. TAX and SAR1_MBOR (taxable /
# assessed value) are not amounts owed. PELNUMBER ('06-01-149-103') is pelnumber in
# mi.kalamazoo.parcels, like mi.kalamazoo.forfeited_parcels. Debt kind: foreclosure.
api: arcgis
layer_url: https://services3.arcgis.com/RGltUbqpl4h9E3Qh/arcgis/rest/services/ParcelForeclosures2022/FeatureServer/0
single_partition: true
order_by: [FID]
select: [FID, PELNUMBER, ONERNAME1, ONERNAME2, OERCAREOF, OTADDRESS, OWNERCITY, ONERSTATE, ORZIPCODE, PCOMBINED, "'2022-03-31' AS listed_on"]
date_field: listed_on
uid: PELNUMBER
doc_type: TAX_LIEN_STATE
doc_type_raw: Kalamazoo County tax-foreclosed parcel, 2022
parties:
  - role: debtor
    name: ONERNAME1
    address: {line1: OTADDRESS, city: OWNERCITY, state: ONERSTATE, zip: ORZIPCODE}
  - role: debtor
    name: ONERNAME2
  - {role: creditor, const: Kalamazoo County Treasurer, person_names: false}
parcel: {kind: pin, field: PELNUMBER, county_fips: "26077"}
extra_pii: [OERCAREOF, PCOMBINED]
terms:
  url: https://services3.arcgis.com/RGltUbqpl4h9E3Qh/arcgis/rest/services/ParcelForeclosures2022/FeatureServer
  summary: "Kalamazoo County Treasurer ArcGIS Online layer (owner trwhit_kalcounty, public), no login, token or fee. No licenseInfo; no use restriction found (read 2026-11-25). services3.arcgis.com/robots.txt answers 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
