source_id: la.east_baton_rouge.adjudicated
state: LA
county_fips: "22033"   # East Baton Rouge Parish (Baton Rouge)
# East Baton Rouge Parish Assessor "Adjudicated Property" (City-Parish open data, Socrata
# a4h4-zi7e): parcels that went unsold at the sheriff's tax sale and were adjudicated to the
# Parish for unpaid ad valorem taxes (La. R.S. 47:2196), with the tax debtor (owner of record)
# and mailing address. 52,056 rows on 2026-11-25: one row per parcel per tax roll, rolls 2012
# to 2023 (10,334 distinct assessment numbers; the 2023 roll lists 4,549); dataset last
# updated 2024-02-27. Rows of one assessment number are one adjudication: recorded_on is the
# first roll that lists it (tax_roll_year read as Jan 1). A parcel listed only in earlier rolls
# has since left the list (redeemed or sold) but no release is published, so it stays open.
# No amount is published (only fair market and assessed values). assessment_num
# ('012-8493-2') is la.eastbatonrouge.parcels ASSESSMENT_NUM, so the pin matches
# '22033-012-8493-2'; the 24 rows with the placeholder '000-0000-0' are left out.
# Debt kind: tax_delinquency.
portal: https://data.brla.gov
dataset: a4h4-zi7e
where: "assessment_num != '000-0000-0'"
single_partition: true
select: [tax_roll_year, assessment_num, owner, ownadd, owncity, physadd, zip_code]
year_dates: [tax_roll_year]
date_field: tax_roll_year
uid: assessment_num
doc_type: TAX_LIEN_STATE
doc_type_raw: East Baton Rouge Parish adjudicated property (unpaid taxes)
parties:
  - role: debtor
    name: owner
    address: {line1: ownadd, csz: owncity}   # owner mailing; owncity is "CITY, ST 12345"
  - {role: creditor, const: Parish of East Baton Rouge, person_names: false}
parcel: {kind: pin, field: assessment_num, county_fips: "22033"}
extra_pii: [physadd]
terms:
  url: https://data.brla.gov/Housing-and-Development/Adjudicated-Property/a4h4-zi7e
  summary: "Open Data BR (City of Baton Rouge / Parish of East Baton Rouge, Socrata) dataset a4h4-zi7e 'Adjudicated Property', free, no login or app token; license Public Domain. data.brla.gov/robots.txt allows /resource/ (Crawl-delay: 1)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
