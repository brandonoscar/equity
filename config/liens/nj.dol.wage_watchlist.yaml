source_id: nj.dol.wage_watchlist
state: NJ
county_fips: "34"   # statewide; no county column
# NJ Department of Labor Wage and Hour, Wage Violation Watchlist: employers with a final order
# and judgment for unpaid wages, fees and penalties. Employers who paid stay on the list with
# status 'Wages Paid in Full', so those are marked satisfied (no payment date is published).
# TODO(Brandon): confirm 'Final Order and Judgement' is docketed as a judgment lien.
api: xlsx
url: https://www.nj.gov/labor/ea/assets/PDFs/WVW-List.xlsx
sheet: 0
excel_dates: [date_of_final_order_and_judgement]
address_split: {field: employer_address, prefix: addr_}
date_field: date_of_final_order_and_judgement
uid: [name_of_employer_dba, date_of_final_order_and_judgement, nature_of_claim]
doc_type: JUDGMENT_LIEN
doc_type_raw: NJDOL wage order and judgment
amount: [final_wages_assessed, fee_and_penalty_assessed]
satisfied_flag: status
satisfied_values: [Wages Paid in Full]
parties:
  - role: debtor
    name: name_of_employer_dba
    address: {line1: addr_line1, city: addr_city, state: addr_state, zip: addr_zip}
  - role: creditor
    const: NJ Department of Labor and Workforce Development
extra_pii: [employer_address]
terms:
  url: https://www.nj.gov/labor/ea/osec/wageviolationlist.shtml
  summary: "NJDOL publishes the Wage Violation Watchlist as a free .xlsx on nj.gov, updated monthly, no login. No license or reuse terms stated."
  checked_on: 2026-11-22
  cost_model: free
