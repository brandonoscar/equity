source_id: ga.cobb.delinquent_taxes
state: GA
county_fips: "13067"   # Cobb County (Marietta)
# Cobb County Tax Commissioner 'Delinquent Tax List' (Delinquent Taxes page, a PDF printed from
# Excel and replaced about monthly; the 2026-11-09 list is 829 pages): one line per unpaid
# real property bill with the parcel id, the owner, the property address, the amount of the
# bill and its tax year. Read at fixed columns with the in-house PDF reader. The page links the
# file relative to its <base href>, so the link is found there each month. Unpaid Georgia
# property tax is a lien on the parcel from January 1 of the tax year (O.C.G.A. 48-2-56), so
# that is the date; each parcel and year is one instrument. Parcel ID '01000200110' is
# ga.cobb.parcels PARID. Debt kind: tax_delinquency.
api: pdf
url: https://www.cobbtax.gov/property/delinquent_taxes/index.php
link_from:
  page: https://www.cobbtax.gov/property/delinquent_taxes/index.php
  pattern: 'Delinquent Tax List [0-9.]+\.pdf$'
header: Parcel ID
pdf_columns:
  names: [parcel, owner, address, amount, tax_year]
  cuts: [130, 355, 590, 690]
  require: {parcel: '^[0-9A-Z]{8,14}$', amount: '^\$[0-9][0-9,]*\.[0-9]{2}$', tax_year: '^[0-9]{4}$'}
year_dates: [tax_year]
date_field: tax_year
uid: [parcel, tax_year]
doc_type: TAX_LIEN_STATE
doc_type_raw: Cobb County delinquent property tax bill
amount: amount
parties:
  - role: debtor
    name: owner
    address: {line1: address, state_const: GA}   # the property
  - {role: creditor, const: Cobb County Tax Commissioner, person_names: false}
parcel: {kind: pin, field: parcel, county_fips: "13067"}
extra_pii: [address]
terms:
  url: https://www.cobbtax.gov/property/delinquent_taxes/index.php
  summary: "Cobb County Tax Commissioner Delinquent Taxes page (cobbtax.gov; files served from cms9files.revize.com/cobbcounty/), the published delinquent tax list, free, no login; no license or use restriction stated. robots.txt on both hosts answers 404 (no rules)."
  checked_on: 2026-11-28
  robots_checked_on: 2026-11-28
  cost_model: free
