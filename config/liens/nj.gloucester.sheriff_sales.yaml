source_id: nj.gloucester.sheriff_sales
state: NJ
county_fips: "34015"
# Gloucester County, NJ Sheriff's Office foreclosure sales listing on CivilView (salesweb.civilview.com,
# countyId=19; 158 open sales on 2026-11-25, refreshed by the sheriff every 30 minutes
# on weekdays): each property set for sheriff's sale under a foreclosure (or other)
# judgment, with the sheriff number, sale date, plaintiff (lender, lienholder), defendants
# (the owners and other parties named, often ending 'ET AL') and the property address.
# One EXECUTION instrument per sheriff number (a sale under a writ of execution), dated by
# the scheduled sale date, in no match run. The page lists open sales only (sold and
# cancelled ones drop off), so it is refreshed whole and snapshotted daily (config/refresh).
# No parcel number is published: the matcher finds the property by address.
api: html
url: https://salesweb.civilview.com/Sales/SalesSearch?countyId=19
table: 1   # the second table on the page; the first is the page banner
us_dates: [sales_date]
address_split: {field: address, prefix: prop_, form: slash}   # 'NO STREET CITY ST ZIP'
date_field: sales_date
uid: sheriff
doc_type: EXECUTION
doc_type_raw: Sheriff's sale (foreclosure listing)
parties:
  - role: debtor
    name: defendant
    address: {line1: prop_line1, city: prop_city, state_const: NJ, zip: prop_zip}
  - role: creditor
    name: plaintiff
extra_pii: [address, attorney, attorney_name]
terms:
  url: https://salesweb.civilview.com/Sales/SalesSearch?countyId=19
  summary: "Gloucester County, NJ Sheriff's Office sales listing on CivilView (salesweb.civilview.com), public, no login, token, CAPTCHA or fee; the page says it is provided as a public service and the sheriff does not warrant its accuracy, completeness or timeliness. No license or reuse terms stated; internal use only, not redistributed. salesweb.civilview.com/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
