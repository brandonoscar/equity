source_id: il.chicago.city_owned_land
state: IL
county_fips: "17031"
# City of Chicago Department of Planning and Development "City-Owned Land Inventory"
# (aksk-kvfp, 20,784 rows on 2026-11-25, rows updated 2026-11-25): parcels the city owns, leases or has
# sold, by PIN, with property status (Owned by City 12,001; Sold 6,356; Leased 1,497; Not
# City Owned 897), acquisition and disposition dates, sale and offering status, land value
# and application round. A government holdings and sale list, no debt: OTHER on the parcel.
# A negative screen: a parcel the city holds is not a debtor's equity. The PIN
# ('20-09-111-015-0000') without dashes is the 14-digit PIN il.cook.parcels keys.
portal: https://data.cityofchicago.org
dataset: aksk-kvfp
where: "pin IS NOT NULL"
order_by: [id]
select: [id, pin, address, managing_organization, property_status, date_of_acquisition,
         date_of_disposition, times_listed, last_listed, sales_status, sale_offering_status,
         land_value, valuation_date, zip_code, last_update, application_use, grouped_parcels,
         application_deadline, offer_round]
listed_on: listed_on
date_field: listed_on
single_partition: true
uid: id
doc_type: OTHER
doc_type_raw: {field: property_status}
parties:
  - {role: other, const: City of Chicago}
parcel: {kind: pin, field: pin, strip: "-", county_fips: "17031"}   # = il.cook.parcels PIN
extra_pii: [address]
terms:
  url: https://data.cityofchicago.org/d/aksk-kvfp
  summary: "Chicago Data Portal (Socrata), Department of Planning and Development, free, no login or app token. License 'See Terms of Use' (City of Chicago data portal terms, read 2026-11-25). Internal use, not redistributed. data.cityofchicago.org robots.txt allows /resource/."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
