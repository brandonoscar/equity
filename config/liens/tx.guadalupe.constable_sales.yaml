  summary: "Guadalupe County, TX Constable Precinct 1 sales listing on CivilView (salesweb.civilview.com), public, no login, token, CAPTCHA or fee; the page says it is provided as a public service and the office does not warrant its accuracy, completeness or timeliness. No license or reuse terms stated; internal use only, not redistributed. salesweb.civilview.com/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-28
  robots_checked_on: 2026-11-28
