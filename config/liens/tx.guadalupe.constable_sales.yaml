source_id: tx.guadalupe.constable_sales
state: TX
county_fips: "48187"
# Guadalupe County, TX Constable Precinct 1 sales listing on CivilView (salesweb.civilview.com,
# countyId=86; 4 open sales on 2026-11-28): each property set for constable's sale under a
# foreclosure (or other) judgment, with the civil number, sale date, plaintiff (lender, lienholder),
# defendants (the owners and other parties named) and the property address.
# One EXECUTION instrument per civil number, dated by the scheduled sale date. The page lists
# open sales only (sold and cancelled ones drop off), so it is refreshed whole and snapshotted
# daily (config/refresh). Same page layout and terms as the NJ and PA CivilView configs.
# The matcher finds the property by address. Debt kind: foreclosure.
api: html
url: https://salesweb.civilview.com/Sales/SalesSearch?countyId=86
table: 1   # the second table on the page; the first is the page banner
us_dates: [sales_date]
address_split: {field: address, prefix: prop_, form: slash}   # 'NO STREET CITY ST ZIP'
date_field: sales_date
uid: civil
doc_type: EXECUTION
doc_type_raw: Constable's sale (foreclosure listing)
parties:
  - role: debtor
    name: defendant
    address: {line1: prop_line1, city: prop_city, state_const: TX, zip: prop_zip}
  - role: creditor
    name: plaintiff
extra_pii: [address]
terms:
