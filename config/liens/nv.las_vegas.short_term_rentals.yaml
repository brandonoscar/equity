source_id: nv.las_vegas.short_term_rentals
state: NV
county_fips: "32003"
# City of Las Vegas short-term residential rental business licenses ("Short_Term_Rentals"
# layer 115 CLV_ShortTermRental, ArcGIS Online, OfficeOfGIS_LasVegas; 261 licenses on
# 2026-11-25): license number, category, status, issue and expiration dates, the business
# (licensee) name and DBA, the rental's address and Clark County APN, and the licensee's
# mailing address. One OTHER instrument per license on 32003-<PRCLID> (as
# nv.clark.property_sales), the licensee as an 'other' party, in no match run.
api: arcgis
layer_url: https://services1.arcgis.com/F1v0ufATbBQScMtY/arcgis/rest/services/Short_Term_Rentals/FeatureServer/115
order_by: [OBJECTID]
select: [OBJECTID, LICENSENO, LICENSETYPEDESC, LICENSECATDESC, LICSTATUS, LICENSEDTTM, ISSDTTM,
         EXPDTTM, BUS_NAME, DBANAME, BUS_TYPE, BUS_ADDRESS, BUS_CITY, BUS_STATE, BUS_ZIP,
         PRCLID, MAIL_FULL_STREET, MAIL_CITY_ST_ZIP]
date_field: ISSDTTM
partition: year
first_year: 2000
uid: LICENSENO
doc_type: OTHER
doc_type_raw: {field: LICENSECATDESC}
extra_pii: [BUS_ADDRESS, DBANAME]
parties:
  - role: other
    name: BUS_NAME
    address: {line1: MAIL_FULL_STREET, csz: MAIL_CITY_ST_ZIP}
parcel: {kind: pin, field: PRCLID, county_fips: "32003"}   # = nv.clark.property_sales PARCEL
terms:
  url: https://www.arcgis.com/home/item.html?id=cf55cce578854241bcac2279443261cd
  summary: "City of Las Vegas Office of GIS (OfficeOfGIS_LasVegas) public ArcGIS Online layer 'Short_Term_Rentals' (Short Term Rental business licenses), free, no login or token. licenseInfo (read 2026-11-25): the City of Las Vegas makes no warranty, representation or guarantee; no license grant, resale or redistribution clause. services1.arcgis.com/robots.txt answers 403 (RFC 9309: no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
