  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202025/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202026/FeatureServer/0
select: [OBJECTID, bill, pin, levy_year, total_due, owner1_first_name, owner1_third_name, owner1_last_name, owner1_suffix_name, owner2_first_name, owner2_third_name, owner2_last_name, owner2_suffix_name, address_line1, address_line2, city, state, postal_code]
order_by: [OBJECTID]
date_field: levy_year
# A levy year's bills are due September 1 and delinquent after January 5 of the next year
# (G.S. 105-360), 370 days after the January 1 the levy year is dated by. The 2026 layer is
# the current roll (82,706 bills on 2026-11-27, not yet delinquent): kept out until 2027-01-07.
past_due_days: 371
uid: bill
doc_type: TAX_LIEN_STATE
doc_type_raw: "Unpaid property tax bill"
amount: total_due
parties:
  - role: debtor
    name: [owner1_first_name, owner1_third_name, owner1_last_name, owner1_suffix_name]
    address: {line1: [address_line1, address_line2], city: city, state: state, zip: postal_code}
  - role: debtor
    name: [owner2_first_name, owner2_third_name, owner2_last_name, owner2_suffix_name]
    address: {line1: [address_line1, address_line2], city: city, state: state, zip: postal_code}
parcel: {kind: pin, field: pin, county_fips: "37021", strip: "-"}
terms:
  url: https://www.arcgis.com/home/search.html?q=owner%3Abuncombe%20unpaid%20property%20bills
  summary: "Buncombe County, NC unpaid property bills (public ArcGIS Online layers, no login); no license published. Used on the project owner's decision (2026-11-23)."
  checked_on: 2026-11-23
  cost_model: free
