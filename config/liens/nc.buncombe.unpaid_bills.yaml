source_id: nc.buncombe.unpaid_bills
state: NC
county_fips: "37021"
# Buncombe County unpaid property tax bills, one ArcGIS Online layer per levy year (2009-2026;
# 2022 is not published). Owners by name parts with mailing address, PIN, levy year and total
# due. Unpaid NC property tax is a lien on real property. The PIN, dashes removed, is the
# NC OneMap parcel number (37021-<pin>). Bills with no PIN are personal property.
api: arcgis
layer_urls:
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202009/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202010/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202011/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202012/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202013/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202014/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202015/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202016/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202017/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202018/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202019/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202020/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/Unpaid%20Property%20Bills%20from%202021/FeatureServer/0
  - https://services6.arcgis.com/VLA0ImJ33zhtGEaP/arcgis/rest/services/All%20Property%20Unpaid%20Bills%20from%202023/FeatureServer/0
