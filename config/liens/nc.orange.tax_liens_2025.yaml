# Orange County Tax Administration '2025 Tax Liens' (Excel version of the G.S. 105-369 lien
# advertisement, Tax Liens page): the 1,803 parcels whose 2025 taxes were still unpaid when the
# liens were advertised in March 2026, with the owner names, the legal description, the parcel
# number and the unpaid base tax (principal only; interest and costs not included). Unpaid NC
# property tax is a lien on the parcel from January 1 of the tax year (G.S. 105-355), so that is
# the date; parcels paid since the advertisement stay on the list. 'PARCEL #' '9778656581' is
# nc.statewide.parcels parno for Orange. The file's DocumentCenter id changes with each year's
# list (the health check flags a moved file). Debt kind: tax_delinquency.
