source_id: oh.clermont.delinquent_taxes
state: OH
county_fips: "39025"   # Clermont County
# Clermont County Auditor: parcels with delinquent real estate taxes (net delinquency), owner
# and mailing address, daily, Public Domain. Delinquent taxes are a lien on the parcel (ORC
# 5721.10); a senior lien, not a judgment. Debt kind: tax_delinquency.
portal: https://internal.opendata.clermontauditor.org
dataset: q52y-wzm4
where: "netdelq > 0"
single_partition: true
order_by: [parid, ":id"]
select: [parid, taxyr, own1, mailaddr1, mailaddr2, mailaddr3, adrstr, netdelq, certdlqyr]
year_dates: [certdlqyr]
date_field: certdlqyr          # the year the delinquency was certified (Jan 1)
uid: [parid, taxyr]
doc_type: TAX_LIEN_STATE
doc_type_raw: Clermont County delinquent real estate tax
amount: netdelq
address_split: {field: mailaddr3, prefix: m_, form: city_st_zip}
parties:
  - role: debtor
    name: own1
    address: {line1: [mailaddr1, mailaddr2], city: m_city, state: m_state, zip: m_zip}
  - role: creditor
    const: Clermont County Treasurer
parcel: {kind: pin, field: parid, county_fips: "39025"}
extra_pii: [adrstr, mailaddr3]
terms:
  url: https://internal.opendata.clermontauditor.org/d/q52y-wzm4
  summary: "Clermont County Auditor open data (Socrata), Public Domain, free, no login, daily."
  checked_on: 2026-11-23
  cost_model: free
