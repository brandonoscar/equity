# Judgment enforceability by state. Filled in by Brandon, never by code or by Claude.
# Every value starts as null. Rules that need a null value refuse to run for that state
# and report it, instead of guessing.
#
# Fields per state:
#   judgment_enforceable_years: years a judgment can be enforced/executed on without renewal
#   lien_years:                 years a docketed judgment lien on real property lasts
#   renewable:                  true/false
#   renewal_years:              length of each renewal
#   renewal_keeps_priority:     true/false (does a renewed lien keep its original place?)
#   statute:                    citation(s)
#   confirmed_by:               who confirmed it, and when

