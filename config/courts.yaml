# Federal courts whose public CM/ECF "Recent Entries" RSS feed is ingested.
# Host is https://ecf.<id>.uscourts.gov/cgi-bin/rss_outside.pl. Free, no login, no PACER fee.
# Bankruptcy court ids end in "b". Order: the buyer's enforcement states first, then pilot.
schema_version: 1
# Courts with a recorded fixture and a reachable host. Others are planned.
# Checked 2026-11-23: all enabled feeds answer; flmb and njb are partial feeds (petitions,
# orders, motions), the rest list all entries. 2026-11-24: 57 more bankruptcy feeds enabled
# (robots.txt allows the feed and it lists entries); arwb, areb, mdb, kyeb, utb, wawb, nmb,
# wiwb and canb disallow it in robots.txt; meb, nceb, nyeb, miwb serve an empty feed; mob, txsb
# do not answer; nywb titles use a case-number form the parser does not read. wvnd (us.wvnd.rss, registered separately)
# returned HTTP 500 that day; nyeb, nyed, nceb, miwb, gand, mdd, pamd serve an empty feed.
# 2026-11-25: ilcb, ilsb, wvsb (robots.txt 404, no rules) and meb (now lists entries) enabled;
# ilnb's robots.txt disallows everything.
enabled: [akb, almb, alnb, alsb, azb, cacb, caeb, casb, cob, ctb, dcb, deb, flmb, flnb, flsb, gamb, ganb, gasb, hib, ianb, iasb, idb, ilcb, ilsb, innb, insb, ksb, kywb, laeb, lamb, lawb, mab, meb, mieb, mnb, moeb, mowb, msnb, mssb, mtb, ncmb, ncwb, ndb, neb, nhb, njb, nvb, nynb, nysb, ohnb, ohsb, okeb, oknb, okwb, orb, paeb, pawb, rib, scb, sdb, tneb, tnmb, tnwb, txeb, txnb, txwb, vaeb, vawb, vtb, waeb, wieb, wvsb, wyb]  # pamb: robots.txt disallows the feed
