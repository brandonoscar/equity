# Washington State Department of Health, "Health Care Provider Credential Data"
# (data.wa.gov qxh8-f4bd, Public Domain): about 2.5M current and past credentials for every
# regulated health profession (nurses, physicians, pharmacists, counselors, assistants...),
# one row per credential, with name parts, birth year, credential type, status and first
# issue date. No address is published.
source_id: wa.doh.health_credentials
state: WA
jurisdiction: "53"
portal: https://data.wa.gov
dataset: qxh8-f4bd
key: credentialnumber
id_prefix: "WA-DOH:"
terms_url: https://data.wa.gov/health/Health-Care-Provider-Credential-Data/qxh8-f4bd
terms_summary: "Public Domain (dataset license field)."
checked_on: 2026-11-25
license:
  type: credentialtype
  status: status
  issued_on: firstissuedate
holders:
  - {role: other, title: CREDENTIAL HOLDER, parts: {first: firstname, middle: middlename, last: lastname}}
pii_fields: [lastname, firstname, middlename, birthyear]
