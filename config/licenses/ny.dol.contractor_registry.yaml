# New York State Department of Labor, "Contractor Registry Certificate" (data.ny.gov
# i4jv-zkey): about 15K contractors registered for public work, with business officers (a
# comma-separated list of names), address, and debarment and violation flags.
source_id: ny.dol.contractor_registry
state: NY
jurisdiction: "36"
portal: https://data.ny.gov
dataset: i4jv-zkey
key: certificate_number
id_prefix: "NY-DOLCR:"
terms_url: https://data.ny.gov/download/77gx-ii52/application%2Fpdf
terms_summary: "NY Open Data terms: free to use; no warranty. No restriction on commercial use found."
checked_on: 2026-11-25
license:
  name: [dba_name, business_name]
  type: business_type
  status: status
  issued_on: issued_date
  address: {street: [address, address_2], city: city, state: state, zip: zip_code}
holders:
  - {role: other, title: REGISTRANT, with_type: false, name: business_name, address: {street: [address, address_2], city: city, state: state, zip: zip_code}}
  - {role: officer, title: BUSINESS OFFICER, with_type: false, name: business_officers, split: ","}
pii_fields: [business_name, dba_name, business_officers, address, address_2, phone, georeference]
