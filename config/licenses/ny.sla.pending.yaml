# New York State Liquor Authority, "Current SLA Pending Licenses" (data.ny.gov f8i8-k2gm):
# about 3K pending liquor license applications with legal name, DBA, class, status and
# premises address.
# TODO(Brandon): an application has no issue date (received date only, kept in the raw
# record), so applications are dated from the retrieval day.
source_id: ny.sla.pending
state: NY
jurisdiction: "36"
portal: https://data.ny.gov
dataset: f8i8-k2gm
key: application_id
id_prefix: "NY-SLA-PEND:"
terms_url: https://data.ny.gov/download/77gx-ii52/application%2Fpdf
terms_summary: "NY Open Data terms: free to use; no warranty. No restriction on commercial use found."
checked_on: 2026-11-25
license:
  name: [dba, legalname]
  type: description
  status: status
  address: {street: [actual_address_of_premises, additional_address_information], city: city, state: state_name, zip: zip_code}
holders:
  - {role: other, title: APPLICANT, name: legalname, address: {street: [actual_address_of_premises, additional_address_information], city: city, state: state_name, zip: zip_code}}
pii_fields: [legalname, dba, actual_address_of_premises, additional_address_information, aka_address, georeference]
