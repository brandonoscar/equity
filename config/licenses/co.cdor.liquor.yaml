# Colorado Department of Revenue, Liquor Enforcement Division, "Liquor Licenses in Colorado"
# (data.colorado.gov ier5-5ms2, Public Domain): about 20K active liquor licenses with the
# licensee (a company or a person), trade name and premises address.
# TODO(Brandon): no issue date is published (only expiration), so licenses are dated from
# the retrieval day.
source_id: co.cdor.liquor
state: CO
jurisdiction: "08"
portal: https://data.colorado.gov
dataset: ier5-5ms2
key: license_number
id_prefix: "CO-LIQ:"
terms_url: https://data.colorado.gov/Business/Liquor-Licenses-in-Colorado/ier5-5ms2
terms_summary: "Public Domain (dataset license field)."
checked_on: 2026-11-25
license:
  name: [doing_business_as, licensee_name]
  type: license_type
  status_value: Active  # the dataset lists current licenses
  address: {street: street_address, city: city, state: state, zip: zip}
holders:
  - {role: other, title: LICENSEE, name: licensee_name}
pii_fields: [licensee_name, doing_business_as, street_address, location]
