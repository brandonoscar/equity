key: licensenum
id_prefix: "PHL-LI:"
terms_url: https://opendataphilly.org/datasets/licenses-and-inspections-business-licenses/
terms_summary: "City of Philadelphia terms of use (on the dataset page): the City reserves all rights in the database, the user gets no title or interest, data is as-is, the user indemnifies the City. Internal use only; do not redistribute."
use_restrictions: [no_redistribution]
checked_on: 2026-11-25
license:
  name: [business_name, legalname]
  type: licensetype
  status: licensestatus
  issued_on: initialissuedate
  latest_by: mostrecentissuedate
  address: {street: [address, unit_type, unit_num], zip: zip}  # the city (Philadelphia) is not a column
  mailing: {line: business_mailing_address}
holders:
  - {role: other, title: LICENSEE, name: legalname, parts: {first: legalfirstname, last: legallastname}, address: {line: business_mailing_address}}
  - {role: other, title: OWNER CONTACT, with_type: false, name: ownercontact1name, address: {street: ownercontact1mailingaddress, city: ownercontact1city, state: ownercontact1state, zip: ownercontact1zippostalcode}}
  - {role: other, title: OWNER CONTACT, with_type: false, name: ownercontact2name, address: {street: ownercontact2mailingaddress, city: ownercontact2city, state: ownercontact2state, zip: ownercontact2zippostalcode}}
  - {role: other, title: PROPERTY OWNER OF RECORD, with_type: false, name: opa_owner}
pii_fields: [legalfirstname, legallastname, legalname, business_name, business_mailing_address, address, unit_num, opa_owner, ownercontact1name, ownercontact1mailingaddress, ownercontact2name, ownercontact2mailingaddress]
