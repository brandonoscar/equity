# City of Philadelphia Department of Licenses and Inspections, "Licenses and Inspections
# Business Licenses" (OpenDataPhilly; Carto table business_licenses on phl.carto.com): about
# 438K business, rental and vendor licenses (active and inactive) with license type and
# status, issue dates, the legal name (first and last name for individuals) and entity type,
# business name and one-line mailing address, the licensed address with its OPA account and
# the OPA owner of record, and up to two owner contacts with addresses. Read as CSV exports
# of the Carto SQL API in windows of 50K cartodb_id, one partition each (the table's ids ran
# 1-438,161 on the check date; the last window, from 450,000, is open-ended).
# phl.carto.com's robots.txt disallows /api/ only for named search crawlers (Googlebot,
# Slurp, Yandex, msnbot, baiduspider), not for other agents.
source_id: pa.philadelphia.business_licenses
state: PA
jurisdiction: "42101"
fetch: csv
urls:
  - https://phl.carto.com/api/v2/sql?format=csv&q=SELECT+cartodb_id,licensenum,licensetype,rentalcategory,licensestatus,initialissuedate,mostrecentissuedate,expirationdate,inactivedate,legalentitytype,legalfirstname,legallastname,legalname,business_name,business_mailing_address,address,unit_type,unit_num,zip,opa_account_num,opa_owner,ownercontact1name,ownercontact1mailingaddress,ownercontact1city,ownercontact1state,ownercontact1zippostalcode,ownercontact2name,ownercontact2mailingaddress,ownercontact2city,ownercontact2state,ownercontact2zippostalcode+FROM+business_licenses+WHERE+cartodb_id+%3E%3D+0+AND+cartodb_id+%3C+50000+ORDER+BY+cartodb_id
