source_id: oh.union.parcels
state: OH
# Union County (OH) Auditor parcels as republished in the City of Columbus GIS 'Central Ohio
# Parcels' layer (CityServices/KeyLayers layer 3; field COUNTY; Union: 37,992 rows on
# 2026-11-25, uploaded 2026-10; PARCELID blank on 388 polygons, which are skipped; OWNERNME1
# filled on 37,601): owner names, owner postal address, property address, class code.
layer_url: https://maps.columbus.gov/arcgis/rest/services/CityServices/KeyLayers/MapServer/3
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "159"}
filter: "COUNTY = 'Union'"
fields:
  parcel_id: PARCELID            # '0100010010050' (Auditor parcel number)
  owner1: OWNERNME1
  owner2: OWNERNME2
  mail_line1: PSTLADDRES         # tax-mailing street (PSTLNME1/2 are the mailing name lines)
  mail_city_state_zip: PSTLCITYSTZIP   # 'MARYSVILLE, OH 43040'
  situs_line1: SITEADDRESS
  situs_state: {const: OH}
  situs_zip: ZIPCD
  land_use_code: CLASSCD
value_basis: "LNDVALUEBASE / BLDVALUEBASE / TOTVALUEBASE (and the PR_ prior-year copies, CNTTXBLVAL) are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. SALEDATE / SALEPRICE are not mapped."
terms:
  url: https://maps.columbus.gov/arcgis/rest/services/CityServices/KeyLayers/MapServer
  summary: "City of Columbus (OH) GIS ArcGIS Server, CityServices/KeyLayers layer 3 'Parcels' (Central Ohio Parcels: Delaware, Fairfield, Franklin, Licking, Madison, Pickaway, Union county auditor data); public MapServer, no login, token or fee. No copyright, licence or use-restriction text on the service or layer (read 2026-11-25); the Union County Auditor's own terms were not found. maps.columbus.gov/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
