source_id: al.morgan.parcels
state: AL
# Morgan County (AL) Revenue Commission tax parcels joined to the CAMA roll (KCS-hosted county
# map service, public viewer Morgan_Public_ISV layer 132; 76,975 rows on 2026-11-24, Owner filled
# on all; 103 sales dated June-November 2026): owner, owner mailing address, property address,
# last deed reference.
layer_url: https://al52portal.kcsgis.com/al52server/rest/services/Mapping/Morgan_Public_ISV/MapServer/132
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "103"}
fields:
  parcel_id: PID         # '0207364003083000'; PIN is the account key
  owner1: Owner
  # Owner2 is mostly a care-of line ('C/O LINDA HOLMES'), so it is not mapped as owner2.
  mail_line1: MailAdd1
  mail_line2: MailAdd2
  mail_city: MailCity
  mail_state: MailState
  mail_zip: MailZip
  situs_line1: PropAddr1     # '1001 HWY 31 SW'
  situs_city: PropCity       # often empty
  situs_state: {const: AL}
  situs_zip: PropZip
  deed_ref: LastDeed         # '0787-0000734' book-page; instrument forms ('2017-11566-1') do not match and stay empty
deed_ref_pattern: '^(?P<book>\d+)-(?P<page>\d+)$'
extra_pii: [Owner2, PropAddr2]
value_basis: "TotalLandValue / TotalImpValue / TotalValue (appraised) and AssdValue (assessed) are present, but RecordYear / CurrentYear are 2027 on every row on 2026-11-24, which does not say which roll year the values belong to (Alabama lien date is Oct 1), so no values or tax_year are mapped and no assessment facts are emitted. PriorYear / PriorValue, SoldTotalPrice / LastSalesDate and the sales-ratio fields are not mapped. PropAddr1 reads '0 <street>' on 195 rows (the county's own text, kept as published)."
terms:
  url: https://al52portal.kcsgis.com/al52server/rest/services/Mapping/Morgan_Public_ISV/MapServer
  summary: "Layer 132 'Parcels' of the Revenue Commission's public interactive viewer service (Morgan_Public_ISV). Morgan County (AL) Revenue Commission tax-parcel map service on the county's public ArcGIS Server, hosted by its mapping contractor KCS (al52portal.kcsgis.com; copyrightText 'KCS'; keywords 'Alabama,Morgan,County,Revenue,GIS'), public, no login, token or fee. No license, use-constraint or disclaimer text in the service metadata (read 2026-11-24); no resale, redistribution or mailing-list clause found. al52portal.kcsgis.com/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
