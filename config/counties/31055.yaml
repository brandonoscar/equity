source_id: ne.douglas.parcels
state: NE
# Douglas County (Omaha) parcels with owners: DOGIS 'Parcels public', the county's public-facing
# parcel service (data maintained by the Douglas County Assessor). PIN is the county parcel
# number; placeholder PIN 9999999999 rows are skipped as not a parcel.
layer_url: https://dcgis.org/server/rest/services/vector/Parcels_public/FeatureServer/0
order_by: OBJECTID
page_size: 2000
min_interval_s: 1.0
county: {constant: "055"}
filter: "PIN <> '9999999999'"
fields:
  parcel_id: PIN
  owner1: OWNER_NAME
  mail_line1: ADDRESS1
  mail_line2: ADDRESS2
  mail_city: OWNER_CITY
  mail_state: OWNER_STAT
  mail_zip: OWNER_ZIP
  situs_line1: PROPERTY_A
  situs_city: PROP_CITY
  situs_zip: PROP_ZIP
  land_use_desc: CLASS
value_basis: "no value or tax-year fields in this layer; owner names and addresses only"
terms:
  url: https://www.arcgis.com/home/item.html?id=0937da9304a0443a84da5106527d8707
  summary: "Douglas County, NE DOGIS 'Parcels public' (dcgis.org), 217,474 rows on 2026-11-23; 'public-facing map service of Douglas County NE Parcels. Data maintained by DC Assessor.' No licenseInfo; accessInformation 'Douglas County NE'. Used on the project owner's decision (2026-11-22) to use Douglas County owner data without a published license."
  checked_on: 2026-11-23
  robots_checked_on: 2026-11-23
  cost_model: free
