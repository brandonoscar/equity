source_id: ne.douglas.parcels
state: NE
# Douglas County (Omaha) parcels with owners: DOGIS's 'Parcels_for_BOE' layer, a spatial
# join of the county 'Parcels Public' layer with board-of-equalization districts. PIN is the
# county parcel number; placeholder PIN 9999999999 rows are skipped as not a parcel.
layer_url: https://services.arcgis.com/pDAi2YK0L0QxVJHj/arcgis/rest/services/Parcels_for_BOE/FeatureServer/0
order_by: OBJECTID
page_size: 2000
min_interval_s: 1.0
county: {constant: "055"}
filter: "PIN <> '9999999999'"
fields:
  parcel_id: PIN
  owner1: OWNER_NAME
  mail_line1: ADDRESS1
  mail_line2: ADDRESS2
  mail_city: OWNER_CITY
  mail_state: OWNER_STAT
  mail_zip: OWNER_ZIP
  situs_line1: PROPERTY_A
  situs_city: PROP_CITY
  situs_zip: PROP_ZIP
  land_use_desc: CLASS
value_basis: "no value or tax-year fields in this layer; owner names and addresses only"
terms:
  url: https://www.arcgis.com/home/item.html?id=7999a3cbd73a446bb576e515df6bad87
  summary: "Douglas County, NE DOGIS ArcGIS Online 'Parcels_for_BOE', 216,645 rows, updated 2026-05-04. No licenseInfo; accessInformation 'Douglas County Assessor / Register of Deeds Office, Nebraska'. The official 'Parcels Public' layer is on dcgis.org (not reachable here). Used on the project owner's decision (2026-11-22)."
  checked_on: 2026-11-22
  robots_checked_on: 2026-11-22
  cost_model: free
