source_id: in.vanderburgh.parcels
state: IN
# Vanderburgh County Assessor parcels on the Evansville-Vanderburgh GIS server (79,407 rows on
# 2026-11-24; OWNER1 filled on 78,669): owner, owner mailing address, property address,
# assessed values. The statewide IGIO layer (config/states/in.yaml) has no owner names.
layer_url: https://maps.evansvillegis.com/arcgis_server/rest/services/PROPERTY/PARCELS/MapServer/0
order_by: OBJECTID
page_size: 5000          # maxRecordCount 80000; robots.txt Crawl-delay 60 (honored by PoliteClient)
min_interval_s: 1.0
county: {constant: "163"}
use_restrictions: [no_commercial_name_address_lists]
fields:
  parcel_id: StatePIN    # '82-03-13-035-093.032-031'; NAME is the local tax id '13-010-35-093-032'
  owner1: OWNER1
  mail_line1: own_street
  mail_city: own_city
  mail_state: own_state
  mail_zip: own_zip
  situs_line1: prop_street
  situs_city: prop_city
  situs_state: prop_state
  situs_zip: prop_zip
  land_use_code: property_class
extra_pii: [OWNER2, OwnerName, PERMIT_ADDR]
value_basis: "land_assess / imp_assess / tot_assess (Assessor gross assessed value, Indiana true tax value) are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. OWNER2 (2,041 rows) mixes co-owners with 'C/O' lines, so it is not mapped as a second owner. LastSaleDate/LastSalePrice are not mapped."
terms:
  url: https://maps.evansvillegis.com/arcgis_server/rest/services/PROPERTY/PARCELS/MapServer
  summary: "Evansville-Vanderburgh GIS public ArcGIS MapServer, copyright 'Vanderburgh County Assessors Office' ('GIS representation of current taxable property boundaries in Vanderburgh County IN'), no login, token or fee; no license text (read 2026-11-24). Indiana APRA IC 5-14-3-3(f) limits disclosing lists of names and addresses to commercial entities for commercial purposes (recorded as no_commercial_name_address_lists, as for config/states/in.yaml). maps.evansvillegis.com/robots.txt (read 2026-11-24): Crawl-delay 60; disallows /sites/, /admin/, /sessions/, /groups/, /people/, /workspace/ only, so /arcgis_server/ is allowed."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
