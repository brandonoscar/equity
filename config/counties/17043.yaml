source_id: il.dupage.parcels
state: IL
layer_url: https://services.arcgis.com/neJvtQ4PXvnQ86MJ/arcgis/rest/services/AssessmentParcels2025_RealEstateFile2025/FeatureServer/0
order_by: OBJECTID
page_size: 1000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "043"}
fields:
  situs_line1: PROPADDRL1
  situs_city: PROPCITY
  situs_zip: PROPZIP
  owner_type: OWNERSHIP_TYPE
  parcel_id: PIN
  owner1: BILLNAME         # tax-bill name (taxpayer), 25 characters, may be truncated
  mail_line1: BILLADDRL1
  mail_city: BILLCITY
  mail_state: BILLSTATE
  mail_zip: BILLZIP
  assessed_value: FCVTOTAL
  tax_year: {const: 2025}
value_basis: "Annual snapshot: 'Finalized End of Year Parcels and Real Estate Assessment data' for assessment year 2025 (taxes payable 2026), so tax_year is the const 2025. When DuPage publishes AssessmentParcels2026_RealEstateFile2026, point layer_url at it and change the const. FCVTOTAL = total assessed value (Illinois assesses at 33.33% of market; FCVLAND/FCVIMP split it, not mapped); BILLVALUE = taxable value after exemptions; TAXAMOUNT = billed tax (not mapped). BILLADDRL2 repeats 'CITY ST ZIP' and is not mapped. Owner names and mailing addresses are as of the finalized 2025 tax file, not the fetch date."
terms:
  url: https://www.arcgis.com/home/item.html?id=267208f2ecdb44a1913ec438aadc17d4
  summary: "DuPage County Illinois (ArcGIS Online org 'DuPage County Illinois'), AssessmentParcels2025_RealEstateFile2025: finalized year-end parcels joined to the real-estate tax file. Public, free, no login, 337,072 rows on 2026-11-16 (734 with no bill name). No licenseInfo on the item. The county's live layer (gis.dupageco.org ParcelsWithRealEstateCC) could not be reached from here. No commercial-use or mailing-list restriction found."
  checked_on: 2026-11-16
  robots_checked_on: 2026-11-16
  cost_model: free
