source_id: mn.rice.parcels
state: MN
# Rice County, Minnesota 'Maps/TaxParcels' map service layer 1 Tax Parcels (MN parcel standard
# fields from the county assessor): owner, owner mailing lines, situs, EMV, use class, homestead.
# 28,263 rows on 2026-11-25 (OWNER_NAME on 28,096). mn.statewide.parcels also carries Rice, with
# dash-separated county_pin ('22-07-1-26-011') where this layer uses dots ('01.01.1.00.001').
layer_url: https://asr-arcgis01.ricecountymn.gov/arcgis/rest/services/Maps/TaxParcels/MapServer/1
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "131"}
fields:
  parcel_id: COUNTY_PIN
  owner1: OWNER_NAME
  owner2: OWNER_MORE
  mail_line1: OWN_ADD_L1
  mail_city_state_zip: OWN_ADD_L2   # 'ELKO MN  55020-9402'; OWN_ADD_L3/L4 are null on every row
  situs_line1: SiteAddrFull
  situs_city: SITUS_CITY
  situs_state: SITUS_STATE
  situs_zip: ZIP
  land_use_desc: USECLASS1
  homestead: HOMESTEAD    # Yes / No
  land_value: EMV_LAND
  bldg_value: EMV_BLDG
  total_value: EMV_TOTAL
  tax_year: TAX_YEAR
value_basis: "EMV_LAND / EMV_BLDG / EMV_TOTAL = county estimated market value per the MN parcel standard. tax_year = TAX_YEAR, the taxes-payable year in the standard (2026 in the rows sampled; MKT_YEAR, the assessment year, is also 2026 there, so the layer's two year fields do not follow the usual payable = assessment + 1 pattern; TAX_YEAR is used as in mn.statewide.parcels). TAX_CAPAC / TOTAL_TAX / SPEC_ASSES and the sale fields are not mapped; only USECLASS1 is mapped."
terms:
  url: https://asr-arcgis01.ricecountymn.gov/arcgis/rest/services/Maps/TaxParcels/MapServer
  summary: "Rice County, MN 'TaxParcels' map service ('Tax Parcels in Rice County, MN', credit 'Rice County'); free REST, no login; 28,263 rows on 2026-11-25. Service iteminfo licenseInfo is a disclaimer: data furnished with no warranty of any kind, not suitable for legal, engineering or surveying purposes, Rice County not liable; no commercial-use, resale or mailing-list restriction. asr-arcgis01.ricecountymn.gov /robots.txt answers 404 (RFC 9309: no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
