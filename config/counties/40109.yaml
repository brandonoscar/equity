source_id: ok.oklahoma.parcels
state: OK
# Oklahoma County (AGOL org 'Oklahoma County', item 'Tax Parcels Public', snippet 'Oklahoma County
# Tax Parcels'). 338,876 rows, 331,125 distinct accountno (stacked rows). name2 often holds a
# second owner or trust/c-o text. location / locationcity = situs (not mapped).
layer_url: https://services8.arcgis.com/euhkr1dAJeQBIjV0/ArcGIS/rest/services/TaxParcelsPublics_view/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "109"}
fields:
  parcel_id: accountno
  owner1: name1
  owner2: name2
  mail_line1: mailingaddress1
  mail_city: city
  mail_state: state
  mail_zip: zipcode
  land_value: landvalue
  total_value: currentmarket
  assessed_value: currentassessed
  tax_year: {const: 2026}
extra_pii: [name3]
value_basis: "currentmarket = Assessor fair cash (market) value; landvalue = land market value; currenttaxable = capped taxable market value (Oklahoma 3%/5% cap), not mapped; currentassessed = assessed value (about 11-12% of taxable market in Oklahoma County); netassessed = assessed after exemptions, not mapped. No tax-year field: tax_year is the const 2026 (January 1, 2026 roll; data edited 2026-11-14). Bump the const for the 2027 roll."
terms:
  url: https://services8.arcgis.com/euhkr1dAJeQBIjV0/ArcGIS/rest/services/TaxParcelsPublics_view/FeatureServer
  summary: "Oklahoma County OK (AGOL org 'Oklahoma County' / Ok-Co, item 'Tax Parcels Public', owner artimcon), public hosted FeatureServer view, no token. Free, no login, 338,876 rows on 2026-11-18. No license, description or use-constraint text in the item. services8.arcgis.com /robots.txt answers 403 (RFC 9309: allowed)."
  checked_on: 2026-11-18
  robots_checked_on: 2026-11-18
  cost_model: free
