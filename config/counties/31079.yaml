# accessInformation 'Hall County, Nebraska'): current owner name and property street line only.
# The statewide layer (ne.statewide.parcels) has Hall County values but no owner names.
layer_url: https://services3.arcgis.com/H1fomogcAqX4720J/ArcGIS/rest/services/PV1_ParcelManagement/FeatureServer/1
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "079"}
use_restrictions: [internal_use_only, no_redistribution]
fields:
