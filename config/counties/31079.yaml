  owner1: CURRENT_OWNER
  situs_line1: SITUS     # '123 W 2ND ST' (no city or ZIP)
  situs_state: {const: NE}
value_basis: "No value, mailing-address or tax-year fields in this layer (owner name, legal description and site street only)."
