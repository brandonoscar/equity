source_id: tx.williamson.parcels
state: TX
# Williamson Central Appraisal District tax parcels, updated nightly (292,084 rows on
# 2026-11-24; OWNERNME1 filled on 291,903): owner, owner mailing address, situs.
# tx.statewide.parcels (StratMap, annual) keys the same district property id.
layer_url: https://services1.arcgis.com/Xff0bbfp6vwIWmlU/arcgis/rest/services/WCAD_Tax_Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "491"}
fields:
  parcel_id: PropertyID  # WCAD property id, e.g. '376239' (null on 181 rows); PARCELID is the 'R556803' quick-ref id
  owner1: OWNERNME1
  mail_line1: PSTLADDRESS
  mail_city: PSTLCITY
  mail_state: PSTLSTATE
  mail_zip: PSTLZIP5
  situs_full: SITEADDRESS   # '3803 RR 1869, LIBERTY HILL, TX  78642'
  land_use_code: USECD
  land_use_desc: USEDSCRP
value_basis: "Not mapped: on 2026-11-24 the current-year fields (LNDVALUE, CNTASSDVAL, CNTTXBLVAL) are 0 on every row and the prior-year fields (PRVASSDVAL, PRVTXBLVAL) carry no year, so no tax_year is mapped and no assessment facts are emitted. OWNERNME2 is empty on every row. InstrumentNumber (recording of the last deed) is not mapped: the schema's deed fields are book/page."
