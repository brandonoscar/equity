source_id: sc.beaufort.parcels
state: SC
# Beaufort County (SC) parcels joined to the assessor's GIS file, as published in the county's
# EnerGov map service (141,568 rows on 2026-11-25; GisFile_PIN on all but 1, GisFile_Owner1
# filled on 140,557): owner names, owner mailing address, property address, last deed
# book/page, property class.
layer_url: https://gis.beaufortcountysc.gov/server/rest/services/EnerGov/MapServer/1
order_by: OBJECTID
page_size: 2000          # maxRecordCount 10000; supportsPagination true
min_interval_s: 1.0
county: {constant: "013"}
fields:
  parcel_id: GisFile_PIN        # 'M100 006 000 0611 0000' (whitespace removed in the key)
  owner1: GisFile_Owner1
  owner2: GisFile_Owner2
  mail_line1: GisFile_MailingAdd
  mail_city: GisFile_City
  mail_state: GisFile_State
  mail_zip: GisFile_ZIP
  situs_line1: GisFile_SitusAddre  # '5 GUM TREE RD Unit K2'; blank on mobile-home and land rows
  situs_state: {const: SC}
  deed_book: GisFile_Book
  deed_page: GisFile_Page
  land_use_desc: GisFile_ClassCode # 'ResImp CondominiumUnit SglFam'
value_basis: "GisFile_Land / GisFile_Improvemen / GisFile_Appraised, GisFile_Capped (Act 388 capped value), GisFile_Assessed and GisFile_Taxable are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. GisFile_SaleDate / SalePrice (last sale) and GisFile_Exemption are not mapped. GisFile_Status is 'A' on most rows and 'C' on 1,184 (meaning not documented); no status filter is applied."
terms:
  url: https://gis.beaufortcountysc.gov/server/rest/services/EnerGov/MapServer
  summary: "Beaufort County (SC) ArcGIS Server, EnerGov map service layer 1 'Parcels' (the county's permitting map; the same server's Hosted folder needs a token, this service does not); public, no login, token or fee. No copyright, licence or use-restriction text on the service or its item info (read 2026-11-25). gis.beaufortcountysc.gov/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
