source_id: ga.bartow.parcels
state: GA
# Bartow County (GA) GIS (bartowgis.org) 'BartowLand' feature service, layer 2 'Tax Parcels'
# (64,016 rows on 2026-11-25; PARCELID on all but 1, Owner1 filled on 63,897): owner names,
# owner mailing address, from the Tax Assessors' roll.
layer_url: https://www.bartowgis.org/arcgis/rest/services/AGOServices/BartowLand/FeatureServer/2
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "015"}
fields:
  parcel_id: PARCELID    # '0002-0059-001'
  owner1: Owner1         # blank-padded text (whitespace collapsed)
  owner2: Owner2
  mail_line1: Mailing_Address_1
  mail_line2: Mailing_Address_2
  mail_city: Mailing_City
  mail_state: Mailing_State
  mail_zip: Mailing_Zip
value_basis: "LandValue / BuildingValue / AccessoryValue / Total_Taxable_FMV are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. The site address (HOUSE_NO + STREET_NAM, Property_Zip) is not mapped: HOUSE_NO is 0 or null on 4,307 rows, which would put a false house number on the line (as in al.marshall.parcels)."
terms:
  url: https://www.bartowgis.org/arcgis/rest/services/AGOServices/BartowLand/FeatureServer
  summary: "Bartow County (GA) GIS ArcGIS Server (www.bartowgis.org), AGOServices/BartowLand FeatureServer layer 2 'Tax Parcels'; public, no login, token or fee. No copyright, licence or use-restriction text on the service or its item info (read 2026-11-25). www.bartowgis.org/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
