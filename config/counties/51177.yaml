source_id: va.spotsylvania.parcels
state: VA
# Spotsylvania County (VA) GIS GeoHub 'Parcel View' layer: tax parcels joined to the
# Commissioner of the Revenue's real estate records (69,546 rows on 2026-11-24; OwnerSearch filled
# on all; 4,938 transfers dated 2026): owner name, owner mailing address, property street address,
# deed book/page, zoning.
layer_url: https://gis.spotsylvania.va.us/arcgis/rest/services/GeoHub/GeoHub/FeatureServer/45
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "177"}
fields:
  parcel_id: GPIN        # '7279-37-0544'; MAP_Pin '10-1-A' is the tax map number
  owner1: OwnerSearch    # all owners on one line ('John C Forbes & Janet F VanVickle')
  mail_line1: MAILADDRESS
  mail_city: CITY
  mail_state: STATE
  mail_zip: ZIPCODE
  situs_line1: PROPADDRESS   # street only; PROPCITY is 'Fredericksburg, VA' (city + state), not mapped
  situs_state: {const: VA}
  deed_book: BOOKNUM     # blank for deeds recorded by instrument number (INSTNO, not mapped)
  deed_page: PAGE
  zoning: ZONING
value_basis: "LANDASSESSMENT / BLDGASSESSMENT are present (as text) but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. SALEPRICE / TRANSFERDATE are not mapped. LANDUSE is empty on the sampled rows, not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=386eb3a1f21e4a238f608ecf3322ae24
  summary: "Spotsylvania County GIS (copyrightText 'Spotsylvania GIS') GeoHub map/feature service on the county's own server gis.spotsylvania.va.us, layer 'Parcel View', no login, token or fee; the service exists to feed the county GeoHub open-data downloads. The county's ArcGIS Online copy of the same layer (item 'Parcel View Web', owner Spotsy_SiteAdmin, modified 2026-11-05) has empty licenseInfo, accessInformation and description (read 2026-11-24); no resale, redistribution or mailing-list clause found. gis.spotsylvania.va.us/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
