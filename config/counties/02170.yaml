source_id: ak.matanuska_susitna.parcels
state: AK
# Matanuska-Susitna Borough Assessment Division parcels, OpenData FeatureServer on the borough's
# own GIS host (111,736 rows on 2026-11-25; OWNER_1 filled on 82,571, the rest mostly public or
# Native land with only GENOWN). Owner, co-owner, mailing address and assessed values; no situs
# address. MAILING_ADDRESS_LINE_A is a care-of/attention line (filled on 6,459 rows; not mapped),
# MAILING_ADDRESS_LINE_B the street line. Buyer_Name/Buyer_Mailing_* (land-sale contract buyers)
# are not mapped.
layer_url: https://maps.matsugov.us/map/rest/services/OpenData/Cadastral_Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 25000; supportsPagination true
min_interval_s: 1.0
county: {constant: "170"}
use_restrictions: [attribution_required, internal_use_only, no_redistribution]
fields:
  parcel_id: ACCOUNT     # borough account / tax id, '1791B04L014'
  owner1: OWNER_1
  owner2: NAME_2
  mail_line1: MAILING_ADDRESS_LINE_B
  mail_city: MAILING_ADDRESS_CITY
  mail_state: MAILING_ADDRESS_STATE
  mail_zip: MAILING_ADDRESS_ZIP
  land_use_code: LANDUSE  # 'RES', 'VACL', 'MLTF' ...
value_basis: "LANDVALUE / BLDGVALUE are the borough's land and building values (LANDASSD/BLDGASSD are empty on sampled rows); the layer carries no tax-year or roll-date field, so no tax_year is mapped and no assessment facts are emitted; raw values stay in source records. EXEMPTTOT/NETTAX not mapped. 14 rows have no ACCOUNT and are skipped."
terms:
  url: https://www.arcgis.com/home/item.html?id=ba832f9f96b84f4e816099049e74cb4d
  summary: "Matanuska-Susitna Borough ArcGIS item 'Cadastral Parcels' (owner MatSuBorough), public FeatureServer on maps.matsugov.us, no login, token or fee. licenseInfo (read 2026-11-25): data is copyrighted; the recipient may duplicate it 'for their personal or business' internal use' and to create other data or maps; 'Any transfer, sale, lease, or transmittal of the original data to any third party without value added or without the written authorization of the Borough' may violate the copyright; published products must cite the borough. Recorded as internal_use_only, no_redistribution, attribution_required (the project keeps the data internal). The borough removes owner names on request (Parcels_OptOut). maps.matsugov.us/robots.txt answers HTTP 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
