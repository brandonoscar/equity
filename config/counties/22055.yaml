source_id: la.lafayette.parcels
state: LA
# Lafayette Consolidated Government (Lafayette Parish, LA) parcels joined to the assessor CAMA
# record (view dbo.Parcels_with_CAMA_Data_View on LCG's own ArcGIS Server; 120,545 rows on
# 2026-11-25, all 'Active Account', Owners and Assmt_Num filled on every row): owner names,
# owner mailing address, property location, assessed/homestead/taxable values, recorded
# instrument numbers. The portal item for this service is private, but the REST service answers
# anonymous queries (no token, login or CAPTCHA). Owners holds every owner in one string
# separated by ',,' ('SMITH JOHN,,SMITH JANE'); it is kept whole as owner1 (never split here).
# Property_Location likewise lists several addresses ('212 GOODIE RD,,214 GOODIE RD,').
layer_url: https://maps.lafayettela.gov/arcgis/rest/services/BaseLayers/LCG_Parcels_with_CAMA_Data_View/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "055"}
fields:
  parcel_id: Assmt_Num   # assessment number, e.g. '6035168'
  owner1: Owners
  mail_line1: Mail_Line1
  mail_line2: {join: [Mail_Line2, Mail_Line3, Mail_Line4, Mail_Line5]}
  mail_city: Mail_City
  mail_state: Mail_State
  mail_zip: Mail_Zip
  situs_line1: Property_Location
  land_use_code: Land_Use_Code
  land_use_desc: Land_Use_Desc
value_basis: "Tot_Assessed_Value / Tot_Homestead / Tot_Taxable_Value = assessor total assessed value (Louisiana: 10% of fair market value for land and residences, 15% for commercial improvements), homestead exemption and taxable value. The view carries no tax year, so the values are not mapped (no assessment rows); Value_Objects and Property_Transactions (instrument numbers with dates) are not mapped either."
use_restrictions: [internal_use_only]
terms:
  url: https://maps.lafayettela.gov/arcgis/rest/services/BaseLayers/LCG_Parcels_with_CAMA_Data_View/FeatureServer
  summary: "Lafayette Consolidated Government ArcGIS Server (maps.lafayettela.gov), service BaseLayers/LCG_Parcels_with_CAMA_Data_View; answers anonymous REST queries, no login, token or fee. No copyrightText, description or licence in the service metadata (read 2026-11-25). Its ArcGIS portal item is not shared publicly, so the data is treated as not published for redistribution: recorded internal_use_only (the project keeps it internal). maps.lafayettela.gov/robots.txt answers HTTP 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
