source_id: sc.spartanburg.parcels
state: SC
# Spartanburg County (SC) GIS 'CAMA Parcels': parcels with the Assessor's ownership (CAMA) table,
# 'updated nightly from SQL' (183,465 rows on 2026-11-24; OwnerName filled on 182,642; MAPNUMBER
# null on 30, skipped; 12 extra building cards share a MAPNUMBER and collapse to one parcel):
# owner name, mailing address, property location, deed book/page, land use.
layer_url: https://maps.spartanburgcounty.org/server/rest/services/GIS/CAMA_Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "083"}
fields:
  parcel_id: MAPNUMBER   # '2-37-00-037.08' (tax map number); AccountNumber is the CAMA account
  owner1: OwnerName      # 'PATEL ANKIT D &' (a trailing '&' means a second owner on the next line)
  mail_line1: StreetAddress
  mail_city: City
  mail_state: State
  mail_zip: Zip
  situs_line1: PropertyLocation   # street and city with no separator ('326 ELEVATION CT INMAN'), kept whole
  situs_state: {const: SC}
  deed_book: DeedBook    # '130Z'
  deed_page: DeedPage
  land_use_desc: LandUse # 'RESIDENTIAL - SINGLE FAMILY'
extra_pii: [TaxpayerName, PreviousOwnerName]
value_basis: "Current/Previous Appraised, Taxable and Assessed land and building values are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. TaxpayerName is not mapped: it repeats OwnerName on 109,853 rows and otherwise holds the second owner after a trailing '&' ('BROWNLEE RICHARD &' / 'BROWNLEE TONYA') or a different taxpayer, which the layer does not distinguish. PreviousOwnerName, SaleDate and SaleAmount are not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=f07cb730317e481fba314ab641949694
  summary: "Spartanburg County GIS ArcGIS Online item 'CAMA Parcels' (owner GIS_SpartCo; 'Parcels with assessor's ownership information (CAMA table) included for each parcel, updated nightly from SQL'), public FeatureServer on maps.spartanburgcounty.org, no login, token or fee. licenseInfo and accessInformation are empty (read 2026-11-24); no resale, redistribution or mailing-list clause found. maps.spartanburgcounty.org/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
