source_id: ia.blackhawk.parcels
state: IA
# Black Hawk County "ParcelFabricPublished" (Assessor parcel fabric export), layer 15 Pclwattr
# (parcel polygons with attributes; data last edited 2026-11-04). Layer 0 is the label-point twin.
layer_url: https://services5.arcgis.com/ya62ECiavqTkK0wv/arcgis/rest/services/ParcelFabricPublished_gdb/FeatureServer/15
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "013"}
fields:
  land_use_code: class_subc
  situs_line1: propertyad
  parcel_id: PIN
  owner1: deedholder
  owner2: deedhold_1
  mail_line1: taxmailto3          # street line of the tax-mailing block
  mail_city_state_zip: taxmailto5 # 'CITY, ST 12345'
  land_value: landval
value_basis: "landval / bldgval / dwlgval = Black Hawk County Assessor values (Iowa assesses at 100% of market). Buildings are split into bldgval (non-dwelling) and dwlgval (dwelling) with no total field, so only land_value is mapped. No year field. taxmailto1 is the tax-statement name, taxmailto2 a c/o line (usually blank); neither mapped. contract1/contract2 (contract buyers) not mapped. bookpage holds deed book/page as one string."
terms:
  url: https://www.arcgis.com/home/item.html?id=581e6313d07a4c5bb8a2dac8f446696d
  summary: "Black Hawk County item 'ParcelFabricPublished', public, no token, 76,143 polygon rows on 2026-11-18 (deedholder filled on all). Description: 'PARCEL FABRIC EXPORT. PLEASE REVIEW DATA CAREFULLY.' licenseInfo: no-warranty disclaimer only ('compiled from official records ... only contain information required for government purposes'); no commercial, resale or mailing-list clause. services*.arcgis.com /robots.txt answers HTTP 403 'Invalid URL' (RFC 9309: 4xx = no rules, allowed; the repo PoliteClient currently treats 401/403 as disallow-all, see states_midwest.md blocker 1)."
  checked_on: 2026-11-18
  robots_checked_on: 2026-11-18
  cost_model: free
