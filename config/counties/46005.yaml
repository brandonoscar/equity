source_id: sd.beadle.parcels
state: SD
# Beadle County (Huron) parcels on the First District Association of Local Governments GIS server
# (beadleparcels MapServer layer 0 'PARCEL'; 16,909 rows on 2026-11-25, OWNER_NAME filled on
# 15,241, sales recorded through 2026): owner, additional owner, mailing address, property address
# and taxable/assessed values. MAIL_RECIP (a care-of recipient) and the CFD_* contract-for-deed buyer
# columns are not mapped.
layer_url: https://www.1stdistrict.org/arcgis/rest/services/Beadle/beadleparcels/MapServer/0
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
county: {constant: "005"}
fields:
  parcel_id: PARCEL_ID   # '7920'
  owner1: OWNER_NAME
  owner2: ADDL_OWNER
  mail_line1: OWNER_STRE
  mail_city: OWNER_CITY
  mail_state: OWNER_ST
  mail_zip: OWNER_ZIP
  situs_line1: PROPERTY_A
  situs_state: {const: SD}
  land_use_code: LAND_CODE
  land_value: LAND_TV
  bldg_value: BUILD_TV
  assessed_value: TOTAL_AV
  tax_year: {as_retrieved: true}   # no assessment-year field: values as observed on retrieval
value_basis: "LAND_TV / BUILD_TV = land and building value, TOTAL_AV = total assessed value (LAND_TV + BUILD_TV = TOTAL_AV on sampled rows). YEAR_DUE (2026 on 14,042 rows) is the year the tax is due, not the assessment year, so values are recorded as observed on retrieval (tax_year: as_retrieved). BOOK / PAGE hold short codes ('1G', '1J') whose meaning the service does not give, so no deed is mapped. TOTAL_BILL, SALE_PR / SALE_DATE not mapped."
terms:
  url: https://www.1stdistrict.org/arcgis/rest/services/Beadle/beadleparcels/MapServer
  summary: "First District Association of Local Governments (Watertown, SD) public ArcGIS Server MapServer for Beadle County; no login, token or fee. No licenseInfo, copyright or use-constraint text on the service (read 2026-11-25). www.1stdistrict.org/robots.txt answers HTTP 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
