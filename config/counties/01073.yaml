source_id: al.jefferson.parcels
state: AL
layer_url: https://jccgis.jccal.org/server/rest/services/Basemap/Parcels/MapServer/0
order_by: OBJECTID
page_size: 1000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "073"}
fields:
  parcel_id: PARCELID
  owner1: OWNERNAME
  owner2: Name2
  mail_line1: PROP_MAIL
  mail_city: CITYMAIL
  mail_state: STATE_Mail
  mail_zip: ZIP_MAIL
  land_value: PrevParcelLand
  bldg_value: PrevParcelImp
  total_value: PrevParcelTotal
  assessed_value: AssdValue
value_basis: "PrevParcelLand/PrevParcelImp/PrevParcelTotal = appraised land/improvement/total (the field names say 'Prev'); AssdValue = assessed value (Alabama classes: 10% residential, 20% other). RecordYear = 2027 on every row, but the 'Prev' names do not say which roll year the values belong to (Alabama lien date is Oct 1). So tax_year is not mapped and no assessment facts are emitted; the raw values stay in source records."
terms:
  url: https://jccgis.jccal.org/server/rest/services/Basemap/Parcels/MapServer
  summary: "Jefferson County Commission ITS-GIS parcel layer, rebuilt nightly from Development Services (addressing), Tax Assessor (boundaries) and Board of Equalization (ownership). Public MapServer, free, no login, 410,170 rows on 2026-11-16 (845 with no owner). No license or use-constraint text in the service metadata."
  checked_on: 2026-11-16
  robots_checked_on: 2026-11-16
  cost_model: free
