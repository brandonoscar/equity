source_id: az.mohave.parcels
state: AZ
# ADWR General/Parcels/MapServer layer 8 (Mohave). Owner name only: no mailing address, no values.
# Layer description: 'Original data in ...\AZ_Parcels\Mohave\2023\November', so the snapshot may be
# ~3 years old; its referenced parcelUpdate/parcelOwner tables are not published in this service.
layer_url: https://azwatermaps.azwater.gov/arcgis/rest/services/General/Parcels/MapServer/8
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "015"}
use_restrictions: [no_redistribution]
fields:
  situs_line1: SITE_ADDRESS
  situs_city: SITE_CITY
  situs_zip: SITE_ZIP
  parcel_id: APN
  owner1: OWNER_NAME
value_basis: "No value fields in this layer (OBJECTID, ID, COUNTY, APN, BOOK, MAP, PARCEL, SUFFIX, SITE_ADDRESS, SITE_CITY, SITE_ZIP, OWNER_NAME, URL, ACRES_US)."
terms:
  url: https://azwatermaps.azwater.gov/arcgis/rest/services/General/Parcels/MapServer
  summary: "ADWR public MapServer, no token. Free, no login, 266,190 rows on 2026-11-18. Layer copyrightText 'Arizona Department of Water Resources'; service item licenseInfo/accessInformation empty; the host root is a bare IIS page with no terms. The ADWR Data Disclaimer (see config/counties/04019.yaml: as-is, ADWR retains IP, 'requests that persons ... not make it available to others for their re-use') is recorded as no_redistribution. No commercial-purpose statement, fee or agreement is required to use this endpoint; A.R.S. 39-121.03 is the backdrop for commercial use of county assessor data. azwatermaps.azwater.gov /robots.txt answers 404 (no rules, allowed)."
  checked_on: 2026-11-18
  robots_checked_on: 2026-11-18
  cost_model: free
