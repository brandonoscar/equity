source_id: nc.swain.parcels
state: NC
# Swain County, North Carolina ArcGIS Online item 'Swain County Parcels' (owner
# austinb_swaincountygis, data last edited 2026-11-25): owner names, mailing address, property
# address, land / building / extra-feature values and total, last deed book/page.
# 13,569 rows on 2026-11-25. nc.statewide.parcels has 12,669 Swain rows but parno is empty on all
# of them (the 12-digit PIN is in altparno), so it yields no Swain parcels.
layer_url: https://services3.arcgis.com/bAaHaqP9BvQhS7eE/arcgis/rest/services/Swain_County_Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "173"}
fields:
  parcel_id: PARCEL_ID
  owner1: Name__1
  owner2: Name__2
  mail_line1: Address_Line_1
  mail_line2: Address_Line_2
  mail_city: City
  mail_state: State
  mail_zip: Zip_Code      # integer
  situs_line1: ParcelPropertyAddress
  deed_book: Deed_Book
  deed_page: Deed_Page
  land_value: Land_Value_Parcel
  bldg_value: Building_Value_Parcel
  total_value: Total_Assessed_Value
  tax_year: {as_retrieved: true}   # no roll-year field: values as observed on retrieval
value_basis: "Land_Value_Parcel / Building_Value_Parcel / OBXF_Value_Parcel (outbuildings and extra features, not mapped) sum to Total_Assessed_Value; North Carolina assesses at 100% of market value as of the county's last general reappraisal, so the total is mapped as total_value. No roll-year field, so tax_year is {as_retrieved: true}: values are recorded as observed on the retrieval date (tax_year = that year, valid_from = that date), not assigned to a roll year. Deed_Book / Deed_Page are the last deed's book and page as the county keys them; some rows carry instrument codes instead ('DEAT'/'CERT' for a death certificate, 'WILL'/'00DC' for an estate file), which are kept as given. Address_Line_3, Plat_Book / Plat_Page and Deed_Date are not mapped."
terms:
