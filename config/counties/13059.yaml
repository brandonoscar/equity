source_id: ga.clarke.parcels
state: GA
# Athens-Clarke County (GA) parcels on the unified government's ArcGIS Server (ACC_Parcels;
# 43,633 rows on 2026-11-25, edits through 2026-10; OWNER_NAME filled on 42,959): owner name,
# owner mailing address, property street address.
layer_url: https://enigma.accgov.com/server/rest/services/ACC_Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "059"}
# 81 parcels publish the owner as the literal 'REDACTED' (O.C.G.A. 48-5-4 style withholding):
# left out so no party named 'REDACTED' is created.
filter: "OWNER_NAME IS NULL OR OWNER_NAME <> 'REDACTED'"
fields:
  parcel_id: PARCEL_NO   # '252A1 A030' (whitespace removed in the key); empty on 102 rows
  owner1: OWNER_NAME
  mail_line1: OWNER_ADD
  mail_city: CITY
  mail_state: STATE
  mail_zip: ZIP
  situs_line1: PAR_ADD
  situs_state: {const: GA}
value_basis: "The layer has no value fields, so no assessment facts are emitted. EXEMPTION (homestead codes such as 'S1') is not mapped: homestead is only recorded with an assessment fact."
terms:
  url: https://enigma.accgov.com/server/rest/services/ACC_Parcels/FeatureServer
  summary: "Unified Government of Athens-Clarke County (GA) ArcGIS Server (enigma.accgov.com), ACC_Parcels FeatureServer; public, no login, token or fee. The service and its item info carry no copyright, licence or use-restriction text (read 2026-11-25). enigma.accgov.com/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
