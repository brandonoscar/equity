order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "005"}
fields:
  situs_line1: SITUS
  situs_city: SITUS_CITY
  situs_zip: SITUS_ZIP
  parcel_id: APN           # null on 1 row
  owner1: OWNERNAME
  mail_line1: OWNERADDRESS_ADDRESS1
  mail_line2: OWNERADDRESS_ADDRESS2
  mail_city: OWNERADDRESS_CITY
  mail_state: OWNERADDRESS_STATE
  mail_zip: OWNERADDRESS_ZIP
value_basis: "No value fields in this layer. Values would need the Coconino Assessor (not in this view)."
