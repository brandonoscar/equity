source_id: ga.cherokee.parcels
state: GA
# Cherokee County (GA) GIS 'MainLayersOnline' parcels (116,137 rows on 2026-11-25; TIN filled on
# every row, OWNER on 115,257): owner name(s), owner mailing address, property address,
# last deed book/page, zoning.
layer_url: https://gis.cherokeecountyga.gov/arcgis/rest/services/MainLayersOnline/MapServer/1
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "057"}
fields:
  parcel_id: TIN         # '23N08   048  D' (tax id; whitespace removed in the key)
  owner1: OWNER          # all owners in one string: 'SMITH JOHN, SMITH JANE'
  mail_line1: Mailing_Address
  mail_line2: Mailing_Suite
  mail_city: Mailing_City
  mail_state: Mailing_State
  mail_zip: Mailing_Zip
  situs_line1: Property_Address
  situs_city: Property_City
  situs_zip: Property_Zip
  deed_book: DEEDBOOK
  deed_page: DEEDPAGE
  zoning: Zoning
value_basis: "The public layer has no value fields (MainLayersPRO carries CURR_VAL without a tax year), so no assessment facts are emitted. TaxYear is null on sampled rows."
terms:
  url: https://gis.cherokeecountyga.gov/arcgis/rest/services/MainLayersOnline/MapServer
  summary: "Cherokee County (GA) GIS ArcGIS Server, MainLayersOnline layer Parcels (copyright 'Cherokee County GIS'); public MapServer, no login, token or fee. No licence or use-restriction text on the service or its item info (read 2026-11-25). gis.cherokeecountyga.gov/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
