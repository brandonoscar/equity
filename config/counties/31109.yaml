source_id: ne.lancaster.parcels
state: NE
# Lancaster County (NE) Assessor tax parcels on the City of Lincoln / Lancaster County GIS server
# ('Data is maintained and updated daily by the Lancaster County, NE Assessor's Office'; 122,811
# rows on 2026-11-24; OWNERNME1 filled on 122,051; edits up to 2026-11-23): owner, owner mailing
# address, site address, class. ne.statewide.parcels has no owner names.
layer_url: https://gis.lincoln.ne.gov/public/rest/services/Assessor/TaxParcels/MapServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 10000; supportsPagination true
min_interval_s: 1.0
county: {constant: "109"}
fields:
  parcel_id: PARCELID    # '0101100002000' (same as LOWPARCELID)
  owner1: OWNERNME1      # 'WHEELOCK, GENE ALLEN & PATSY LEE'
  owner2: OWNERNME2      # empty on every row sampled 2026-11-24
  mail_line1: PSTLADDRESS    # LGIM postal (owner mailing) address
  mail_city: PSTLCITY
  mail_state: PSTLSTATE
  mail_zip: PSTLZIP5
  # 'LINE, CITY, NE, ZIP' (a comma before the ZIP): does not match the 'LINE, CITY, ST ZIP'
  # layout, so it is kept whole as the street line.
  situs_full: SITEADDRESS
  land_use_code: CLASSCD     # 'R1'
  land_use_desc: CLASSDSCRP  # 'Residential Improved'
value_basis: "LNDVALUE, PRVASSDVAL / CNTASSDVAL (prior and current assessed value) and the taxable / tax-due columns are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. CNVYNAME (grantee on the last conveyance) is not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=e311ff702f1b491997a770607633ab07
  summary: "City of Lincoln / Lancaster County, NE GIS ArcGIS Online item 'Parcels' (owner CountyCityPub; accessInformation 'City of Lincoln\\Lancaster County, NE GIS'; 'Tax Parcels within Lancaster County, NE. Data is updated nightly.'), public MapServer on gis.lincoln.ne.gov, no login, token or fee. The item has no licenseInfo (read 2026-11-24); no resale, redistribution or mailing-list clause found. gis.lincoln.ne.gov/robots.txt (Cloudflare managed, read 2026-11-24): 'User-agent: * Allow: /' with 'Content-Signal: search=yes,ai-train=no,use=reference'; only named AI crawlers (ClaudeBot, GPTBot, CCBot ...) are disallowed."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
