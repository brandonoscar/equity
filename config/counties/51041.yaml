# Chesterfield County 'ParcelsEnriched' (Cadastral_ProdA layer 3): parcels joined to CAMA.
# 151,015 rows, 145,421 distinct GPIN (condo/stacked rows repeat GPIN); 152 rows have no CAMA join.
# Situs: Address/Zip (not mapped). Name is a 15-digit tax id string, not a person name.
layer_url: https://services3.arcgis.com/TsynfzBSE6sXfoLq/arcgis/rest/services/Cadastral_ProdA/FeatureServer/3
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "041"}
fields:
  situs_line1: Address
  situs_zip: Zip
  parcel_id: GPIN
  owner1: OwnerName
  mail_line1: OwnerAddress
  mail_city: OwnerCity
  mail_state: OwnerState
  mail_zip: OwnerZip
  land_value: FairMarketValue
  bldg_value: ImprovementValue
  assessed_value: TotalAssessment
  tax_year: AssessmentYear
  deed_book: DeedBook
  deed_page: Page
value_basis: "From sampled rows: FairMarketValue = land fair-market value; LandUseValue = land-use (use-value taxation) land value, 0 when not enrolled; ImprovementValue = improvements; TotalAssessment = (LandUseValue if enrolled else FairMarketValue) + ImprovementValue, i.e. the taxable assessment (Virginia assesses at 100% of FMV). total_value is not mapped because no field holds total FMV for land-use parcels. AssessmentYear = 2026 on 150,863 rows. Semantics inferred from arithmetic, not from county documentation."
