source_id: sd.pennington.parcels
state: SD
# Rapid City / Pennington County (RCPC) open-data 'Tax Parcels' (Pennington County parcel fabric
# joined to the Director of Equalization's records; 54,804 rows on 2026-11-24; GranteeLastName
# filled on 54,400; rebuilt 2026-07-16, 2,226 grantee instruments dated 2026): current owner
# (grantee), owner mailing address, property street, land use.
layer_url: https://gis.rcgov.org/server/rest/services/OpenData/TaxParcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "103"}
fields:
  parcel_id: PIN         # '3701284004'; TaxID is the account number
  # Grantee on the last recorded instrument = current owner: 'GEIGLE' + 'NORMAN' + 'A'.
  # Grantee2ndName / Grantee2ndInitial hold a second first name without a surname ('DIANE' 'R'),
  # so no second owner is mapped.
  owner1: {join: [GranteeLastName, Grantee1stName, Grantee1stInitial]}
  mail_line1: GranteeFullAddr    # '402 SOUTH ST'
  mail_city: GranteeCity
  mail_state: GranteeState
  mail_zip: GranteeZip
  situs_line1: PropAddress       # street only, often without a house number ('E QUINCY ST')
  situs_state: {const: SD}
  land_use_code: LandUse         # 'N'
extra_pii: [Grantee2ndName, Grantee2ndInitial, GrantorLastName, Grantor1stName, GrantorStreetAddr, GrantorStreetName]
value_basis: "ValueLand / ValueTotal / ValueNAStructure / ValueAgStructure are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. Grantor* (seller on the last instrument) and GranteeInst* (instrument date / doc no., MMDDYY text) are not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=27362e2709c2472a90e160e09f906ac4
  summary: "Rapid City / Pennington County (RCPC) joint GIS open-data item 'RCPC Open Data: Parcels' ('Parcel boundary information for Pennington County, South Dakota'), public FeatureServer in the OpenData folder of gis.rcgov.org, no login, token or fee. The item has no licenseInfo or accessInformation (read 2026-11-24); no resale, redistribution or mailing-list clause found. gis.rcgov.org/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
