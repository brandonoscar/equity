source_id: ia.woodbury.parcels
state: IA
# Woodbury County (IA) parcel fabric joined to the Assessor's records, published by WCICC-IT
# (Woodbury County Information & Communication Commission) GIS as 'Woodbury County, Iowa - Parcel
# Data Feature' (55,596 rows on 2026-11-24; deedhldr_name1 filled on 54,962; data last edited
# 2026-06-25, 450 sales dated 2026): deed holder, deed holder address, site address, deed
# roll/image. The item title carries the publish date ('June 25, 2026 - 11:37 AM'); the service
# name stays the same between republishes.
layer_url: https://services.arcgis.com/kd1jFI4TM5bZHeP8/arcgis/rest/services/Woodbury_County_IA_Parcel_Data_Feature/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "193"}
fields:
  parcel_id: PIN         # '864336400007'; parcel is the Assessor's internal number
  owner1: deedhldr_name1 # 'WOOSTER MICHAEL J'
  # deedhldr_name2 is mixed: a care-of line ('% KRIENER FARM MGMT INC'), a name continuation or
  # a second holder ('TRUPP FAMILY TRUST'), so it is not mapped as owner2.
  mail_line1: deedhldr_addr1
  mail_line2: deedhldr_addr2
  mail_city: deedhldr_city
  mail_state: deedhldr_state
  mail_zip: deedhldr_zip
  situs_line1: [addr_num, addr_stname, addr_unit]   # '4765' / '340TH ST'; empty on rural parcels
  situs_city: addr_city
  situs_state: {const: IA}
  deed_book: deed_roll   # Iowa recorder roll / image ('752' / '8543')
  deed_page: deed_image
  land_use_code: land_class    # 'R'
  zoning: ZONING
extra_pii: [deedhldr_name2, contr_buyer_name1, contr_buyer_name2, contr_buyer_addr1, contr_buyer_addr2]
value_basis: "The layer has no assessed value fields (only sale_price, con_tax / net_tax and the sales ratio); no values or tax_year are mapped and no assessment facts are emitted. contr_buyer_* (contract buyer, filled on 962 rows) is not mapped as an owner."
terms:
  url: https://www.arcgis.com/home/item.html?id=e0c2830cf2a74fd39d3875434d756fb4
  summary: "WCICC-IT GIS (Woodbury County Information & Communication Commission, the county/Sioux City joint IT agency; accessInformation 'WCICC-IT - GIS') ArcGIS Online item 'Woodbury County, Iowa - Parcel Data Feature', public hosted feature service, no login, token or fee. Item licenseInfo (read 2026-11-24): 'Public use allowed. If you require this data in an alternative format, please contact us.' No resale, redistribution or mailing-list clause. services.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
