source_id: oh.stark.parcels
state: OH
# Stark County Auditor parcel view (202,797 rows on 2026-11-24; OWNER filled on 202,099):
# owner, owner address, situs, appraised and assessed values, homestead flag. Ohio's statewide
# layer (config/states/oh.yaml) is not installed.
layer_url: https://scgisa.starkcountyohio.gov/arcgis/rest/services/Auditor/StarkCountyParcels/MapServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "151"}
fields:
  parcel_id: PIN         # '10000003'
  owner1: OWNER
  mail_line1: OWNER_ADDR1
  mail_line2: OWNER_ADDR2
  mail_city_state_zip: OWNER_ADDR3   # 'NORTH CANTON OH 44721'
  situs_line1: [SITE_ADDRESS1, SITE_ADDRESS2]
  situs_state: {const: OH}
  land_value: APPRAISED_LAND_VALUE
  bldg_value: APPRAISED_BUILDING_VALUE
  total_value: APPRAISED_TOTAL_VALUE
  assessed_value: ASSESSED_TOTAL_VALUE
  tax_year: TAXYR
  homestead: HOMESTEAD_EXEMPTION
  land_use_code: LAND_USE_CODE
  land_use_desc: LAND_USE_DESCRIPTION
extra_pii: [OWNER_ADDRESS, MAILING_NAME, MAILING_ADDRESS, MAILING_ADDRESS1, MAILING_ADDRESS2,
            MAILING_ADDRESS3, BILLING_ADDRESS1, BILLING_ADDRESS2, BILLING_ADDRESS3,
            BILLING_ADDRESS4, SITE_ADDRESS, PREVIOUS_OWNER, MORTGAGE_COMPANY]
value_basis: "APPRAISED_LAND/BUILDING/TOTAL_VALUE = Auditor appraised (market) value; ASSESSED_TOTAL_VALUE = assessed value, 35% of appraised (Ohio R.C. 5715.01). TAXYR is 2027 on every row on 2026-11-24 (the CAMA roll year as published, mapped as given). HOMESTEAD_EXEMPTION is Yes/No. The owner's address (OWNER_ADDR1-3) is mapped; the tax mailing name/address (MAILING_*) and billing lines are kept out as PII. MOST_RECENT_SALE_* and delinquency fields are not mapped."
terms:
  url: https://scgisa.starkcountyohio.gov/arcgis/rest/services/Auditor/StarkCountyParcels/MapServer/0
  summary: "Stark County (Ohio) GIS ArcGIS Server, folder 'Auditor', public MapServer, no login, token or fee. The service and layer carry no description, copyright or license text (read 2026-11-24); no use restriction found. scgisa.starkcountyohio.gov/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
