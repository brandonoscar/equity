source_id: in.marion.parcels
state: IN
# City of Indianapolis / Marion County MapIndy parcels (347,182 rows on 2026-11-23): owner,
# mailing address, situs and Assessor land/improvement/total assessed values. The statewide
# IGIO layer (config/states/in.yaml) has no owner names.
layer_url: https://gis.indy.gov/server/rest/services/MapIndy/MapIndyProperty/MapServer/10
order_by: OBJECTID
page_size: 1000          # maxRecordCount 1000
min_interval_s: 1.0
county: {constant: "097"}
use_restrictions: [no_commercial_name_address_lists]
fields:
  parcel_id: STATEPARCELNUMBER   # '49-06-10-114-035.000-800'; PARCEL_C is the local number
  owner1: FULLOWNERNAME
  mail_line1: OWNERADDRESS
  mail_line2: OWNERADDRESS2
  mail_city: OWNERCITY
  mail_state: OWNERSTATE
  mail_zip: OWNERZIP
  situs_line1: [STNUMBER, PRE_DIR, STREET_NAME, SUFFIX, SUF_DIR]
  situs_city: CITY
  situs_state: STATE
  situs_zip: ZIPCODE
  land_value: ASSESSORYEAR_LANDTOTAL
  bldg_value: ASSESSORYEAR_IMPTOTAL
  assessed_value: ASSESSORYEAR_TOTALAV
  land_use_code: PROPERTY_SUB_CLASS
  land_use_desc: PROPERTY_SUB_CLASS_DESCRIPTION
extra_pii: [OWNERFOREIGNSTATE, OWNERFOREIGNCOUNTRY]
value_basis: "ASSESSORYEAR_LANDTOTAL / _IMPTOTAL / _TOTALAV = Marion County Assessor gross assessed value (Indiana assesses at 'true tax value', a market-value-in-use standard, 50 IAC 2.4) for the current assessment year; no tax-year field. STATUS is ' ' on most rows (ACTIVE / VACANT on the rest): not filtered."
terms:
  url: https://gis.indy.gov/server/rest/services/MapIndy/MapIndyProperty/MapServer/10
  summary: "City of Indianapolis MapIndy public ArcGIS MapServer, no login, token or fee; the layer carries no copyright or license text (read 2026-11-23). Indiana APRA IC 5-14-3-3(f) limits disclosing lists of names and addresses to commercial entities for commercial purposes (recorded as no_commercial_name_address_lists, as for config/states/in.yaml). gis.indy.gov/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-23
  robots_checked_on: 2026-11-23
  cost_model: free
