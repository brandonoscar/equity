source_id: oh.tuscarawas.parcels
state: OH
# Tuscarawas County (OH) GIS 'Tuscarawas_County_Parcels' ('the current Parcels for Tuscarawas
# County Ohio', joined to the Auditor's records; 60,765 rows on 2026-11-24; Listed_Nam filled on
# 60,055; data last edited 2026-08-07, 2,643 conveyances dated 2026): owner, owner mailing
# address, site street, land use, deed volume/page. Ohio's statewide layer has no owner names.
layer_url: https://services9.arcgis.com/9TS9JAXFNg3gQQuK/arcgis/rest/services/Tuscarawas_County_Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 1000          # maxRecordCount 1000; supportsPagination true
min_interval_s: 1.0
county: {constant: "157"}
fields:
  parcel_id: Parcel_Num  # '01-00005-000' (same as PARCEL_ID)
  owner1: Listed_Nam     # 'MASON JONATHAN P ETAL'; Owner_Cont (owner contact name) repeats it
  # Owner contact address (shapefile-truncated names): street, city, state, ZIP.
  mail_line1: Owner_Co_1
  mail_city: Owner_Co_2
  mail_state: Owner_Co_3
  mail_zip: Owner_Co_4
  situs_line1: Location_A    # 'STATE ROUTE 250'; Location_C (site city) is mostly blank
  situs_state: {const: OH}
  land_use_code: Land_Use_C  # 199
  land_use_desc: Land_Use_N
  deed_book: Deed_Volum
  deed_page: Deed_Page
extra_pii: [Owner_Cont, Taxpayer_C, Taxpayer_1]
value_basis: "Appraised / Appraise_1-3 and Taxable_La / Taxable_Im / Taxable_To are present with Tax_Year 2025, but the shapefile-truncated names carry no aliases saying which is land, improvement or total, so no values or tax_year are mapped and no assessment facts are emitted. Taxpayer_* (tax-bill addressee) and Date_Conve / Considerat are not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=c2417a26236c4f73ae7be468f2ded753
  summary: "Tuscarawas County GIS ArcGIS Online item 'Tuscarawas_County_Parcels' (owner TuscGIS, the county GIS account behind tuscgis.maps.arcgis.com and the 'Tuscarawas County GIS' web experience), public hosted feature service, no login, token or fee; data last edited 2026-08-07. The item has no licenseInfo, accessInformation or description (read 2026-11-24); no use restriction found. services9.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-24
