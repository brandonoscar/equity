  # Assessor account ('R073320'). A parcel drawn as several polygons repeats on several rows.
  parcel_id: Name
  owner1: OWNER
value_basis: "The layer has no value fields (FID, GISAccount, Name, OWNER, PLATTEDLEG, PLATTEDL_1/3/4, eagle_view, LEGAL); no assessment facts are emitted."
