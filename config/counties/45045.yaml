source_id: sc.greenville.parcels
state: SC
layer_url: https://www.gcgis.org/arcgis3/rest/services/GreenvilleNJ/Tax_Parcel_Search_and_Select/MapServer/0
order_by: OBJECTID
page_size: 1000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "045"}
use_restrictions: [no_resale]
fields:
  parcel_id: PIN
  owner1: OWNAM1
  owner2: OWNAM2           # NAMECO (care-of name) is not mapped
  mail_line1: STREET
  mail_city: CITY
  mail_state: STATE
  mail_zip: ZIP5
  total_value: FAIRMKTVAL
  tax_year: {const: 2025}
  deed_book: CUBOOK        # current deed book / page
  deed_page: CUPAGE
value_basis: "FAIRMKTVAL = Real Property Services fair market value. TAXMKTVAL (taxable market value after the Act 388 15% reassessment cap and special-use values) is not mapped; LANDVAL+BLDGVAL in the QueryLayers copy sum to TAXMKTVAL, not FAIRMKTVAL, so land/building are not mapped either. tax_year is the const 2025: the row's TOTTAX is the 2025 bill (219,842 of 244,748 rows paid between 2025-10-01 and 2026-03-01), the Assessment History table ends at TAXYEAR 2024, and sampled TAXMKTVAL is exactly 2024 x 1.15 (2025 reassessment cap). Bump the const when the 2026 bills replace the 2025 ones."
terms:
  url: https://www.gcgis.org/AccessDistribution.html
  summary: "Greenville County SC GIS Division, public tax-parcel search service (GreenvilleNJ/Tax_Parcel_Search_and_Select, used by the county mapping application). Free, no login, 244,748 rows on 2026-11-16 (VERDATE 2026-11-14). No license text on the service. The county also sells the GIS landbase; its Data Release Agreement for purchased data says the data 'shall not be copied, reproduced or used in any form by any party other than Requestor/User ... and shall not be sold or distributed by any party', so no_resale is recorded conservatively."
  checked_on: 2026-11-16
  robots_checked_on: 2026-11-16
  cost_model: free
