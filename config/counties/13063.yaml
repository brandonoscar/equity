source_id: ga.clayton.parcels
state: GA
# Clayton County (GA) Tax Assessor 'Tax Parcels' map service ('Clayton County Parcels Web
# Service'; 92,100 rows on 2026-11-24; OWNERNME filled on 92,099; sales dated through 2026):
# owner name, mailing address, site address, zoning, land use, current deed book/page.
layer_url: https://gis.claytoncountyga.gov/server/rest/services/TaxAssessor/Parcels/MapServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "063"}
fields:
  parcel_id: PARCELID    # '13184A E007' (the space is removed in the normalized id)
  owner1: OWNERNME       # 'BOOTH GARY R AND BOOTH CORY'
  mail_line1: PSTLADDRES
  mail_city: PSTLCITY
  mail_state: PSTLSTATE
  mail_zip: PSTLZIP5
  situs_line1: SITEADDRES
  situs_city: SITECITY
  situs_state: {const: GA}
  situs_zip: SITEZIP5
  land_use_code: LANDUSEC    # '101'
  land_use_desc: LANDUSED    # 'Residential 1 family'
  zoning: ZONE
  deed_book: CURRENTDEEDBOOK
  deed_page: CURRENTDEEDPAGE
value_basis: "APPRVAL (appraised fair market value), ASSESSVAL (40% assessed), PRVAPPRSED / PRVASSEDVA (previous year) and LANDFMV / DWELLINGFMV / BLDGSFMV are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted (as for ga.cobb). SALEDATE / SALEPRICE are not mapped."
terms:
  url: https://gis.claytoncountyga.gov/server/rest/services/TaxAssessor/Parcels/MapServer
  summary: "Clayton County, Georgia public MapServer 'TaxAssessor/Parcels' (service description 'Clayton County Parcels Web Service'; property cards link to publicaccess.claytoncountyga.gov) on gis.claytoncountyga.gov, no login, token or fee. No licence, copyright, resale, redistribution or mailing-list text on the service or layer (read 2026-11-24). gis.claytoncountyga.gov/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
