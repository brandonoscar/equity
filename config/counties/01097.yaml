source_id: al.mobile.parcels
state: AL
# Mobile County Revenue Commission public tax parcels, updated 2026-10-27 (214,092 rows on
# 2026-11-24; Name1 filled on 212,640): owner name and property address. No mailing address
# or values in the layer.
layer_url: https://services8.arcgis.com/HND1NcQt6vgOGn1z/arcgis/rest/services/MCRC_Public_Parcels/FeatureServer/1
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "097"}
fields:
  parcel_id: Parcel_Number   # '0208280000002.000'; ParcelNo is the spaced display form, KeyNum the PPIN
  owner1: Name1
  situs_line1: [PropAddr1, PropAddr2]
  situs_city: PropCity
  situs_state: PropState
  situs_zip: PropZip
extra_pii: [Name2]
value_basis: "The layer has no value or tax-year fields; no assessment facts are emitted. Name2 is mostly a continuation or care-of line ('ATTN: ...', 'C/O ...', 'D/B/A ...'), so it is not mapped as a second owner."
terms:
  url: https://www.arcgis.com/home/item.html?id=07c93ca64bbf4fb8a8d49b7ea80ef067
  summary: "Mobile County Revenue Commission Mapping Department ArcGIS Online item 'Mobile County Alabama Tax Parcels' (owner pellison_revenue), public hosted feature service, no login, token or fee. Item licenseInfo (read 2026-11-24): disclaimer only ('for informational purposes only and is not suitable for legal, engineering, or surveying purposes ... This data is for tax purposes only'); no resale, redistribution or mailing-list clause. services8.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
