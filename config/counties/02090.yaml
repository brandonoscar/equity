layer_url: https://services.arcgis.com/f4rR7WnIfGBdVYFd/arcgis/rest/services/FNSB_Parcels_with_Taxroll_Information/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "090"}
extra_pii: [Owner3]
fields:
  parcel_id: PAN
  owner1: Owner1
  owner2: Owner2
  mail_line1: Mailing_Address
  mail_city_state_zip: CityStateZip
  land_value: Land_Value
  bldg_value: Improvements
  total_value: Total_Value
