value_basis: "Land_Value / Improvements / Total_Value = FNSB Assessing taxroll assessed (full) value for Tax_Year (2026 on sampled rows). Tax_Status (TAXABLE/EXEMPT) and MillRate not mapped. No deed reference (LRM_GEOM_DOC is a geometry-source document, not a deed). Owner3 exists but is not a canonical field; listed as extra PII. CityStateZip is one string like 'CITY ST 99703 0406'."
