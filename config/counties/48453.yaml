source_id: tx.travis.parcels
state: TX
# Travis County (TX) tax maps service 'Parcels' (DBO.Parcels; Travis Central Appraisal District
# parcels with links to the TCAD property search; 373,683 rows on 2026-11-25; py_owner_name
# filled on all but 1,286): owner name and owner mailing street line, land state code.
# tx.statewide.parcels (StratMap, annual) keys the same district property id.
layer_url: https://taxmaps.traviscountytx.gov/arcgis/rest/services/Parcels/MapServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "453"}
fields:
  parcel_id: PROP_ID     # 100008 TCAD property id (geo_id '0100030105' is the map id)
  owner1: py_owner_name
  mail_line1: py_address # the street line only: the layer has no owner city, state or ZIP
  land_use_code: land_state_cd   # Comptroller state property category (e.g. F1 commercial)
  land_use_desc: land_type_desc
value_basis: "market_value is present (appraised_val / assessed_val are null on sampled rows) but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. The situs is not mapped: situs_street holds 'TX' and situs_address puts the street prefix first ('S 1201 LAMAR BLVD   TX 78704') on sampled rows, so the street line cannot be read reliably. deed_num (instrument number of the last deed) is not mapped: the schema's deed fields are book/page."
terms:
  url: https://taxmaps.traviscountytx.gov/arcgis/rest/services/Parcels/MapServer
  summary: "Travis County (TX) tax maps ArcGIS Server (taxmaps.traviscountytx.gov), Parcels MapServer layer 0; public, no login, token or fee. No copyright, licence or use-restriction text on the service, layer or item info (read 2026-11-25). taxmaps.traviscountytx.gov/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
