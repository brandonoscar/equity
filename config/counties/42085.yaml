source_id: pa.mercer.parcels
state: PA
# Mercer County (PA) tax parcels with a combined owner name and a one-string mailing address,
# as republished on PASDA ('Mercer County Tax Parcels 202603'). No value fields.
layer_url: https://mapservices.pasda.psu.edu/server/rest/services/pasda/MercerCounty/MapServer/0
order_by: OBJECTID       # the OID field (alias FID)
page_size: 1000          # maxRecordCount 1000; supportsPagination true
min_interval_s: 1.0
county: {constant: "085"}
fields:
  parcel_id: Parcel_Id     # e.g. "26 075 002 002" (spaces removed by the adapter)
  owner1: Comb_Owner
  # Comb_Own_1 is "STREET   CITY, ST ZIP" (three spaces, one comma), not the two-comma layout
  # the parser needs, so the whole string is kept as the street line (see report).
  mail_full: Comb_Own_1
value_basis: "No value fields in this layer (parcel id, district, control number, acreage, school district, situs description, owner and mailing only)."
terms:
  url: https://mapservices.pasda.psu.edu/server/rest/services/pasda/MercerCounty/MapServer/0
  summary: "Mercer County PA tax parcels ('Boundary outlines of individual properties in Mercer County digitized using hard copy parcel maps'; copyright Mercer County, Pennsylvania) served by PASDA at Penn State. Free REST, no login; 58,006 polygons on 2026-11-16. No license or use-constraint text in the service; the per-dataset PASDA metadata page (www.pasda.psu.edu) could not be read from this environment. No commercial-use or mailing-list restriction found. mapservices.pasda.psu.edu /robots.txt answers 404 (RFC 9309: no rules)."
  checked_on: 2026-11-16
  robots_checked_on: 2026-11-16
  cost_model: free
