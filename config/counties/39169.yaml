source_id: oh.wayne.parcels
state: OH
# Wayne County (OH) Auditor's GIS 'WayneCo Parcels' (parcels joined to the Auditor's property
# records, 'updated weekly'; 57,808 rows on 2026-11-24; PPOwner filled on 57,417; sales dated up
# to 2026-10-23): owner, owner address, site address, class code. Ohio's statewide layer has no
# owner names.
layer_url: https://services6.arcgis.com/WiOy9S7NUTWyXUe4/arcgis/rest/services/WayneCo_Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "169"}
fields:
  parcel_id: Parcel      # '22-00999.000'; Parcel2 is the unpunctuated form
  owner1: PPOwner        # 'HOSTETLER LEVI N & JACOB N'; PPDeeded is the deed form of the same name
  # One string with no commas ('6389 MARTIN RD WEST SALEM OH 44287-9594'): street and city
  # cannot be told apart reliably, so it is kept whole as the street line.
  mail_full: PPOwnerAddress
  situs_full: PPAddress  # same layout ('10711 W EASTON RD WEST SALEM OH 44287'), kept whole
  land_use_code: PPClassCode   # 511
extra_pii: [PPDeeded, PPListed, PPTaxPayer, PPTaxPayerAddress]
value_basis: "PPLandValue / PPImprValue / PPTotalValue are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. PPTaxPayer / PPTaxPayerAddress are the tax-bill addressee, not the owner, so they are not mapped. PPSaleDate / PPAmount are not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=dc3bb013f89c4231ad6ccb9b2c27a10b
  summary: "Wayne County, Ohio - GIS ArcGIS Online org (urlKey WayneCountyGIS; 'The mission of the Wayne County Auditor's Office GIS staff ...') item 'WayneCo Parcels' ('Wayne County Ohio Parcel Data updated weekly'), public hosted feature service, no login, token or fee; data last edited 2026-10-26. The item has no licenseInfo, accessInformation or description (read 2026-11-24); no use restriction found. services6.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
