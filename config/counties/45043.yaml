source_id: sc.georgetown.parcels
state: SC
# Georgetown County (SC) GIS open-data parcel attribute table (PARCELATTRIBUTES; 57,581 rows on
# 2026-11-25, 57,319 with a ParcelID, almost all YearID 2027; Owner1 filled on 57,580; sale
# dates up to 2026-10): owner names, owner billing address, property street address, land use.
# A table (no geometry), keyed by the county parcel number.
layer_url: https://gis1.georgetowncountysc.org/portal/rest/services/GCGIS_OpenData/FeatureServer/7
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "043"}
filter: "ParcelID IS NOT NULL"   # 262 rows carry no parcel number
use_restrictions: [internal_use_only, no_redistribution]
fields:
  parcel_id: ParcelID    # '01-0101-001-00-00'
  owner1: Owner1
  owner2: Owner2         # a co-owner on sampled rows
  mail_line1: BillingAddress
  mail_line2: BillingAddress2
  mail_city: City        # the billing address's city (the table has no site city)
  mail_state: State
  mail_zip: ZipCode
  situs_line1: {join: [StreetNumber, StreetName]}
  situs_state: {const: SC}
  land_use_code: LandUseCode
value_basis: "The table has no value fields, so no assessment facts are emitted. StreetNumber is '0' on 2,363 rows and empty on 8,607 (land without a house number); those site lines are kept as published. A few parcels also carry rows for YearID 2025 or 2026 (142 rows); no year filter is applied, so the layer needs no yearly change."
terms:
  url: https://gis1.georgetowncountysc.org/portal/rest/services/GCGIS_OpenData/FeatureServer
  summary: "Georgetown County (SC) GIS portal, open-data feature service GCGIS_OpenData, table PARCELATTRIBUTES; public, no login, token or fee. Its licence (read 2026-11-24 during the county sweep) allows personal or internal use only and no copying or reproduction: recorded as internal_use_only and no_redistribution (the project keeps the data internal). gis1.georgetowncountysc.org/robots.txt answers HTTP 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
