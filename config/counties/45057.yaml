source_id: sc.lancaster.parcels
state: SC
# Lancaster County (SC) GIS parcels joined to the Assessor's Patriot CAMA (31,436 rows on
# 2026-11-24, 31,291 distinct ParcelID; Owner1 filled on 31,299): owner names and property
# street address.
layer_url: https://services3.arcgis.com/rJcpRneDUBgTeCT3/arcgis/rest/services/SDE_County_Parcels_Patriot_View/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "057"}
fields:
  parcel_id: ParcelID    # '0019-00-009.13' (= PIN)
  owner1: Owner1
  # Owner2 (filled on 9,559 rows) is a co-owner on most sampled rows ('COLEY JOHN W' / 'COLEY
  # RICKY D') but sometimes the rest of a joint name ('CRANDALL CHRISTOPHER L &' / 'JENNIFER R').
  owner2: Owner2
  situs_line1: {join: [StreetNum, StreetName]}
  situs_state: {const: SC}
  land_use_code: LUC
  land_use_desc: LUCDescription
extra_pii: [Owner3, Grantor, PrevGrantor]
value_basis: "TotalLandValue / TotalBuildingBalue / TotalValue are present but the layer has no tax-year field (BaseYear is the reassessment base year, 2018), so no values or tax_year are mapped and no assessment facts are emitted. The owner's billing street (BillingAddress) is empty on every row, so the owner City/State/Zip alone are not mapped as a mailing address."
terms:
  url: https://www.arcgis.com/home/item.html?id=b92310f7dcb044759ca3ad6afcedfb7a
  summary: "Lancaster County GIS (SC) ArcGIS org (urlKey LANCOGIS, item owner lcg-admin_LANCOGIS) item 'County Parcels Patriot View', public hosted feature view, no login, token or fee; data last edited 2026-05-20, item modified 2026-08-14. The item has no licenseInfo (read 2026-11-24); its description lists 'parcel lookup and ownership research' among the use cases; no use restriction found. services3.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
