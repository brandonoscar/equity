# rows checked. AsrLocationBldgNo is situs house number (not mapped).
layer_url: https://services1.arcgis.com/k3vhq11XkBNeeOfM/ArcGIS/rest/services/Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "760"}
fields:
  parcel_id: PIN
  owner1: OwnerName
  mail_line1: MailAddress
  mail_city: MailCity
  mail_state: MailState
  mail_zip: MailZip
  land_value: LandValue
  bldg_value: DwellingValue
  total_value: TotalValue
  tax_year: {const: 2026}
value_basis: "LandValue / DwellingValue / TotalValue = City Assessor of Real Estate assessed values (Virginia assesses at 100% of fair market value, so these are both total and assessed). AssessmentDate is 2026-07-01 on 76,807 of 76,961 rows (fiscal-year roll start; the roll is as of 2026-01-01), so tax_year is the const 2026. Bump when AssessmentDate moves to 2027."
