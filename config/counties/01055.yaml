source_id: al.etowah.parcels
state: AL
# Etowah County (AL) Revenue Commission tax parcels joined to the CAMA roll (KCS-hosted county
# public viewer service; 75,757 rows on 2026-11-25, Owner filled on every row): owner, owner
# mailing address, deed book/page.
layer_url: https://web3.kcsgis.com/kcsgis/rest/services/Etowah/Etowah_Public_ISV/MapServer/91
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "055"}
fields:
  parcel_id: PARCELID   # '0108280000001000'
  owner1: Owner
  mail_line1: MailAdd1
  mail_line2: MailAdd2
  mail_city: MailCity
  mail_state: MailState
  mail_zip: MailZip1
  deed_book: DeedBook   # 'D-18' style on newer instruments (DeedPage then holds the instrument number)
  deed_page: DeedPage
value_basis: "TTV (total appraised value), TAV (assessed value), CLandValue / CImpValue are present, but the only year field is TaxYearDue (2027 on every row on 2026-11-25), which does not say which roll year the values belong to (Alabama lien date is Oct 1), so no values or tax_year are mapped and no assessment facts are emitted (as in al.marshall.parcels). PreviousOwner, TotalTaxDue, MailAdd3 and the site address (SitusAddNumber is 0 on rows with no house number) are not mapped."
terms:
  url: https://web3.kcsgis.com/kcsgis/rest/services/Etowah/Etowah_Public_ISV/MapServer
  summary: "Layer 91 'Parcels' of Etowah County's public interactive viewer service (Etowah/Etowah_Public_ISV), hosted by the county's mapping contractor KCS (web3.kcsgis.com; copyrightText 'KCS'); public, no login, token or fee. No licence, use-constraint or disclaimer text in the service metadata (read 2026-11-25). web3.kcsgis.com/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
