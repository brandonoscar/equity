source_id: al.montgomery.parcels
state: AL
# Montgomery County (AL) tax parcels on the City of Montgomery's GIS server (106,251 rows on
# 2026-11-24; OwnerName filled on 105,495; RecordYear 2026 on every row): owner name, mailing
# address, property address, assessment class, appraised values.
layer_url: https://gis.montgomeryal.gov/server/rest/services/Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "101"}
fields:
  parcel_id: PID         # '1002103001007000'; ParcelNo is the spaced form '10 02 10 3 001 007.000'
  owner1: OwnerName      # 'HALL JOAN & HALL SHANNON' (text fields are blank-padded; the adapter trims)
  mail_line1: MailAddress1
  mail_line2: MailAddress2
  mail_city: MailCity
  mail_state: MailState
  mail_zip: MailZip
  situs_line1: PropertyAddr1
  situs_city: PropertyCity
  situs_state: PropertyState
  situs_zip: PropertyZip
  land_use_code: AssessmentClass   # Alabama assessment class ('2', '3')
  land_value: TotalLandValue
  bldg_value: TotalImpValue
  total_value: TotalValue
  tax_year: RecordYear
extra_pii: [OwnerName2]
value_basis: "TotalLandValue / TotalImpValue / TotalValue are the appraised land, improvement and total values of the record year (RecordYear, 2026 on every row on 2026-11-24). OwnerName2 (filled on 7,887 rows) is almost always a care-of line ('C/O MANZO MANAGEMENT LLC'), so it is not mapped as a second owner. Book1/Page1 are subdivision plat references and InstNbr/InstDate are mostly empty, so no deed fields are mapped."
terms:
  url: https://gis.montgomeryal.gov/portal/home/item.html?id=aae9c6f2a82748e38410a24b7f75a69b
  summary: "City of Montgomery, Alabama ArcGIS Enterprise item 'Parcels' (owner portaladmin), public FeatureServer on gis.montgomeryal.gov, no login, token or fee. The item has no licenseInfo, accessInformation or description and the service none either (read 2026-11-24); no resale, redistribution or mailing-list clause found. gis.montgomeryal.gov/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
