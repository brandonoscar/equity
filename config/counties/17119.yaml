source_id: il.madison.parcels
state: IL
# Madison County (IL) GIS 'County Parcels' layer (136,799 rows on 2026-11-24; OWN_FULL filled on
# 136,330; data last edited 2026-10-23): owner name, owner mailing address, site address.
layer_url: https://services.arcgis.com/Z0kKj2K728ngqqrp/arcgis/rest/services/County_Parcels/FeatureServer/12
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "119"}
fields:
  parcel_id: PIN         # '07-1-11-02-00-000-002'; CO_PIN is the unpunctuated form
  # OWN_FULL is OWN_FIRST + OWN_MID_IN + OWN_LAST + OWN_SUFF in one field ('MATTHEW AND ERIN
  # BLOEMER'); trusts and companies are in OWN_LAST alone.
  owner1: OWN_FULL
  mail_line1: OWN_ADD
  mail_line2: OWN_ADD_2
  mail_city: OWN_CITY
  mail_state: OWN_STATE
  mail_zip: OWN_ZIP
  situs_line1: [NUM, NUM_SUFF, ST_PRE, ST_NAME, ST_TYPE, ST_POST]
  situs_city: CITY
  situs_state: STATE
  situs_zip: ZIP
extra_pii: [OWN_FIRST, OWN_MID_IN, OWN_LAST]
value_basis: "The layer has no value or tax-year fields; no assessment facts are emitted."
terms:
  url: https://www.arcgis.com/home/item.html?id=1bd63878b0194f85862cf55d69759db6
  summary: "Madison County, Illinois GIS ArcGIS Online item 'Madison County Parcels' (owner MadCoGISAdmin; 'parcel boundaries with ownership and site address details', use cases include 'Address and owner lookup'), public hosted feature service, no login, token or fee; item modified 2026-11-05. licenseInfo and accessInformation are empty (read 2026-11-24); no resale, redistribution or mailing-list clause found. services.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
