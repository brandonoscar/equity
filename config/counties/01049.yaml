source_id: al.dekalb.parcels
state: AL
# DeKalb County (AL) Revenue Commission tax parcels joined to the CAMA roll (KCS-hosted county
# map service; 52,861 rows on 2026-11-24, Owner filled on 52,859; 1,104 deeds recorded in 2026):
# owner, owner mailing address, deed book/page.
layer_url: https://al28portal.kcsgis.com/al28server/rest/services/Dekalb_Public_ISV/MapServer/48
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000+; supportsPagination true
min_interval_s: 1.0
county: {constant: "049"}
fields:
  parcel_id: PARCELID   # '0304180000025000'; PARCELNUMBER is the spaced display form
  owner1: Owner
  mail_line1: MailAdd1
  mail_line2: MailAdd2
  mail_city: MailCity
  mail_state: MailState
  mail_zip: MailZip1
  deed_book: DeedBook
  deed_page: DeedPage
extra_pii: [MailAdd3]
value_basis: "TTV (total appraised value), TAV (assessed value), CLandValue / CImpValue are present, but the only year field is TaxYearDue (2026 on 50,681 rows, 2027 on 2,180), which does not say which roll year the values belong to (Alabama lien date is Oct 1), so no values or tax_year are mapped and no assessment facts are emitted. PreviousOwner, TotalTaxDue and DeedRecorded are not mapped. MailAdd3 (a third mailing line, rarely filled) is not mapped. The site address (SitusAddNumber + SitusAddName) is not mapped: SitusAddNumber is 0 on 1,091 rows that have a street name, which would put a false house number on the line (as in md.washington.parcels)."
terms:
  url: https://al28portal.kcsgis.com/al28server/rest/services/Dekalb_Public_ISV/MapServer
  summary: "Layer 48 'Current Parcels' of the Revenue Commission's public interactive viewer service (Dekalb_Public_ISV). DeKalb County (AL) Revenue Commission tax-parcel map service on the county's public ArcGIS Server, hosted by its mapping contractor KCS (al28portal.kcsgis.com; copyrightText 'KCS'; keywords 'Dekalb,Revenue,GIS'), public, no login, token or fee. No license, use-constraint or disclaimer text in the service metadata (read 2026-11-24); no resale, redistribution or mailing-list clause found. al28portal.kcsgis.com/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
