source_id: oh.pickaway.parcels
state: OH
# Pickaway County (OH) GIS parcel search layer linked to the Auditor's CAMA (32,193 rows on
# 2026-11-24, 29,986 distinct PARCELCAMA; OWNER filled on 31,098; PARCELCAMA empty on 1,057,
# which are skipped): owner and owner mailing address. Ohio's statewide layer
# (config/states/oh.yaml) is not installed and has no owner names.
layer_url: https://services6.arcgis.com/FhJ42byMw3LmPYCN/arcgis/rest/services/Parcels_Search/FeatureServer/1
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "129"}
fields:
  parcel_id: PARCELCAMA  # 'K2500030016400', the Auditor's parcel key; PARCELID is the dashed 'K25-0-003-00-164-00'
  owner1: OWNER
  mail_line1: PPOwnerAdd
  mail_city_state_zip: PPOwnerA_2   # 'LAURELVILLE OH 43135'
value_basis: "The layer has no value fields; no assessment facts are emitted. ADDRESS (the site address, '30869 S R 180 OH') ends in the state and has no city or ZIP, so it is not mapped."
