source_id: ga.bibb.parcels
state: GA
# Macon-Bibb County (GA) 'ParcelCAMA_Current_2025' layer on the consolidated government's
# ArcGIS Online org (owner BMarlin_MaconBibb; 71,505 rows on 2026-11-25, last edit 2026-08;
# PARCEL_NO_1 filled on 68,347, LASTNAME on 68,331): parcels joined to the Tax Assessors' CAMA
# table: owner name, owner mailing address, property address, last deed book/page.
layer_url: https://services2.arcgis.com/zPFLSOZ5HzUzzTQb/arcgis/rest/services/ParcelCAMA_Current_2025/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "021"}
fields:
  parcel_id: PARCEL_NO_1   # 'O1300278' (MAP_ROUTE 'O130-0278'); null on parcels without a CAMA match
  owner1: LASTNAME         # the full owner string despite the name: 'MALONE RICHARD M SR'
  mail_line1: ADDRESS1
  mail_line2: ADDRESS2     # ADDRESS3 (blank on sampled rows) is not mapped
  mail_city: CITY
  mail_state: STATE
  mail_zip: ZIP            # '312166379' (ZIP+4 run together; the first five digits are kept)
  situs_line1: SITEADDRESS
  situs_state: {const: GA}
  situs_zip: SITE_ZIP
  deed_ref: DEEDPAGE       # ' 9843  156' = book, page (fixed-width)
  zoning: ZONINGCODE
deed_ref_pattern: '^\s*(?P<book>\d+)\s+(?P<page>\d+)\s*$'
value_basis: "LANDVAL, CURR_VAL, PREV_VAL and FMVRES/FMVCOM/FMVACC are present but the layer states no tax year (CCY/PCY are blank on sampled rows and hold years 2013-2023 elsewhere, meaning unconfirmed), so no values or tax_year are mapped and no assessment facts are emitted. SALEPRICE/SALEDATE (last sale) are not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=0b8a3dedb19b4c3085f0868fcd4e0f38
  summary: "Macon-Bibb County (GA) ArcGIS Online org zPFLSOZ5HzUzzTQb (publishes the county's commission districts, blight and tax-sale layers), item 'ParcelCAMA_Current_2025' ('2025 Parcel CAMA Layer'); public FeatureServer, no login, token or fee. The item's accessInformation and licenseInfo are empty (read 2026-11-25); no use-restriction text found. services2.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
