source_id: ut.utah.parcels
state: UT
# Utah County (Provo) tax parcels from the County's own GIS server (286,164 rows on
# 2026-11-23): owner name on 284,429, owner mailing address, situs, market land/improvement
# values and the assessment year. The statewide LIR layers (config/states/ut*.yaml) carry no
# owners; UGRC's Utah County copy has owner names on only 87k rows.
layer_url: https://maps.utahcounty.gov/arcgis/rest/services/Parcels/Parcel_TaxParcels_Simple_wgs84/MapServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 100000; kept small to be polite
min_interval_s: 1.0
county: {constant: "049"}
fields:
  parcel_id: PARCELID    # '010290009', the same id as the statewide UGRC layers
  owner1: OWNER_NAME
  mail_line1: OWN_STREET_ADDRESS
  mail_city: OWN_CITY
  mail_state: OWN_STATE
  mail_zip: OWN_ZIP5
  situs_line1: [SITE_HOUSE_NUM, SITE_PRE_DIR, SITE_STREET_NAME, SITE_STREET_TYPE,
                SITE_POST_DIR, SITE_STREET_UNIT]
  situs_city: SITE_CITY
  situs_state: SITE_STATE
  situs_zip: SITE_ZIP5
  land_value: MKT_LAND_VALUE
  bldg_value: MKT_IMP_VALUE
  total_value: MKT_CUR_VALUE
  tax_year: ASMT_YEAR
  land_use_desc: PROP_TYPE_DESCR
extra_pii: [CARE_NAME, OWN_FULL_ADDRESS, SITE_FULL_ADDRESS]
value_basis: "MKT_LAND_VALUE / MKT_IMP_VALUE / MKT_CUR_VALUE = County Assessor market values for ASMT_YEAR (2027 on 2026-11-23); Utah taxes primary residences at 55% of market value (Utah Code 59-2-103), so taxable value is lower for homes. MKT_PRV_VAL (prior year) and VESTING_DOC (last vesting document, 'number-year') are not mapped."
terms:
  url: https://maps.utahcounty.gov/arcgis/rest/services/Parcels/Parcel_TaxParcels_Simple_wgs84/MapServer/0
  summary: "Utah County public ArcGIS MapServer, no login, token or fee; the layer carries no copyright or license text (read 2026-11-23). Utah GRAMA (Utah Code 63G-2) is the backdrop. maps.utahcounty.gov/robots.txt answers HTTP 401 (RFC 9309: 4xx = no rules, allowed). The server refused queries for a while on 2026-11-23 (401 without a User-Agent, 'Failed to execute query'); it answered later the same day."
  checked_on: 2026-11-23
  robots_checked_on: 2026-11-23
  cost_model: free
