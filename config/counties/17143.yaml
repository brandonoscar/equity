source_id: il.peoria.parcels
state: IL
# Peoria County (IL) Supervisor of Assessments tax parcels with the assessment roll joined
# (Tax_Parcels on the county's ArcGIS Online org, item 00b0e55fe72d414395418dd76691daf4;
# 90,350 rows on 2026-11-25, owner_name filled on 90,105, 88,688 distinct PINs; layer edited
# 2026-11-14): owner name, owner mailing address, property address, assessed values, CAMA
# characteristics. Multipart rows share a PIN: the lowest OBJECTID wins.
layer_url: https://services.arcgis.com/iPiPjILCMYxPZWTc/arcgis/rest/services/Tax_Parcels/FeatureServer/5
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "143"}
use_restrictions: [internal_use_only, no_redistribution]
fields:
  parcel_id: PIN         # 10-digit PIN, e.g. '1726329017'
  owner1: owner_name
  mail_line1: ADDR1
  mail_line2: ADDR2
  mail_city: OWNCTY
  mail_state: OWNSTE
  mail_zip: OWZIP
  situs_line1: prop_street
  situs_city: CITY
  situs_state: STATE
  situs_zip: PZIP
  land_use_desc: PropClass
value_basis: "land_lot_value / improvements_value / total_assessed_value = Supervisor of Assessments assessed values (Illinois: one third of market value outside Cook County; farm parcels on farmland assessment). The layer names no assessment year, so the values are not mapped (no assessment rows)."
terms:
  url: https://peoriacountygis.hub.arcgis.com/pages/a979f2ceac8d4fffb7ea1e5712f45bd6
  summary: "Peoria County (IL) GIS open data on ArcGIS Online (service Tax_Parcels, public item; no login, token or fee to query). GIS Open Data License Agreement (read 2026-11-25): free of charge for 'not for profit' organizations and individuals; licence to use, reproduce and display for internal purposes only and to create derivative products; the data must be kept confidential and not made available outside the licensee's organization without the County's written consent. Recorded as internal_use_only and no_redistribution (the project keeps the data internal). services.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
