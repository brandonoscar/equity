source_id: or.lane.parcels
state: OR
# Lane County taxlots (Assessment and Taxation, published weekly to RLIDgeo) on the county's
# PlanMaps service (159,187 rows on 2026-11-24; OWNNAME filled on 155,529): owner of the
# primary tax account and owner mailing address. No situs address in this layer.
layer_url: https://lcmaps.lanecounty.org/arcgis/rest/services/PlanMaps/AddressParcel/MapServer/1
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "039"}
fields:
  parcel_id: MAPTAXLOT   # 13-digit map + taxlot ('1501000000100'); ACCTNO is the primary tax account
  owner1: OWNNAME
  mail_line1: ADDR1
  mail_line2: ADDR2
  mail_city: OWNERCITY
  mail_zip: OWNERZIP
  land_use_code: PROPCL
  land_use_desc: PROPCLDES
  zoning: ZONING
extra_pii: [ADDR3]
value_basis: "LANDVAL (primary-account market land value), IMPVAL (market improvement value summed over accounts) and ASSDTOTVAL (assessed value, the lower of maximum assessed value and real market value) are present, but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. OWNERPRVST holds full state names ('Oregon'), not postal codes, so mail_state is not mapped. Owner and address are for the 'primary' tax account only (NUMACCNTS can be >1)."
terms:
  url: https://lcmaps.lanecounty.org/arcgis/rest/services/PlanMaps/AddressParcel/MapServer/1
  summary: "Lane County GIS public ArcGIS MapServer (copyright 'Lane County GIS'; portal item accessInformation 'Lane County GIS'), no login, token or fee. Layer metadata (read 2026-11-24): taxlots maintained by Lane County Department of Assessment and Taxation, published to RLIDgeo weekly; no license, use constraint or resale clause found in the layer, service or portal item. lcmaps.lanecounty.org/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
