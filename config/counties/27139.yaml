source_id: mn.scott.parcels
state: MN
# Scott County, Minnesota ArcGIS Online item 'Parcels' (owner ScottCountyGIS, data last edited
# 2026-11-20): tax boundaries joined to the Assessor's CAMA data by PID. Taxpayer name and
# address, situs, zoning, EMV for the current and next assessment, classification, homestead.
# 62,203 rows on 2026-11-25 (TaxPayerName on 61,930).
layer_url: https://services.arcgis.com/DqIh9WAsIZcPlBEF/arcgis/rest/services/Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "139"}
fields:
  parcel_id: PID          # same key as COUNTY_PIN in mn.statewide.parcels / mn.metro.parcels
  owner1: TaxPayerName    # taxpayer of record; the layer has no separate owner field
  mail_line1: TaxAddress1
  mail_city_state_zip: TaxAddress2   # 'NEW PRAGUE, MN 56071'
  situs_line1: PropertyAddress1
  situs_city: PropertyCity
  situs_zip: PropertyZip
  zoning: Zone
  land_use_desc: Classification
  homestead: HomesteadYesNo   # Y / N
  land_value: EMVLand
  bldg_value: EMVImprove
  total_value: EMVTotal
  tax_year: TaxYear
value_basis: "EMVLand / EMVImprove / EMVTotal = county estimated market value for AssessmentYear (2025 in the rows sampled), the values taxes payable in TaxYear (2026) are based on; tax_year = TaxYear (taxes-payable year, as in mn.statewide.parcels). EMVGreen (Green Acres value) is not mapped. NextAssessmentYear / NextEMV* (2026 assessment, payable 2027; mn.metro.parcels carries TAX_YEAR 2027 for Scott) are not mapped. owner1 is the taxpayer (TaxPayerName), which can differ from the fee owner. LastSaleDate / LastSalePrice and TCV are not mapped."
