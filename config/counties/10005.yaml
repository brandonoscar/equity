source_id: de.sussex.parcels
state: DE
# Sussex County 'Tax Parcel Map with Related Ownership Information Table': the ownership table
# (layer 1, no geometry): owner and second owner, mailing address, appraised land and building,
# land use code. PIN keys to the parcel.
layer_url: https://map.sussexcountyde.gov/trdserver/rest/services/Geographic_Information_Office/Parcels_PIN_With_Assessment_Unit/MapServer/1
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
county: {constant: "005"}
fields:
  parcel_id: PIN
  owner1: FULLNAME
  owner2: Second_Owner_Name
  mail_line1: MAILINGADDRESS
  mail_city: CITY
  mail_state: STATE
  mail_zip: ZIPCODE
  land_use_code: LUC
  deed_book: BOOK
  deed_page: PAGE
value_basis: "APRLAND/APRBLDG are appraised values, but the table has no tax-year field, so no tax_year is mapped and no assessment facts are emitted."
terms:
  url: https://www.arcgis.com/home/item.html?id=319259eb04d24a9ca7947ec6d3718de1
  summary: "Sussex County Government ownership table, 208,124 rows on 2026-11-23, on Delaware FirstMap ('Delaware Sussex County Parcels With Ownership'). licenseInfo: 'The State of Delaware makes no warranty or representation ... All such data ... (the FirstMap Data) are provided as is and users are fully and solely responsible for any consequences of use. No use restriction is stated.'"
  checked_on: 2026-11-23
  robots_checked_on: 2026-11-23
  cost_model: free
