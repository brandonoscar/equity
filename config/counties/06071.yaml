value_basis: "NO OWNER NAMES: OwnerName is 'Protected Per CA Gov Code 7928.205' on every row, so it is not mapped. LandValue / ImprovementValue = secured roll values (Prop 13 factored base-year value, i.e. the assessed full value), as text with thousands separators. ExemptionValue and PersonalPropertyValue are not mapped. tax_year is the const 2026: the 2026-27 roll (lien date 2026-01-01), since the layer was last edited 2026-11-13. Bump the const when the 2027-28 roll is published (July). BaseYear is the Prop 13 base year, not the roll year."
