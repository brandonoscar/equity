state: CO
# Chaffee County, Colorado GIS item 'CHAFFEE_PARCELS_20260803' (Public Works org, data last
# edited 2026-08-13): parcel polygons joined to the Assessor's account table. Owner names
# (NAME1/NAME2), owner mailing address and situs street parts; no value fields.
# 18,403 rows on 2026-11-25 (1,289 polygons have no assessor join: blank PARCELNO, skipped).
layer_url: https://services8.arcgis.com/fRzYA77NIM7odeAM/arcgis/rest/services/CHAFFEE_PARCELS_20260803/FeatureServer/0
order_by: FID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "015"}
fields:
  parcel_id: PARCELNO     # 12-digit assessor parcel number (ACCOUNTNO = 'R' + the same digits)
  owner1: NAME1
  owner2: NAME2
  mail_line1: ADDRESS1
  mail_line2: ADDRESS2
  mail_city: CITY
  mail_state: STATECODE
  mail_zip: ZIPCODE       # 9 digits without a dash ('812368720'); the first 5 are kept
  # Situs street parts; PROPERTYCI is not mapped: it holds 'UNINCORPORATED' for rural parcels,
  # not a postal city.
  situs_line1: [STREETNO, PREDIRECTI, STREETNAME, STREETTYPE, UNITTYPE, UNITNAME]
  land_use_desc: ACCTTYPE # assessor account type ('Residential', 'Agricultural', 'Exempt', ...)
value_basis: "No value fields in this layer (account type, tax district, acreage, owner, mailing and situs only). The ADDRESS field (street plus PROPERTYCI) and BUSINESSNA (business name at the situs) are not mapped."
use_restrictions: [no_redistribution, no_resale]
