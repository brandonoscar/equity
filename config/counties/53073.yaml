source_id: wa.whatcom.parcels
state: WA
# Whatcom County (WA) Assessor 'Public Tax Parcels' (EnterprisePublishing/WhatcomCo_Property
# layer 1; 111,241 rows on 2026-11-24; title_owner_name filled on 110,868): title owner and
# owner address, taxpayer, site address, zoning, use code. Washington's statewide layer is not
# installed. Condominium and undivided-interest accounts overlap on the same footprint.
layer_url: https://wcgis.whatcomcounty.us/arcgis/rest/services/EnterprisePublishing/WhatcomCo_Property/MapServer/1
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county: {constant: "073"}
use_restrictions: [no_commercial_name_address_lists]
fields:
  parcel_id: geo_id      # '3703220494380000'; prop_id is the Assessor's account number
  owner1: title_owner_name
  mail_line1: title_owner_line1
  mail_line2: title_owner_line2
  mail_city: title_owner_city
  mail_state: title_owner_state
  mail_zip: title_owner_zip
  situs_line1: [situs_num, situs_street_prefix, situs_street, situs_unit]
  situs_city: situs_city
  situs_state: situs_state
  land_use_code: property_use_cd         # '9110'
  land_use_desc: property_use_description  # 'RESIDENTIAL'
  zoning: zoning
extra_pii: [title_owner_line3, tax_payer_name, tax_payer_line1, tax_payer_line2, tax_payer_line3]
value_basis: "market_land_val / market_improvement_val / market, appraised_* and taxable_val_total are present but the layer has no tax-year field, so no values or tax_year are mapped and no assessment facts are emitted. tax_payer_* (the tax-bill addressee, usually the same as the title owner) and title_owner_line3 are not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=bcedc96bda2b4abd93886d090d169def
  summary: "Whatcom County GIS ArcGIS Online item 'Tax Parcels' (owner WhatcomGIS; accessInformation 'Whatcom County'; 'real property accounts maintained for assessment by Whatcom County, WA Assessor's Office'), public MapServer on the county's own wcgis.whatcomcounty.us (copyrightText 'Whatcom County'; service published 2025-03-03 from the county's enterprise geodatabase), no login, token or fee. Item licenseInfo (read 2026-11-24): use implies agreement to a no-warranty / hold-harmless statement; no resale or redistribution clause. Washington's Public Records Act, RCW 42.56.070(8)/(9), bars agencies from providing lists of individuals for commercial purposes (recorded as no_commercial_name_address_lists, as for the other Washington counties). wcgis.whatcomcounty.us/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
