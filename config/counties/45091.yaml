source_id: sc.york.parcels
state: SC
# York County SC parcels (134,525 rows on 2026-11-23): owners, mailing address, situs,
# appraised/taxable/assessed values, homestead, last transfer book/page and sale.
layer_url: https://services1.arcgis.com/2AGLxyiJoNiVHKwq/arcgis/rest/services/Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000
min_interval_s: 1.0
county: {constant: "091"}
fields:
  parcel_id: ParcelID
  owner1: Owner1
  owner2: Owner2
  mail_line1: MailAddr1
  mail_line2: MailAddr2
  mail_city: MailCity
  mail_state: MailState
  mail_zip: MailZip
  situs_line1: PropertyAddress
  situs_state: {const: SC}
  land_value: AprLandVal
  bldg_value: AprBldgVal
  total_value: AprTotVal
  assessed_value: AsdTotVal
  deed_book: TransferBook
  deed_page: TransferPage
  homestead: HOMESTEAD
  land_use_code: LandUse
  land_use_desc: LandUseDesc
extra_pii: [Owner3, PreviousOwner, MailApt]
value_basis: "AprLandVal / AprBldgVal / AprTotVal = appraised (market) values; TaxTotVal = taxable value after the 15% assessable transfer cap and ag credit; AsdTotVal = assessed value (4% owner-occupied legal residence, 6% other, S.C. Code 12-43-220). HOMESTEAD Y on 80,611 rows, blank on the rest (unknown, not False). TransferBook/TransferPage = recorder book/page of the last transfer."
terms:
  url: https://www.arcgis.com/home/item.html?id=c27c00901daa4f0484c47a3719a8f03b
  summary: "Public hosted feature service owned by yorkcountysc_gisonline, no login, token or fee. licenseInfo (read 2026-11-23): York County and its mapping contractors disclaim warranty; 'THIS MAP IS NOT A LEGAL SURVEY'; no use restriction. services1.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-23
  robots_checked_on: 2026-11-23
  cost_model: free
