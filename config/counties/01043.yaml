source_id: al.cullman.parcels
state: AL
# Cullman County (AL) Revenue Commission tax parcels joined to the CAMA roll (KCS-hosted county
# map service; 61,824 rows on 2026-11-24, Owner filled on 61,824; 2,984 deeds recorded June-November 2026):
# owner, owner mailing address, deed book/page.
layer_url: https://al25portal.kcsgis.com/al25server/rest/services/Mapping/Cullman_Parcels/MapServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000+; supportsPagination true
min_interval_s: 1.0
county: {constant: "043"}
fields:
  parcel_id: PARCELID   # '0207360001049000'
  owner1: Owner
  mail_line1: MailAdd1
  mail_line2: MailAdd2
  mail_city: MailCity
  mail_state: MailState
  mail_zip: MailZip1
  deed_book: DeedBook
  deed_page: DeedPage
extra_pii: [MailAdd3]
value_basis: "TTV (total appraised value), TAV (assessed value), CLandValue / CImpValue are present, but the only year field is TaxYearDue (2027 on 60,888 rows, 2028 on 936), which does not say which roll year the values belong to (Alabama lien date is Oct 1), so no values or tax_year are mapped and no assessment facts are emitted. PreviousOwner, TotalTaxDue and DeedRecorded are not mapped. MailAdd3 (a third mailing line, rarely filled) is not mapped. The site address (SitusAddNumber + SitusAddName) is not mapped: SitusAddNumber is 0 on 13,233 rows that have a street name, which would put a false house number on the line (as in md.washington.parcels)."
terms:
  url: https://al25portal.kcsgis.com/al25server/rest/services/Mapping/Cullman_Parcels/MapServer
  summary: "Cullman County (AL) Revenue Commission tax-parcel map service on the county's public ArcGIS Server, hosted by its mapping contractor KCS (al25portal.kcsgis.com; copyrightText 'KCS'; keywords 'Cullman,Alabama,Revenue,GIS,Parcels'), public, no login, token or fee. No license, use-constraint or disclaimer text in the service metadata (read 2026-11-24); no resale, redistribution or mailing-list clause found. al25portal.kcsgis.com/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
