source_id: wa.snohomish.parcels
state: WA
# Snohomish County (WA) GIS 'Parcels' layer, assessment-roll attributes (320,156 rows on
# 2026-11-24 incl. retired history; STATUS 'A' = active with TAX_YEAR '2026', 'H' = history with
# TAX_YEAR 'PAST'; only active rows are read; OWNERNAME filled on 314,489): owner name and owner
# address, situs address, use code, market values. Condo units and mobile homes are stacked
# polygons with their own PARCEL_ID.
layer_url: https://services6.arcgis.com/z6WYi9VRHfgwgtyW/arcgis/rest/services/Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
filter: "STATUS = 'A'"
county: {constant: "061"}
use_restrictions: [no_commercial_name_address_lists]
fields:
  parcel_id: PARCEL_ID   # '00370100000004'
  owner1: OWNERNAME      # all owners on one line ('JEYAPAULRAJ JERINSH/NANDA PRIYANKA')
  mail_line1: OWNERLINE1
  mail_line2: OWNERLINE2  # second line ('PMB 10593', 'ELM-77'); OWNERLINE3 is not mapped
  mail_city: OWNERCITY
  mail_state: OWNERSTATE
  mail_zip: OWNERZIP
  situs_line1: SITUSLINE1   # 'UNKNOWN UNKNOWN' on parcels without a site address (kept as given)
  situs_city: SITUSCITY
  situs_state: SITUSSTATE
  situs_zip: SITUSZIP
  land_use_desc: USECODE    # '116 Common Wall Single Family Residence -Real' (code + description)
  land_value: MKLND
  bldg_value: MKIMP
  total_value: MKTTL
  tax_year: TAX_YEAR
extra_pii: [OWNERLINE3]
value_basis: "MKLND / MKIMP / MKTTL are the Assessor's market land, improvement and total values (Washington assesses at 100% of true and fair value, RCW 84.40.030). TAX_YEAR ('2026' on every active row on 2026-11-24) is mapped as tax_year; the layer does not say whether it is the assessment or the taxes-payable year. CULND / CUIMP (current-use values) and TVR (taxable value) are not mapped. TAXPR* (the taxpayer who receives the bill) is not mapped."
terms:
  url: https://www.arcgis.com/home/item.html?id=a69c4dc383114f4a8a30b8d4cccf7823
  summary: "Snohomish County GIS (SnocoGIS) open-data item 'Parcels', public hosted feature service, no login, token or fee; item modified 2026-11-24. licenseInfo 'Terms of Use and Data Disclaimer' (read 2026-11-24): illustrative only, no warranty, hold-harmless; and 'Washington State Law, RCW 42.56.070(8) prohibits state and local agencies from providing access to lists of individuals intended for use for commercial purposes ... By proceeding and accessing this data, you agree and represent that you will not use any lists of individuals, or data from which such lists may be compiled, for any commercial purpose' (recorded as no_commercial_name_address_lists). No redistribution ban. services6.arcgis.com/robots.txt answers HTTP 403 (RFC 9309: 4xx = no rules, allowed)."
  checked_on: 2026-11-24
  robots_checked_on: 2026-11-24
  cost_model: free
