source_id: al.baldwin.parcels
state: AL
# Baldwin County (AL) parcels joined to the Revenue Commission roll, as published for the
# county's permitting system (KCS-hosted feature service Baldwin/Permitting_FS; 183,943 rows on
# 2026-11-25, uploaded 2026-11; PID and Name on every row): owner name, owner mailing
# address, property address.
layer_url: https://web5.kcsgis.com/kcsgis/rest/services/Baldwin/Permitting_FS/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 150000; supportsPagination true
min_interval_s: 1.0
county: {constant: "003"}
fields:
  parcel_id: PID         # '05-43-09-29-2-000-019.000'
  owner1: Name           # all owners in one string: 'SMITH JOHN AND SMITH JANE'
  mail_line1: Address1
  mail_line2: Address2   # Address3 (blank on sampled rows) is not mapped
  mail_city: City
  mail_state: State
  mail_zip: Zip1
  situs_line1: ADDRESS   # '707 ADAMS AVE' (the E-911 address; no site city or ZIP)
  situs_state: {const: AL}
  zoning: ZoningDist     # 'N / A' outside county zoning districts
value_basis: "TotTrueVal (appraised) and TotAssVal (assessed) are present but the layer has no roll-year field (UseYear is the current-use year), so no values or tax_year are mapped and no assessment facts are emitted. HomesteadY, PreviousOw and the legal description are not mapped."
terms:
  url: https://web5.kcsgis.com/kcsgis/rest/services/Baldwin/Permitting_FS/FeatureServer
  summary: "Baldwin County (AL) parcel feature service for permitting (Baldwin/Permitting_FS, layer AL05_Parcels_Permitting), hosted by the county's mapping contractor KCS (web5.kcsgis.com); public, no login, token or fee. No copyright, licence or use-restriction text on the service or its item info (read 2026-11-25). web5.kcsgis.com/robots.txt answers 404 (no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
