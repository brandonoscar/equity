  summary: "FJC Integrated Database, Civil Cases Cumulative File: compiled by the Federal Judicial Center (a US government agency) from case data the district courts report to the AO, published free with no login; a US government work in the public domain (17 U.S.C. 105). fjc.gov/robots.txt disallows /research/idb/ and /sites/default/files/idb (Crawl-delay 30), so the file is downloaded by hand and read locally. FJC notes AMTREC is not a mandatory field and 9999 may mean over $1 million or a filler."
