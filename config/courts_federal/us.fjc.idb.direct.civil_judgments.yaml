# Federal Judicial Center Integrated Database (IDB), civil cases, taken straight from the FJC:
# the "Civil Cases Cumulative File" tab-delimited text file (cases terminated SY 1988 through
# the latest quarter, and cases pending). Read by src/equity/adapters/federal/fjc_idb_direct.py.
#
# The file is cv88on.zip (one member, cv88on.txt): 329,665,474 bytes zipped, 2,009,227,701
# bytes of text, 10,960,173 records, Last-Modified 2026-08-26, "cases terminated in SY 1988
# through June 30, 2026". FJC updates it quarterly. Tab-delimited, CRLF, a header line of the
# codebook's short names (CIRCUIT, DISTRICT, OFFICE, DOCKET, FILEDATE, PLT, DEF, TERMDATE, NOJ,
# AMTREC, JUDGMENT, ...), dates as MM/DD/YYYY, -8 for missing. 638 lines have 47 or 48 fields
# instead of 46 (a tab inside a name) and are skipped.
#
# MANUAL source. fjc.gov/robots.txt (read 2026-11-23) says "Disallow: /research/idb/" and
# "Disallow: /sites/default/files/idb", which is where the IDB files live, so the adapter never
# fetches them. A person downloads the file in a browser from download_page (Civil Data ->
# "Civil Cases Cumulative File" -> Text) and puts it at manual_path; the adapter reads it.
# TODO(Brandon): the copy behind the 2026-11-23 lake build was fetched once with curl during
# development, not by a person in a browser; replace it with a browser download (or ask
# IDBonline@fjc.gov for permission to script the quarterly file) before the next refresh.
#
# The codebook is "Civil Codebook 1988 Forward 10252023.pdf" on download_page. Filters, amount
# units and the 9999 floor are the same as the CourtListener source and are read from
# config/courts_federal/us.fjc.idb.civil_judgments.yaml (for_plaintiff, money, amount_unit,
# amount_floor_code): JUDGMENT 1, NOJ 1 or 2, AMTREC > 0, a TERMDATE that parses.
# 430,832 records pass in the June 30, 2026 file (29,514 of them AMTREC 9999), terminated
# 1984-2026; 3,391 to 3,864 a year in 2023-2025, which CourtListener's copy lacks.
#
# Dedupe with CourtListener (us.fjc.idb.civil_judgments): both sources are the same IDB, so a
# record is identified by district + office + docket + filing date (dedupe_key). The FJC file
# wins: the CourtListener adapter drops every kept row whose key is among this file's kept
# rows. In the 2026-09-30 CourtListener snapshot that is 412,253 of 412,266 keys; 13 remain.
source_id: us.fjc.idb.direct.civil_judgments
download_page: https://www.fjc.gov/research/idb/civil-cases-filed-terminated-and-pending-sy-1988-present
file_url: https://www.fjc.gov/sites/default/files/idb/textfiles/cv88on.zip
manual_path: data/manual/us.fjc.idb.direct/cv88on.zip
member: cv88on.txt
# Lake partitions: one per year of TERMDATE. Earliest kept termination in the 2026-06-30 file:
# 1984 (cases pending at the start of SY 1988).
first_year: 1984
# DISTRICT code (codebook "DISTRICT", Volume XI Appendix A) -> PACER court id, the same ids
# CourtListener uses in district_id. Checked against CourtListener: the 412,253 shared keys
# match under this table for every district.
