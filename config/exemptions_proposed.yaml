# PROPOSED execution (homestead) exemptions per state, from research (2026-11-26), NOT
# confirmed. They protect a debtor's home equity from a judgment creditor outside bankruptcy.
# Nothing in code reads this file yet: once the owner confirms a state, a confirmed table and
# an owner-occupancy rule let equity subtract the exempt amount (reports/Judgment equity data
# and tasks.md, task 9).
#
# kind: capped (cap_usd is the single-owner amount), unlimited (no dollar cap; acreage limits
#   only), none (no homestead against judgment creditors), formula_or_conflict (a county
#   median formula, or sources disagree: read homestead_vs_judgment_creditor).
# declaration_required: true where a recorded declaration is needed for protection (all or
#   part), false when automatic, null when not stated. Most "false" values are UNVERIFIED.
# tenancy_by_entirety: what a creditor of one spouse can do (Shield / Partial / None).
# Sources: NCLC 'No Fresh Start' 2025 (Table 2, state summaries Jan 2026) with 2026 changes from
# statute text and the Alper Law charts; research_notes/Judgment equity data and tasks/
# exemptions_imminent_sales.md. Federal bankruptcy amounts (11 USC 522(d), cases filed
# 2025-04-01 to 2028-03-31): homestead $31,575 (d)(1); wildcard $1,675 + up to $15,800 unused
# (d)(5) (Federal Register 2025-02207).

