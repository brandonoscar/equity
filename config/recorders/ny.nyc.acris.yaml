# NYC ACRIS (City Register) document codes -> normalized instrument fields.
# Generated from the live Document Control Codes table (data.cityofnewyork.us 7isb-wh4c,
# 126 rows, fetched 2026-11-16). `parties` are ACRIS's party1/2/3 labels for the code; a
# party row's role is label_roles[label]. Codes not listed map to OTHER with no reference.
#
# TODO(Brandon): every doc_type and ref_type below is a classification call. In particular:
#  - JUDG is mapped to COURT_ORDER: ACRIS judgments are title judgments (partition, quiet
#    title, foreclosure). NY money judgments are docketed with the County Clerk (CPLR 5018),
#    not recorded in ACRIS.
#  - TLS (tax lien sale certificate) is OTHER for now; the lien sale list is loaded separately.
#  - FTL (federal lien, other) and LOCC (condo common charges) are STATUTORY_LIEN.
#  - WFL (withdrawal of federal tax lien notice) is treated as a release.
#  - TODD (transfer-on-death deed) is OTHER: it moves nothing until death.
#  - document_amt 0 is read as 'amount not stated' (zero_amount_is_unknown).
zero_amount_is_unknown: true
boroughs:  # ACRIS borough -> county FIPS and NYS SWIS (from the NYS tax parcel layer)
  '1': {county_fips: '36061', swis: '620100'}  # Manhattan
  '2': {county_fips: '36005', swis: '600100'}  # Bronx
  '3': {county_fips: '36047', swis: '610100'}  # Brooklyn
  '4': {county_fips: '36081', swis: '630100'}  # Queens
  '5': {county_fips: '36085', swis: '640100'}  # Staten Island (rare: Richmond keeps its own)
# Pre-2003 document ids, fetched in three-character prefix ranges (FT_100 ... FT_499).
legacy_prefixes: [FT_1, FT_2, FT_3, FT_4, BK_6, BK_7, BK_8]
