# Why a state has no adapter, or what its adapters lack. Shown in docs/coverage.md.
AK: "No statewide layer. Borough-by-borough (Anchorage, Mat-Su, Fairbanks, Kenai): to do."
AZ: "ADWR per-county layers carry OWNER_NAME but their use terms (azwater.gov) are unread; Maricopa/Pima county layers: to do."
CA: "No statewide layer; CA counties publish values but redact owner names. More counties: to do."
IA: "No statewide layer. County-by-county (Polk, Linn, Scott): to do."
IN: "Owners, mailing addresses and certified AV for all 92 counties from the DLGF PARCEL files (Indiana Gateway download, in.dlgf.parcels), keyed on the same dashed state parcel number as the IGIO boundary layer; IC 5-14-3-3(f) limits commercial name/address lists."
KS: "No statewide layer (ORKA is a lookup site). County-by-county (Johnson, Sedgwick, Wyandotte): to do."
KY: "Statewide layer held for state agencies only; Louisville free layers lack owner/values. County-by-county: to do."
MD: "Free statewide layer (geodata.md.gov) in emergency maintenance during build; mirror mdgeodata.md.gov: to do."
MO: "No statewide layer. County by county: St. Louis County, Jackson, Jefferson, St. Charles, Greene layers and St. Louis City's yearly Assessor CSV (mo.st_louis_city.parcels); the rest: to do."
MT: "Statewide cadastral exists but robots.txt disallows /arcgis/*. Needs Montana State Library permission."
NJ: "Owner names redacted at source (Daniel's Law); values only; tax year unconfirmed."
NM: "Statewide parcel services require a token. County-by-county: to do."
NV: "State copy not redistributable (NRS 250). Clark/Washoe counties: to do."
OK: "No statewide layer. County-by-county (Oklahoma, Tulsa): to do."
OR: "Statewide program in progress. County-by-county (Multnomah, Washington, Lane): to do."
RI: "No statewide layer; RIDEM/RIGIS tax parcels host not yet reachable: to do."
SD: "No statewide layer. County-by-county (Minnehaha, Pennington): to do."
TN: "Statewide layer has values but no owners; owner layers require a token."
TX: "TxGIO StratMap 2026 county zips, read from the public S3 copy (approved 2026-11-18): the official download host blocks non-browser clients. Navarro's StratMap zip has no PROP_ID, so its owners come from the Navarro CAD certified-roll CSV (tx.navarro.parcels)."
VA: "Statewide VGIN layer: robots.txt disallows /arcgis/ (and it has no owners). Mirrors / county layers: to do."
WA: "Public statewide layer has values but no owner names."
