# Why a state has no adapter, or what its adapters lack. Shown in docs/coverage.md.
AK: "No statewide layer. Boroughs: Anchorage, Mat-Su (internal use only), Fairbanks, Kenai, Juneau. Ketchikan's public layer has shifted columns: to do."
AR: "State CAMP layer has no owner mailing address; the Pulaski county layer adds it. Benton's server resets connections (robots.txt unreachable): to do."
AZ: "ADWR per-county layers carry OWNER_NAME but their use terms (azwater.gov) are unread; Maricopa/Pima county layers: to do."
CA: "No statewide layer; CA counties publish values but redact owner names. More counties: to do."
IA: "No statewide layer. Polk (largest) publishes only HTML search forms. More counties: to do."
IN: "Statewide layer is boundaries only; owner/value in DLGF tables; IC 5-14-3-3(f) limits commercial name/address lists."
KS: "No statewide layer (ORKA is a lookup site). Johnson owner data needs a KORA form or subscription; Sedgwick's public parcel layer has no owners. K.S.A. 45-230 bars selling from name/address lists."
KY: "Statewide layer held for state agencies only; Louisville (LOJIC) and Lexington free layers lack owners. More counties: to do."
LA: "No statewide layer. Jefferson Parish's public parcel layer has no owners; St. Tammany's server resets connections; Caddo, Calcasieu: no public owner layer found."
MD: "Free statewide layer (geodata.md.gov) in emergency maintenance during build; mirror mdgeodata.md.gov: to do."
MO: "No statewide layer. St. Louis City's parcel server answers robots.txt with HTTP 500 (treated as disallow); Boone and Clay: no public owner layer found. More counties: to do."
MT: "Statewide cadastral exists but robots.txt disallows /arcgis/*. Needs Montana State Library permission."
NJ: "Owner names redacted at source (Daniel's Law); values only; tax year unconfirmed."
NM: "Statewide parcel services require a token. Santa Fe County's server disallows all crawling in robots.txt. More counties: to do."
NV: "State copy not redistributable (NRS 250). Clark comes from the City of Las Vegas copy of the assessor roll (Las Vegas Valley only, no Henderson; internal use only)."
OK: "No statewide layer. Cleveland, Comanche: no public owner layer found."
OR: "Statewide program in progress. County-by-county (Multnomah, Washington, Lane): to do."
RI: "No statewide layer; RIDEM/RIGIS tax parcels host not yet reachable: to do."
SD: "No statewide layer. Brown, Brookings: no public owner layer found."
TN: "Statewide land-use layer has values but no owners. The Comptroller's 'Public Use' owner layer (86 counties) says it is not for commercial use: not used. Shelby and Knox owner services need a token or refuse access; Williamson covers Franklin's service area only."
TX: "TxGIO StratMap 2026 county zips, read from the public S3 copy (approved 2026-11-18): the official download host blocks non-browser clients."
VA: "Statewide VGIN layer: robots.txt disallows /arcgis/ (and it has no owners). Mirrors / county layers: to do."
WA: "Public statewide layer has values but no owner names."
