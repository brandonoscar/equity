# Why a state has no adapter, or what its adapters lack. Shown in docs/coverage.md.
AK: "No statewide layer. Boroughs: Anchorage, Mat-Su (internal use only), Fairbanks, Kenai, Juneau. Ketchikan's public layer has shifted columns: to do."
AR: "State CAMP layer has no owner mailing address; the Pulaski county layer adds it. Benton's server resets connections (robots.txt unreachable): to do."
AZ: "ADWR per-county layers carry OWNER_NAME but their use terms (azwater.gov) are unread; Maricopa/Pima county layers: to do."
CA: "No statewide layer; CA counties publish values but redact owner names. Checked 2026-11-25 (Shasta, Butte, Humboldt, Mendocino, Placer, Tulare, Kern, Stanislaus, Merced, El Dorado, Lassen): no county-published owner layer, only third-party copies or subsets."
IA: "No statewide layer. Polk (largest) publishes only HTML search forms. More counties: to do."
IN: "Owners, mailing addresses and certified AV for all 92 counties from the DLGF PARCEL files (Indiana Gateway download, in.dlgf.parcels), keyed on the same dashed state parcel number as the IGIO boundary layer; IC 5-14-3-3(f) limits commercial name/address lists."
KS: "No statewide layer (ORKA is a lookup site). Johnson owner data needs a KORA form or subscription; Sedgwick's public parcel layer has no owners. K.S.A. 45-230 bars selling from name/address lists."
KY: "Statewide layer held for state agencies only; Louisville (LOJIC) and Lexington free layers lack owners. More counties: to do."
LA: "No statewide layer. Jefferson Parish's public parcel layer has no owners; St. Tammany's server resets connections; Caddo, Calcasieu: no public owner layer found."
MD: "Free statewide layer (geodata.md.gov) in emergency maintenance during build; mirror mdgeodata.md.gov: to do."
MO: "No statewide layer. County by county: St. Louis County, Jackson, Jefferson, St. Charles, Greene layers and St. Louis City's yearly Assessor CSV (mo.st_louis_city.parcels); the rest: to do. St. Louis City's parcel server answers robots.txt with HTTP 500; Boone and Clay: no public owner layer found."
MT: "Statewide cadastral exists but robots.txt disallows /arcgis/*. Needs Montana State Library permission."
NJ: "Owner names redacted at source (Daniel's Law); values only; tax year unconfirmed."
NM: "Statewide parcel services require a token. Santa Fe County's server disallows all crawling in robots.txt. More counties: to do."
NV: "State copy not redistributable (NRS 250). Clark comes from the City of Las Vegas copy of the assessor roll (Las Vegas Valley only, no Henderson; internal use only)."
OH: "Statewide public view withholds owner names (a placeholder) and values: county by county."
OK: "No statewide layer. Cleveland, Comanche: no public owner layer found."
OR: "Statewide program in progress. County by county; Washington and Clackamas owner names are only in the paid Metro RLIS data."
RI: "No statewide layer; RIDEM/RIGIS tax parcels host not yet reachable: to do."
SD: "No statewide layer. Brown, Brookings: no public owner layer found."
TN: "Statewide land-use layer has values but no owners; owner names come from the Comptroller's 'Public Use' layer (tn.owners.parcels, 86 counties; its description says it is intended for state agencies with approved access; loaded for internal use on the owner's decision, 2026-11-25). Shelby and Knox owner services need a token or refuse access; Williamson covers Franklin's service area only."
TX: "TxGIO StratMap 2026 county zips, read from the public S3 copy (approved 2026-11-18): the official download host blocks non-browser clients. Navarro's StratMap zip has no PROP_ID, so its owners come from the Navarro CAD certified-roll CSV (tx.navarro.parcels)."
VA: "Statewide VGIN layer: robots.txt disallows /arcgis/ (and it has no owners). County by county; Fairfax, Arlington, Chesapeake, Hampton and Poquoson publish no owner names."
WA: "Public statewide layer has values but no owner names. County layers carry them; King, Pierce and Clark publish none."
