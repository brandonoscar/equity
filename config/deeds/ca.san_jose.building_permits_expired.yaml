source_id: ca.san_jose.building_permits_expired
state: CA
county_fips: "06085"
# City of San Jose Planning, Building and Code Enforcement "Expired Building Permits" (data.sanjoseca.gov
# CKAN dataset expired-building-permits, one CSV of 25.7 MB, 76,437 permits, owner named on 74,858 on 2026-11-25, CC0): permits that expired before final inspection, with
# the folder (permit) number and type, work and sub-type description, approvals, issue and
# final dates, dwelling units, valuation, square feet, the Santa Clara County APN, and the
# applicant, owner and contractor names. OTHER instruments on 06085-<APN> (the 8-digit APN
# of ca.san_jose.parcels), with owner, applicant and contractor as 'other' parties, in no
# match run. Santa Clara County publishes no owner names: this names the owner at permit time.
# The file is read whole from the dataset's download link (a redirect to a presigned S3 URL):
# data.sanjoseca.gov/robots.txt disallows /api/ and /datastore/, not /dataset/.
# Lives in config/deeds only for the M/D/YYYY h:mm:ss AM date (DeedAdapter date_format).
api: csv
url: https://data.sanjoseca.gov/dataset/3b40d486-bd19-44c5-b854-5f0638c2afc3/resource/df4b8461-0c7a-4d16-b85d-ff7f71c5fed5/download/buildingpermitsexpired.csv
date_field: issuedate
date_format: {issuedate: mdy}
uid: foldernumber
doc_type: OTHER
doc_type_raw: {field: folderdesc}
consideration: permitvaluation
extra_pii: [gx_location, foldername]
skip_names: [NONE]
parties:
  - {role: owner, name: ownername}
  - {role: other, name: applicant}
  - {role: other, name: contractor, person_names: false}
parcel: {kind: pin, field: assessors_parcel_number, county_fips: "06085"}   # = ca.san_jose.parcels apn
terms:
  url: https://data.sanjoseca.gov/dataset/expired-building-permits
  summary: "City of San Jose open data portal (data.sanjoseca.gov, CKAN), free, no login or token. Dataset license (read 2026-11-25): Creative Commons CCZero. robots.txt disallows /api/ and /datastore/ but not /dataset/ downloads; the download redirects to the portal's S3 bucket (s3.amazonaws.com/robots.txt answers 403: RFC 9309, no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
