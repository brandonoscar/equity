source_id: vt.tax.property_transfers
state: VT
# Vermont Department of Taxes property transfer tax returns (32 V.S.A. 9606), published by
# VCGI as "VT Property Transfers" (ArcGIS Online, 238,242 returns on 2026-11-25, every deed
# transfer since 2019-01): seller and buyer (entity name, or last and first name) with their
# mailing addresses, the SPAN, close date, use before and after, exemptions and the tax paid.
# Loaded as DEED instruments (grantor = seller, grantee = buyer, with addresses) on the
# parcel. The SPAN is published without dashes ('78625010932'), so it is rewritten to the
# vt.statewide.parcels form ('786-250-10932'); the county comes from the town the return was
# located in (TOWNNAME), mapped as in config/states/vt.yaml. Additional sellers and buyers
# (addSellNam / addBuyrNam, free text) are not read. ValPdOrTrn (value paid or transferred)
# is the consideration.
api: arcgis
layer_url: https://services1.arcgis.com/BkFxaEFNwHqX3tAw/arcgis/rest/services/FS_VCGI_OPENDATA_Cadastral_PTTR_point_WM_v1_view/FeatureServer/0
order_by: [OBJECTID]
select: [OBJECTID, returnID, closeDate, recvdDate, span, TOWNNAME, ttlSellers, ttlBuyers,
         sellEntNam, sellLstNam, sellFstNam, sellerStrt, sellerCity, sellerSt, sellerZip,
         buyEntNam, buyLstNam, buyFstNam, buyerStrt, buyerCity, buyerState, buyerZip,
         ValPdOrTrn, TownBkNum, TownPgNum]
date_field: closeDate
rewrite:
  span: {pattern: "^(\\d{3})(\\d{3})(\\d{5})$", replace: "\\1-\\2-\\3"}
partition: year
first_year: 2019
uid: returnID
doc_type: DEED
doc_type_raw: Vermont property transfer tax return
consideration: ValPdOrTrn
county_name_field: TOWNNAME
