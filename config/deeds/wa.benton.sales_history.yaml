source_id: wa.benton.sales_history
state: WA
county_fips: "53005"
# Benton County WA assessor sales history ("SalesHistory", public ArcGIS Online layer owned by
# user BC_014 in the ArcGIS org that also publishes Benton County's 'Treasurers Building Permit'
# and permit layers; 360,381 rows on 2026-11-25, sale dates 1900 to 2022-04-12, not updated
# since): one row per property and change of ownership from the assessor's PACS system
# (prop_id, chg_of_owner_id, geo_id), with the deed type and excise / recording reference,
# sale date and price, the grantor (seller), and the living area and year built at sale.
# No buyer name is published. Loaded as DEED instruments (grantor = seller) on
# 53005-<geo_id> (the 15-digit Benton parcel number). TODO(Brandon): the publisher is not
# named on the item (no accessInformation or licenseInfo); confirm it is Benton County.
api: arcgis
layer_url: https://services7.arcgis.com/NURlY7V8UHl6XumF/arcgis/rest/services/SalesHistory/FeatureServer/0
order_by: [OBJECTID]
select: [OBJECTID, prop_id, chg_of_owner_id, sl_dt, sale_price, deed, book_id, deed_page,
         grantor, C_Name, ratio_cd, la_sqft, sl_yr_blt, sl_living_area, geo_id, primary_use]
date_field: sl_dt
partition: year
first_year: 1900
uid: [prop_id, chg_of_owner_id]
doc_type: DEED
doc_type_raw: {field: deed}
consideration: sale_price
parties:
  - role: grantor
    name: grantor
parcel: {kind: pin, field: geo_id, county_fips: "53005"}
terms:
  url: https://www.arcgis.com/home/item.html?id=9855238bcfb249d9a6b860f3f6a6d875
  summary: "Public ArcGIS Online layer 'SalesHistory' (owner BC_014), free, no login, token, fee or acknowledgement; the item carries no license, accessInformation or use constraint (read 2026-11-25). Washington's Public Records Act (RCW 42.56.070(9)) bars agencies from providing lists of individuals for commercial purposes: internal locate/link use only, no solicitation or resale. services7.arcgis.com/robots.txt answers 403 (RFC 9309: no rules)."
  checked_on: 2026-11-25
  robots_checked_on: 2026-11-25
  cost_model: free
