source_id: ct.cama.sales
state: CT
# Connecticut OPM / CT GIS Office "2026 Connecticut Parcel and CAMA Data" (data.ct.gov
# ibe8-9i3q, 1,359,259 rows on 2026-11-25): one row per parcel from each town assessor's CAMA
# system with its latest recorded sale: sale date, price, book/page, instrument code,
# qualified flag, sale grantor (seller) and sale grantee (buyer). Only those columns and the
# parcel link are read (the current owner, mailing address and building data are not).
# One DEED instrument per parcel and sale (grantor = seller, grantee = buyer) on
# <county>-<link>, the ct.statewide.parcels CAMA_Link ("<town cousub FIPS>-<town link>").
# sale_date is M/D/YYYY text (some towns add ' 12:00:00 AM'), so years are queried with
# LIKE and the date rewritten to ISO (config/deeds, equity.adapters.deeds). The county comes
# from the town (property_city), mapped as in config/states/ct.yaml (legacy counties).
# The 2024 / 2025 editions (pqrn-qghw, rny9-6ak2) keep earlier sales of parcels sold since;
# not loaded (they would duplicate this edition's instruments).
# TODO(Brandon): instrument codes are town-specific (Vision '00'..'25'); all loaded as DEED.
portal: https://data.ct.gov
dataset: ibe8-9i3q
order_by: [link, ":id"]
select: [link, property_city, town_id, sale_date, sale_price, book_page, instrument, qualified,
         validity_code, sale_grantor_name, sale_grantee_name]
date_field: sale_date
date_format: {sale_date: mdy}
partition: year
first_year: 1900
uid: [link, sale_date, book_page]
doc_type: DEED
doc_type_raw: Connecticut CAMA latest sale
consideration: sale_price
county_name_field: property_city
