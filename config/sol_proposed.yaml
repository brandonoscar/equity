# PROPOSED judgment-lien rules per state, from research (2026-11-23) — NOT confirmed.
# config/sol.yaml stays the confirmed table: it is filled only by Brandon (values need a
# statute and confirmed_by; tests/test_config.py). Review a state here, then copy the values
# you accept into sol.yaml with confirmed_by set. Nothing in code reads this file.
#
# lien_created_by: R = recording a certified copy / abstract / transcript / notice with the
#   county recorder or land records creates the lien; D = docketing or entry by the court
#   clerk creates it in the county of entry (other counties by transcript); X = no general
#   judgment lien (levy or attachment needed). Creation method and interest are from statute
#   knowledge, UNVERIFIED. Duration/renewal: White and Williams LLP chart, rev. 2020-01-20
#   (check post-2020 amendments, at least AZ, ID, GA). Homestead: NCLC 'No Fresh Start' 2025.
# Sources: research_notes/Data source gap analysis/courts.md section 6. Rows with
# statute_text_checked were re-read against statute text on 2026-11-25 (still unverified by
# the owner); docs/sol_schema_proposal.md proposes the dated rule layout sol.yaml needs.

