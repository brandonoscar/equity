source_id: tn.statewide.parcels
state: TN
layer_url: https://tnmap.tn.gov/arcgis/rest/services/ENVIRONMENTAL/COMPTROLLER_OLG_LANDUSE/MapServer/2
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
county_window: 20000      # each county in 20k-id windows, so one fetch fits a short session
# COUNTY holds upper-case county names; mapped to FIPS so county_fips partitioning works.
# The 86 counties whose CAMA the Comptroller maintains. Not in this layer: Chester, Davidson,
# Hamilton, Hickman, Knox, Montgomery, Rutherford, Shelby, Williamson.
