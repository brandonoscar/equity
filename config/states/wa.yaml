# DRAFT, not installed: services.arcgis.com answers /robots.txt with HTTP 403 ("Invalid URL"),
# which equity.adapters.http.PoliteClient treats as disallow-all. Verified live with curl 2026-11-15.
source_id: wa.statewide.parcels
state: WA
layer_url: https://services.arcgis.com/jsIt88o09Q0r1j8h/ArcGIS/rest/services/Current_Parcels/FeatureServer/0
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
county_window: 20000      # each county in 20k-id windows, so one fetch fits a short session
# COUNTY_NM holds the county FIPS number without leading zeros ("1", "33") for most counties and
# a name for four ("GraysHarbor", "PendOreille", "SanJuan", "Walla Walla"). FIPS_NR is null for
# every Asotin row, so COUNTY_NM is the only complete county key.
county:
  field: COUNTY_NM
  format: code_map
  code_map: {
    "001": "001", "1": "001", "003": "003", "3": "003", "005": "005", "5": "005",
    "007": "007", "7": "007", "009": "009", "9": "009", "011": "011", "11": "011",
    "013": "013", "13": "013", "015": "015", "15": "015", "017": "017", "17": "017",
    "019": "019", "19": "019", "021": "021", "21": "021", "023": "023", "23": "023",
    "025": "025", "25": "025", "027": "027", "27": "027", "029": "029", "29": "029",
    "031": "031", "31": "031", "033": "033", "33": "033", "035": "035", "35": "035",
    "037": "037", "37": "037", "039": "039", "39": "039", "041": "041", "41": "041",
    "043": "043", "43": "043", "045": "045", "45": "045", "047": "047", "47": "047",
    "049": "049", "49": "049", "051": "051", "51": "051", "053": "053", "53": "053",
