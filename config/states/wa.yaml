    "SanJuan": "055", "San Juan": "055", "Walla Walla": "071", "WallaWalla": "071"
  }
fields:
  situs_line1: SITUS_ADDRESS
  situs_city: SITUS_CITY_NM
  situs_zip: SITUS_ZIP_NR
  parcel_id: ORIG_PARCEL_ID
  land_value: VALUE_LAND
  bldg_value: VALUE_BLDG
  tax_year: {const: 2026}
value_basis: "VALUE_LAND = 'Market Land Value', VALUE_BLDG = 'Market Building Value' as supplied by each county assessor (no total field); layer is the annual 'Parcels_2026' snapshot (updated April 2026) with no tax-year field, so tax_year is the constant 2026 (snapshot vintage), not a certified roll year"
