  assessed_value: asedValTot
  tax_year: {const: 2026}
value_basis: "apprValTot = 'Parcel Total Value' and asedValTot = 'Taxable Value', both as sent by each county assessor (text fields); OIT received the county extracts Mar-Oct 2026 (dateReceived); the layer has no tax-year field, so tax_year is the constant 2026 (extract vintage), not a certified roll year"
