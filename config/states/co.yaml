source_id: co.statewide.parcels
state: CO
layer_url: https://gis.colorado.gov/Public/rest/services/Address_and_Parcel/Colorado_Public_Parcels/MapServer/0
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
# countyFips is text and inconsistent: some counties send "001", others "27" (no leading zero).
# code_map accepts both spellings so county-partitioned queries match every row.
county:
  field: countyFips
  format: code_map
  code_map: {
    "001": "001", "1": "001", "003": "003", "3": "003", "005": "005", "5": "005",
