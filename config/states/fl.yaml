source_id: fl.statewide.parcels
state: FL
layer_url: https://services9.arcgis.com/Gh9awoU677aKree0/arcgis/rest/services/Florida_Statewide_Cadastral/FeatureServer/0
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
