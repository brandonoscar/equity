fields:
  situs_line1: PHY_ADDR1
  situs_city: PHY_CITY
  situs_zip: PHY_ZIPCD
  homestead: JV_HMSTD
  parcel_id: PARCEL_ID
  owner1: OWN_NAME
  mail_line1: OWN_ADDR1
  mail_line2: OWN_ADDR2
  mail_city: OWN_CITY
  mail_state: OWN_STATE
  mail_zip: OWN_ZIPCD
  land_value: LND_VAL
  total_value: JV
  assessed_value: AV_SD
  tax_year: ASMNT_YR
  deed_book: OR_BOOK1
  deed_page: OR_PAGE1
value_basis: "JV = just (market) value; AV_SD = assessed value for school-district levy; LND_VAL = land value; ASMNT_YR = assessment year of the joined NAL roll; OR_BOOK1/OR_PAGE1 = official-records book/page of the most recent qualified sale"
terms:
  url: https://floridarevenue.com/property/Pages/DataPortal_RequestAssessmentRollGISData.aspx
  summary: "FDOR Property Tax Oversight PAR parcels (county PA shapefiles joined to the NAL roll) hosted by the Florida GIO; free, no login. Item licenseInfo: 'The Department does not generate or maintain the data used to compile this statewide parcel map. The Department does not guarantee the accuracy, or completeness, or the compliance with public records laws of this parcel GIS data. The data is owned and maintained by each Florida county's property appraiser's office'. Published as public records under ch. 119 F.S.; records exempt under s.119.071 are omitted. No commercial-use or mailing-list restriction stated."
