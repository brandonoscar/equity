source_id: nc.statewide.parcels
state: NC
layer_url: https://services.nconemap.gov/secure/rest/services/NC1Map_Parcels/FeatureServer/1
order_by: objectid
page_size: 1000
min_interval_s: 1.0
county_window: 20000      # each county in 20k-id windows, so one fetch fits a short session
county:
  field: stcntyfips   # cntyfips is not zero-padded for every county ("5", "43"); stcntyfips is
  format: fips5
fields:
  situs_line1: siteadd
  situs_city: scity
  situs_zip: szip
  owner_type: owntype
  parcel_id: parno
  owner1: ownname
  owner2: ownname2
  mail_line1: mailadd
  mail_line2: munit
  mail_city: mcity
  mail_state: mstate
  mail_zip: mzip
  land_value: landval
  bldg_value: improvval
  total_value: parval
  tax_year: {year_of: transfdate}
value_basis: "landval/improvval/parval = county-reported land, improvement and total parcel value; the per-row field parvaltype says which kind (statewide counts 2026-11-15: Assessed 4.43M, Market 1.08M, Appraised 0.33M, Taxable 48k, blank 56k); tax year = year of transfdate (ICDE transform date of the county extract), not a source tax-year field"
terms:
  url: https://www.nconemap.gov/pages/terms
  summary: "NC OneMap / NC CGIA ICDE aggregated parcels from all 100 county producers plus Eastern Band of Cherokee lands; free, no login; layer licenseInfo is a not-a-survey disclaimer citing a 1982 NC AG opinion and links the terms page. Terms page (read 2026-11-16, Hub page e60514c3b78542ef9902e3d7f7a671c1): CGIA offers State geospatial data 'at no charge' and partners share content under a 'free and unrestricted use policy'; no warranty or liability; 'Written release agreements to authorize use ... are not required and will not be issued'; 'Any sale of this data must not violate applicable state laws or regulations'; requested citation: 'NC OneMap (2019). North Carolina Department of Information Technology, Government Data Analytics Center, Center for Geographic Information and Analysis. Available at www.nconemap.gov.' No mailing-list, resale or commercial-use ban on the page itself. Counties' own resale/commercial-use conditions under G.S. 132-10 may apply (e.g. Buncombe can require a written no-resale agreement); a 2022 NCDIT/GICC review of the disclaimer for resale and commercial use found no adopted outcome. Mailing address formatting varies by county (some counties put 'CITY ST ZIP' in mcity)"
  checked_on: 2026-11-15
  robots_checked_on: 2026-11-15
  cost_model: free
