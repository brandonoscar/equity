state: ME
# Maine GeoLibrary Organized Towns ADB attribute table (owner, mailing address, last sale);
# polygons are layer 10 (same service), joined on STATE_ID.
layer_url: https://services1.arcgis.com/RbMX0mRVOFNTdLzd/ArcGIS/rest/services/Maine_Parcels_Organized_Towns/FeatureServer/9
