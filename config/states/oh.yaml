# DRAFT, not installed: blocked because services2.arcgis.com answers /robots.txt with HTTP 403
# ("Invalid URL", no robots file published) and PoliteClient treats 401/403 as disallow-all.
# The ODNR copy (gis.ohiodnr.gov) is excluded by its robots.txt (Disallow: /).
# Table 1 (Cama) carries owner Name; layer 0 (Parcels) carries the mailing address. No values in either.
source_id: oh.statewide.parcels
state: OH
layer_url: https://services2.arcgis.com/MlJ0G8iWUyC7jAmu/arcgis/rest/services/OhioStatewidePacels_full_view/FeatureServer/1
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
county:
  field: County
  format: name
situs_form: line_city_zip   # SitusAddressAll has no commas or state: split after the street suffix
fields:
  land_use_code: StateLUC
  situs_full: SitusAddressAll   # "70 ANGELA RD PEEBLES 45660": see situs_form
  parcel_id: LocalParcelID
  # Name is a placeholder on every row, "<county FIPS> | <LocalParcelID>" (6,228,867 of
  # 6,228,867 on 2026-11-23): the public view withholds owner names statewide. Kept mapped so
  # each parcel has an owner party for parcel-keyed liens; no person or company can match it
  # by name. Real owner names are with the 88 county auditors.
  owner1: Name
value_basis: "no value fields in the public view; values are with the 88 county auditors"
terms:
  url: https://ohioparcels-geohio.hub.arcgis.com/
  summary: "OGRIP (Ohio DAS) Ohio Statewide Parcels Public View, 88 counties; licenseInfo: 'available for public use at the user's own risk and provided for informational purposes only', 'as is', no commercial-use clause"
  checked_on: 2026-11-15
  robots_checked_on: 2026-11-15
  cost_model: free
