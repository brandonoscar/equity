fields:
  parcel_id: MA_PROP_ID       # MassGIS-assigned, unique statewide (M<town>_<PROP_ID>)
  owner1: OWNER1
  mail_line1: OWN_ADDR
  mail_city: OWN_CITY
  mail_state: OWN_STATE
  mail_zip: OWN_ZIP
  land_value: LAND_VAL
  bldg_value: BLDG_VAL
  total_value: TOTAL_VAL
  tax_year: FY
  deed_book: LS_BOOK
  deed_page: LS_PAGE
value_basis: "LAND_VAL/BLDG_VAL/TOTAL_VAL = current assessed values from the municipal assessor (MassGIS L3 standard: 'Current total assessed value for land and structures'; TOTAL_VAL may include categories not in land+bldg, OTHER_VAL not mapped); FY = fiscal year of the assessed value (MA fiscal year starts July 1)"
assessment_valid_from: prior_july1
terms:
  url: https://www.mass.gov/info-details/massgis-data-property-tax-parcels
  summary: "MassGIS (EOTSS) standardized assessor parcels, free download/REST, no license text found; service licenseInfo: 'Assessor's parcel mapping is a representation of property boundaries, not an authoritative source.' No commercial-use or mailing-list restriction found. Municipal FY vintages vary (some towns years stale)."
  checked_on: 2026-11-15
  robots_checked_on: 2026-11-15
  cost_model: free
