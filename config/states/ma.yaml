source_id: ma.statewide.parcels
state: MA
# MassGIS Level 3 standardized assessor extract (L3_ASSESS table): one row per assessor record,
# owner, mailing address, values and last-sale book/page. Joins to parcel polygons on LOC_ID.
layer_url: https://arcgisserver.digital.mass.gov/arcgisserver/rest/services/AGOL/MassachusettsPropertyTaxParcels/FeatureServer/4
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
# TOWN_ID is the MassGIS town identifier (1-351). Map built from MassGIS Census2020_Towns
# (TOWN_ID -> COUNTYFP20). TOWN_ID is an integer field, so fetch by oid_min/oid_max: the
# code_map county_fips where clause quotes the code and this server rejects TOWN_ID='55'.
