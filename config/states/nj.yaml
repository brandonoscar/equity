source_id: nj.statewide.parcels
state: NJ
# NJOGIS "Parcels and MOD-IV Composite of NJ": statewide parcel polygons with matched MOD-IV
# tax-list attributes. Owner names are redacted (Daniel's Law), so no owner fields.
layer_url: https://services2.arcgis.com/XVOqAjTOJ5P6ngMu/arcgis/rest/services/Parcels_Composite_NJ_WM/FeatureServer/0
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
county_window: 20000      # each county in 20k-id windows, so one fetch fits a short session
# PCL_MUN = 4-digit NJ municipality code; first two digits are the NJ county code (01 Atlantic
# ... 21 Warren, alphabetical), FIPS = 2*code-1. COUNTY (name) is null on ~403k unmatched
# parcels, PCL_MUN never is. Checked against PCL_MUN/COUNTY pairs: 564 municipalities, no conflicts.
