source_id: tn.owners.parcels
state: TN
# TN Comptroller (Division of Property Assessments) "Tennessee Property Boundaries Public Use"
# hosted layer: 2,144,655 parcels in 86 counties on 2026-11-25 (the 9 counties outside the
# state assessment system, e.g. Davidson, Shelby, Knox, Hamilton, are absent). Owner and
# co-owner names, site address; no mailing address and no values. GISLINK is the same parcel
# key as tn.statewide.parcels (land-use layer with values), so the two join on parcel_id.
layer_url: https://services1.arcgis.com/YuVBSS7Y1of2Qud1/arcgis/rest/services/Tennessee_Property_Boundaries_Public_Use/FeatureServer/0
order_by: OBJECTID
page_size: 2000          # maxRecordCount 2000; supportsPagination true
min_interval_s: 1.0
county_window: 20000
