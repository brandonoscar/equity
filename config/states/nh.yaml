source_id: nh.statewide.parcels
state: NH
# NH Dept. of Revenue Administration Parcel Mosaic (hosted by UNH GRANIT). Public layer has
# parcel ids, town, land-use code and situs street only: no owner, no values.
layer_url: https://nhgeodata.unh.edu/nhgeodata/rest/services/CAD/ParcelMosaic/MapServer/1
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
# TownID -> county FIPS. CountyId (1-10, alphabetical: Belknap=1 ... Sullivan=10) is null on
# about 15.7k rows but TownID is always set; this map was built from the layer's own
