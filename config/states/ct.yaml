fields:
  parcel_id: CAMA_Link        # "<town cousub FIPS>-<link>", unique statewide; Parcel_ID is town-scoped
  owner1: Owner
  owner2: Co_Owner
  mail_line1: Mailing_Address
  mail_city: Mailing_City
  mail_state: Mailing_State
  mail_zip: Mailing_Zip
  land_value: Appraised_Land
  bldg_value: Appraised_Building
  assessed_value: Assessed_Total
  tax_year: CAMA_Collection_Year
value_basis: "Appraised_Land/Appraised_Building = town CAMA appraised values (no appraised-total field; Appraised_Outbuilding not mapped); Assessed_Total = town assessed total (CT assesses at 70% of appraised); tax_year = CAMA_Collection_Year, the year the CT GIS Office collected the town CAMA extract, not the grand-list year (Valuation_Year = last revaluation year, not mapped)"
terms:
  url: https://portal.ct.gov/datapolicy/home/gis-office/parcel-and-cama
