source_id: ct.statewide.parcels
state: CT
# CT OPM / CT GIS Office seamless parcels joined to town CAMA (one row per parcel polygon).
layer_url: https://services3.arcgis.com/3FL1kr7L4LvwA2Kb/ArcGIS/rest/services/Connecticut_CAMA_and_Parcel_Layer/FeatureServer/0
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
county_window: 20000      # each county in 20k-id windows, so one fetch fits a short session
# Town_Name -> 2020 Census legacy county. FIPS (a tract GEOID) leaks across town lines, so the
# map uses each town's majority tract county; counts per county match the 8 legacy counties.
