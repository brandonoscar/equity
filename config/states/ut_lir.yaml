order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
# Required key; every layer above sets its own county constant, which takes precedence.
county:
  constant: "001"
fields:
  land_use_desc: PROP_CLASS
  situs_line1: PARCEL_ADD
  situs_city: PARCEL_CITY
  parcel_id: PARCEL_ID
  land_value: LAND_MKT_VALUE
  total_value: TOTAL_MKT_VALUE
  tax_year: {year_of: CURRENT_ASOF}
value_basis: "TOTAL_MKT_VALUE / LAND_MKT_VALUE = market value of the parcel (land + structures + other improvements) and of the land 'as determined by the Assessor for the most current tax year' (LIR schema); the LIR product is meant to follow each county's tax-roll finalization (May 22). No improvement-only or taxable/assessed field (Utah taxes primary residences on 55% of market value; not applied here). tax_year = year of CURRENT_ASOF, the county's 'parcels current as of' date, one value per county on 2026-11-16: 2026 for Cache, Kane, Morgan, Piute, Rich, Salt Lake, Utah, Washington, Weber; 2025 for Beaver, Carbon, Davis, Duchesne, Garfield, Grand, Juab, Millard, Sanpete, Sevier, Summit, Tooele, Uintah, Wayne; 2024 for Daggett, Emery, Iron, San Juan, Wasatch; 2020 for Box Elder. Value fill varies (e.g. Davis 81,543 of 152,563 rows, Sanpete 3,356 of 12,976, Carbon 11,448 of 26,736 carry TOTAL_MKT_VALUE). No owner or mailing fields (HB113)."
terms:
  url: https://gis.utah.gov/products/sgid/cadastre/parcels/
  summary: "UGRC SGID Parcels_<County>_LIR, 29 per-county layers built from county assessor tax-roll extracts under the voluntary LIR work-group program; 1,771,774 rows in all on 2026-11-16 (Salt Lake 399,432; Utah 289,858; Weber 153,163; Davis 152,563). AGOL item licenseInfo (e.g. 'Utah Salt Lake County Parcels LIR'): provided 'as is' for informational purposes only, no warranty, hold-harmless, and 'licensed under a Creative Commons Attribution 4.0 International License'. UGRC parcels page: 'There are no constraints or warranties with regard to the use of this dataset. Users are encouraged to attribute content to: State of Utah, SGID.' Each row's DISCLAIMER field points to http://www.utah.gov/disclaimer.html. services1.arcgis.com /robots.txt answers 403 (RFC 9309: no rules); gis.utah.gov robots allows all."
  checked_on: 2026-11-16
  robots_checked_on: 2026-11-16
  cost_model: free
