  situs_city: SITE_CITY
  situs_zip: SITE_ZIP
  homestead: HOME_EXMPT
  parcel_id: PARCEL_ID
  owner1: OWNER1
  owner2: OWNER2
  mail_line1: MAIL_ADD1
  mail_line2: MAIL_ADD2
  mail_city: MAIL_CITY
  mail_state: MAIL_STATE
  mail_zip: MAIL_ZIP
  land_value: VAL_LAND
  bldg_value: VAL_IMPVTS
  total_value: VAL_TOTAL
  tax_year: {year_of: UPDATED}
value_basis: "VAL_LAND / VAL_IMPVTS / VAL_TOTAL = county assessor land, improvement and total values per the Idaho Parcel Data Exchange Standard (S4232); no tax-year field, so tax_year = year of UPDATED (county submission date, 2024-2025); values present for 8 of 13 counties"
terms:
  url: https://services1.arcgis.com/CNPdEkvnGl65jCX8/arcgis/rest/services/Public_Idaho_Parcels_/FeatureServer/info/iteminfo
  summary: "Idaho ITS 'Public Idaho Parcels' (13 of 44 counties, 381,144 rows on 2026-11-15). License: no warranty, use at user's sole risk; 'Pursuant to Idaho Code 74-120, the information provided by the County is not being distributed for use as a mailing list or telephone number list, and no list of persons prepared by County may be used as a mailing list or a telephone list unless such use is expressly permitted by Idaho law.'"
