# which equity.adapters.http.PoliteClient treats as disallow-all. Verified live with curl 2026-11-15.
# Also read the Idaho Code 74-120 mailing-list term below before using owner/mailing fields.
source_id: id.statewide.parcels
state: ID
layer_url: https://services1.arcgis.com/CNPdEkvnGl65jCX8/arcgis/rest/services/Public_Idaho_Parcels_/FeatureServer/7
order_by: OBJECTID
page_size: 1000
min_interval_s: 1.0
county_window: 20000      # each county in 20k-id windows, so one fetch fits a short session
# County holds the county name; FIPS (5-digit) is null on 220 Nez Perce rows, so key on the name.
county:
  field: County
  format: code_map
  code_map: {
    "Ada": "001", "Adams": "003", "Bannock": "005", "Bear Lake": "007", "Benewah": "009", "Bingham": "011",
    "Blaine": "013", "Boise": "015", "Bonner": "017", "Bonneville": "019", "Boundary": "021", "Butte": "023",
    "Camas": "025", "Canyon": "027", "Caribou": "029", "Cassia": "031", "Clark": "033", "Clearwater": "035",
    "Custer": "037", "Elmore": "039", "Franklin": "041", "Fremont": "043", "Gem": "045", "Gooding": "047",
    "Idaho": "049", "Jefferson": "051", "Jerome": "053", "Kootenai": "055", "Latah": "057", "Lemhi": "059",
    "Lewis": "061", "Lincoln": "063", "Madison": "065", "Minidoka": "067", "Nez Perce": "069", "Oneida": "071",
    "Owyhee": "073", "Payette": "075", "Power": "077", "Shoshone": "079", "Teton": "081", "Twin Falls": "083",
    "Valley": "085", "Washington": "087"
