# What kind of debt each judgment / lien source carries, so a debtor's debts can be told
# apart (a court money judgment is not a tax delinquency). The row's own doc_type still says
# what each instrument is; this is the source-level label used in match outputs (people
# .parquet debt_kinds, summary.json by kind). Every debtor, court and writ source of a match
# run must be listed here (tests/test_debt_kinds.py).
kinds:
  court_judgment: money judgment entered by a court (incl. judgments enforced by a writ)
  recorded_judgment_or_lien: recorder / official-records index entry (judgments, liens, mixed)
  administrative_judgment: liability finding by an administrative hearing body, docketed or enforceable like a judgment
  administrative_order: agency order assessing a penalty or debt, not a court judgment
  tax_warrant: state tax (or child-support) warrant with the effect of a docketed judgment
  tax_lien: tax lien filed or docketed against the debtor or parcel
  tax_delinquency: delinquent tax account or list, no lien filing stated
  code_enforcement_charge: city charge for code-enforcement work, fines or fees on a property
  code_enforcement_lien: code-enforcement charge recorded as a lien
  statutory_lien: other lien created by statute (UCC, labor, utility)
  foreclosure: foreclosure filing or sheriff-sale judgment (counted, not added to open amounts)
  housing_court_case: housing court litigation against an owner
  eviction: eviction executed by a city marshal
  charged_off_loan: federally guaranteed loan the lender charged off (a default, not a judgment)
